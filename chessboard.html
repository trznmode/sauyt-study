<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Шахматка Urban Hotel</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600;700&family=Unbounded:wght@500;600&display=swap">
<style>
/* Layout: PMS-экран — входящие слева, шахматка и карточка брони справа; на телефоне всё в одну колонку */
:root{
  --bg:#EDF1F3; --surface:#FFFFFF; --sunk:#F4F7F9; --ink:#14202A; --muted:#5A6773; --line:#D3DBE1;
  --accent:#0E6A5B; --accent-ink:#FFFFFF; --accent-soft:#DCEFEA;
  --good:#1D7A49; --good-soft:#E1F2E8; --bad:#BF3328; --bad-soft:#F8E3E0; --warn:#A8620B; --warn-soft:#FBEEDB;
  --c-booking:#2856BF; --c-ostrovok:#D0621F; --c-bronevik:#7346BC; --c-trip:#13808F; --c-corp:#3E6A38; --c-direct:#94711B; --c-group:#B23A6B; --c-service:#5F6B76; --c-event:#C2185B;
  --weekend:#E3E9ED; --bar-ink:#FFFFFF; --shadow:0 10px 30px rgba(20,32,42,.12);
  --f-display:'Unbounded','IBM Plex Sans',system-ui,sans-serif;
  --f-body:'IBM Plex Sans',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --f-mono:'IBM Plex Mono',ui-monospace,SFMono-Regular,Menlo,Consolas,monospace;
  --cell:56px; --roomcol:132px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E151B; --surface:#16202A; --sunk:#111A22; --ink:#E5ECF1; --muted:#93A1AD; --line:#283642;
  --accent:#3DB79C; --accent-ink:#06231D; --accent-soft:#183A33;
  --good:#4CC384; --good-soft:#163527; --bad:#F06F62; --bad-soft:#3E1D1A; --warn:#E6A44A; --warn-soft:#3A2A14;
  --c-booking:#3F6FDB; --c-ostrovok:#D9743A; --c-bronevik:#8B62D4; --c-trip:#2399AA; --c-corp:#4E8146; --c-direct:#AD8A2E; --c-group:#D25A8A; --c-service:#8794A0; --c-event:#F06292;
  --weekend:#1B2731; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0E151B; --surface:#16202A; --sunk:#111A22; --ink:#E5ECF1; --muted:#93A1AD; --line:#283642;
  --accent:#3DB79C; --accent-ink:#06231D; --accent-soft:#183A33;
  --good:#4CC384; --good-soft:#163527; --bad:#F06F62; --bad-soft:#3E1D1A; --warn:#E6A44A; --warn-soft:#3A2A14;
  --c-booking:#3F6FDB; --c-ostrovok:#D9743A; --c-bronevik:#8B62D4; --c-trip:#2399AA; --c-corp:#4E8146; --c-direct:#AD8A2E; --c-group:#D25A8A; --c-service:#8794A0; --c-event:#F06292;
  --weekend:#1B2731; --shadow:0 10px 30px rgba(0,0,0,.45); color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;flex-wrap:wrap;align-items:center;gap:10px 18px}
.brand{display:flex;flex-direction:column;min-width:0}
.logo{height:46px;aspect-ratio:530/359;flex:none;display:grid;place-items:center}
.logo img{width:100%;height:100%;object-fit:contain}
.dh.last{color:var(--muted);opacity:.75}
.brand b{font-family:var(--f-display);font-weight:600;font-size:16px;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:12px}
.stats{display:flex;flex-wrap:wrap;gap:6px 16px;align-items:center;margin-left:auto}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat small{font-size:10.5px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted)}
.stat b{font-family:var(--f-mono);font-weight:500;font-size:15px;font-variant-numeric:tabular-nums}
.actions{display:flex;flex-wrap:wrap;gap:8px}
.btn{border:1px solid var(--line);background:var(--surface);padding:7px 12px;border-radius:6px;font-weight:500;white-space:nowrap}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.ghost{border-color:transparent;background:transparent;color:var(--muted)}

/* App grid */
.app{display:grid;grid-template-columns:300px minmax(0,1fr);gap:16px;align-items:start;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 40px}
@media (max-width:960px){.app{grid-template-columns:minmax(0,1fr)}}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:10px;min-width:0}
.ph{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:12px 14px;border-bottom:1px solid var(--line)}
.ph h2{margin:0;font-family:var(--f-display);font-weight:500;font-size:13px;letter-spacing:.02em}
.ph .meta{color:var(--muted);font-size:12px}

/* Inbox */
.inbox{position:sticky;top:76px;max-height:calc(100vh - 100px);display:flex;flex-direction:column}
@media (max-width:960px){.inbox{position:static;max-height:360px}}
.inlist{overflow:auto;padding:8px;display:flex;flex-direction:column;gap:6px}
.req{display:grid;grid-template-columns:auto minmax(0,1fr) auto;gap:4px 10px;align-items:center;text-align:left;width:100%;
  border:1px solid var(--line);background:var(--sunk);border-radius:8px;padding:9px 10px}
.req:hover{border-color:var(--muted)}
.req.active{border-color:var(--accent);background:var(--accent-soft)}
.req .no{font-family:var(--f-mono);font-size:12px;color:var(--muted);grid-row:span 2}
.req .who{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.req .sub{grid-column:2/4;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center;font-size:12px;color:var(--muted);min-width:0}
.req .sub .num{white-space:nowrap}
.req.unseen .who::after{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--warn);margin-left:6px;vertical-align:middle}
.st{font-size:11px;font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}
.st.new{background:var(--warn-soft);color:var(--warn)}
.st.work{background:var(--accent-soft);color:var(--accent)}
.st.done{background:var(--sunk);color:var(--muted);border:1px solid var(--line)}
.st.ok{background:var(--good-soft);color:var(--good)}
.st.err{background:var(--bad-soft);color:var(--bad)}
.ch{display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;white-space:nowrap}
.ch i{width:9px;height:9px;border-radius:2px;display:inline-block;background:var(--cc)}
.empty{padding:18px 14px;color:var(--muted);font-size:13px}
.next{padding:10px 14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:8px;font-size:12px;color:var(--muted)}

/* Board */
.main{display:flex;flex-direction:column;gap:16px;min-width:0}
.boardwrap{overflow-x:auto;padding:0 0 4px}
.board{min-width:calc(var(--roomcol) + var(--cell) * 15);user-select:none}
.row{display:grid;grid-template-columns:var(--roomcol) repeat(30,calc(var(--cell) / 2));height:40px;border-bottom:1px solid var(--line)}
.row.head{height:46px;position:sticky;top:0}
.row.catsep{border-top:2px solid var(--line)}
.rl{grid-row:1;grid-column:1;position:sticky;left:0;z-index:3;background:var(--surface);display:flex;flex-direction:column;justify-content:center;padding:0 10px;border-right:1px solid var(--line)}
.rl b{font-family:var(--f-mono);font-weight:600;font-size:13.5px}
.rl span{font-size:11px;color:var(--muted);white-space:nowrap}
.dh{grid-row:1;display:flex;flex-direction:column;align-items:center;justify-content:center;border-right:1px solid var(--line);font-size:11px;color:var(--muted)}
.dh b{font-family:var(--f-mono);font-size:14px;color:var(--ink);font-weight:500}
.dh.we,.c.we{background:var(--weekend)}
.dh.today b{color:var(--accent)}
.dh.today{box-shadow:inset 0 -3px 0 var(--accent)}
.c{grid-row:1;border-right:1px solid var(--line);cursor:pointer}
.c:hover{background:var(--accent-soft)}
.c.anchor{background:var(--accent);opacity:.55}
.c.prev{background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.bar{grid-row:1;z-index:2;margin:5px 2px;border-radius:5px;background:var(--cc);color:var(--bar-ink);font-size:11.5px;font-weight:600;
  display:flex;align-items:center;gap:6px;padding:0 7px;overflow:hidden;white-space:nowrap;border:0;text-align:left;min-width:0}
.bar span{overflow:hidden;text-overflow:ellipsis}
.bar em{font-style:normal;font-family:var(--f-mono);font-weight:500;opacity:.85;font-size:10.5px}
.bar.tent{background:repeating-linear-gradient(135deg,var(--cc) 0 8px,color-mix(in srgb,var(--cc) 70%,transparent) 8px 16px);pointer-events:none;box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--cc)}
.bar.pending{opacity:.75;background:repeating-linear-gradient(135deg,var(--cc) 0 8px,color-mix(in srgb,var(--cc) 70%,transparent) 8px 16px)}
.bar.err{box-shadow:0 0 0 2px var(--bad)}
.bar.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;padding:10px 14px;border-top:1px solid var(--line);font-size:12px;color:var(--muted)}
.hintline{font-size:12.5px;color:var(--muted)}
.hintline b{color:var(--ink)}

/* Work card */
.work{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:0}
@media (max-width:760px){.work{grid-template-columns:minmax(0,1fr)}}
.letter{padding:16px;border-right:1px solid var(--line);min-width:0}
@media (max-width:760px){.letter{border-right:0;border-bottom:1px solid var(--line)}}
.lhead{display:flex;flex-wrap:wrap;align-items:center;gap:8px;margin-bottom:10px}
.lfrom{font-size:12px;color:var(--muted)}
.ltitle{font-family:var(--f-display);font-weight:500;font-size:15px;margin:0 0 10px}
.lbody{white-space:pre-wrap;background:var(--sunk);border:1px solid var(--line);border-left:4px solid var(--cc);border-radius:6px;padding:12px 14px;font-size:13.5px;line-height:1.55;overflow-wrap:anywhere}
.calc{padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.place{border:1px dashed var(--line);border-radius:8px;padding:10px 12px;font-size:13px;display:flex;align-items:center;justify-content:space-between;gap:8px;flex-wrap:wrap}
.place.set{border-style:solid;border-color:var(--accent);background:var(--accent-soft)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px}
@media (max-width:420px){.fields{grid-template-columns:1fr}}
.f{display:flex;flex-direction:column;gap:4px;min-width:0}
.f label{font-size:12px;font-weight:600}
.f small{font-size:11px;color:var(--muted)}
.f input{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:8px 10px;font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:14px;width:100%}
.f input:focus{border-color:var(--accent);outline:none;background:var(--surface)}
.f.ok input{border-color:var(--good);background:var(--good-soft)}
.f.bad input{border-color:var(--bad);background:var(--bad-soft)}
.f .right{font-family:var(--f-mono);font-size:11.5px;color:var(--good)}
.feedback{border-radius:8px;padding:12px;font-size:13px;background:var(--sunk);border:1px solid var(--line)}
.feedback h3{margin:0 0 6px;font-size:13px}
.fl{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;font-size:12.5px}
.fl span:nth-child(even){font-family:var(--f-mono);text-align:right;white-space:nowrap}
.fl .tot{font-weight:600;border-top:1px solid var(--line);padding-top:4px;margin-top:2px}
.mark{font-weight:700}
.mark.ok{color:var(--good)} .mark.bad{color:var(--bad)}
.howto{padding:18px 16px;display:grid;gap:10px;font-size:13.5px;max-width:70ch}
.howto ol{margin:0;padding-left:20px;display:grid;gap:6px}

/* Modals */
.ov{position:fixed;inset:0;z-index:50;background:rgba(10,18,24,.55);display:flex;align-items:flex-start;justify-content:center;overflow:auto;
  padding-top:calc(24px + env(safe-area-inset-top,0px));padding-bottom:calc(24px + env(safe-area-inset-bottom,0px));
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.modal{background:var(--surface);border-radius:12px;box-shadow:var(--shadow);width:100%;max-width:760px;min-width:0;border:1px solid var(--line);margin-inline:auto}
.modal.narrow{max-width:520px}
.mh{padding:18px 20px 10px;display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.mh h2{margin:0;font-family:var(--f-display);font-weight:600;font-size:19px;text-wrap:balance}
.mb{padding:4px 20px 20px;display:grid;grid-template-columns:minmax(0,1fr);gap:14px}
.mb>*{min-width:0}
.mb p{margin:0;max-width:65ch}
.lbl{font-size:11px;text-transform:uppercase;letter-spacing:.07em;color:var(--muted);font-weight:600}
.opt{display:grid;gap:6px}
.seg{display:flex;flex-wrap:wrap;gap:6px}
.seg label{display:flex;gap:8px;align-items:flex-start;border:1px solid var(--line);border-radius:8px;padding:9px 11px;cursor:pointer;flex:1 1 200px}
.seg label:has(input:checked){border-color:var(--accent);background:var(--accent-soft)}
.seg small{display:block;color:var(--muted);font-size:12px}
.tin{border:1px solid var(--line);background:var(--sunk);border-radius:6px;padding:9px 11px;width:100%}
.twocol{display:grid;grid-template-columns:1fr 1fr;gap:12px}
@media (max-width:480px){.twocol{grid-template-columns:1fr}}
.tw{overflow-x:auto;-webkit-overflow-scrolling:touch}
@media (max-width:600px){
  .mb{padding:4px 14px 16px}
  .mh{padding:14px 14px 8px}
  .mh h2{font-size:17px}
  table{font-size:12.5px}
  th,td{padding:6px 6px}
  .rates-alias{display:none}
}
table{border-collapse:collapse;width:100%;font-size:13px}
th,td{text-align:left;padding:6px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{font-size:11px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);font-weight:600}
td.n,th.n{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.rules{margin:0;padding-left:18px;display:grid;gap:4px;font-size:13px}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.kpi{background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:10px 12px}
.kpi small{display:block;font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.05em}
.kpi b{font-family:var(--f-mono);font-size:18px;font-weight:600;font-variant-numeric:tabular-nums}
.big{font-family:var(--f-display);font-size:42px;font-weight:600;line-height:1}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom,0px));z-index:60;background:var(--ink);color:var(--bg);
  padding:10px 16px;border-radius:8px;font-size:13px;box-shadow:var(--shadow);max-width:min(90vw,520px)}
details summary{cursor:pointer;font-weight:600}
@media (prefers-reduced-motion:no-preference){.req.fresh{animation:drop .5s ease-out}@keyframes drop{from{transform:translateY(-8px);background:var(--warn-soft)}to{transform:none}}}

/* Mobile: вкладки вместо длинной прокрутки */
.tabbar{display:none}
.boardreq{display:none}
.m-only{display:none}
@media (max-width:760px){
  :root{--cell:46px;--roomcol:64px}
  .top{gap:6px 12px;padding-block:8px}
  .logo{height:34px}
  .brand b{font-size:14px}
  .brand span{display:none}
  .stats{gap:4px 14px}
  .stat.opt{display:none}
  .stat b{font-size:14px}
  .top .actions{display:none}
  .app{gap:12px;padding-block:12px calc(88px + env(safe-area-inset-bottom,0px))}
  .app[data-view="inbox"] .main{display:none}
  .app[data-view="board"] .inbox,.app[data-view="board"] #workpanel{display:none}
  .app[data-view="work"] .inbox,.app[data-view="work"] #boardpanel{display:none}
  .inbox{max-height:none}
  .rl{padding:0 8px}
  .rl .cn{display:none}
  .row{height:46px}
  .bar{font-size:11px;padding:0 5px;gap:4px}
  .ph{flex-wrap:wrap}
  .legend{font-size:11.5px}
  .boardreq{display:block;border-bottom:1px solid var(--line);padding:8px 14px}
  .boardreq summary{font-size:13px}
  .boardreq .lbody{margin-top:8px;font-size:13px;max-height:38vh;overflow:auto}
  .m-only{display:inline-flex}
  .letter{padding:14px}
  .calc{padding:14px}
  .fields{grid-template-columns:1fr 1fr;gap:10px 8px}
  .f small{display:none}
  .f input{font-size:16px}
  .toast{bottom:calc(84px + env(safe-area-inset-bottom,0px))}
  .tabbar{display:grid;grid-template-columns:repeat(4,1fr);position:fixed;left:0;right:0;bottom:0;z-index:30;background:var(--surface);border-top:1px solid var(--line);
    padding-left:max(8px,env(safe-area-inset-left,0px));padding-right:max(8px,env(safe-area-inset-right,0px));padding-top:6px;padding-bottom:calc(6px + env(safe-area-inset-bottom,0px))}
  .tab{border:0;background:transparent;display:flex;flex-direction:column;align-items:center;gap:3px;padding:6px 2px;border-radius:8px;font-size:11.5px;font-weight:600;color:var(--muted);position:relative}
  .tab svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
  .tab.on{color:var(--accent);background:var(--accent-soft)}
  .tab .badge{position:absolute;top:2px;left:calc(50% + 6px);min-width:18px;height:18px;padding:0 5px;border-radius:9px;background:var(--warn);color:var(--surface);font-size:10.5px;line-height:18px;font-family:var(--f-mono)}
}
.next .btn{padding:5px 10px;font-size:12px}
.chgtag{font-size:10.5px;font-weight:700;letter-spacing:.04em;padding:1px 7px;border-radius:99px;white-space:nowrap}
.chgtag.cancel{background:var(--bad-soft);color:var(--bad)}
.chgtag.ext{background:var(--warn-soft);color:var(--warn)}
.bkact{display:flex;gap:8px;flex-wrap:wrap;justify-content:space-between}
.btn.danger{color:var(--bad)}
.btn.danger:hover{background:var(--bad-soft)}
.feedback.stale{border-color:var(--warn);background:var(--warn-soft);color:var(--ink)}
.feedback.stale b{color:var(--warn)}
.place.cx{border-style:solid;border-color:var(--bad);background:var(--bad-soft);color:var(--bad);font-weight:600}
/* Splash */
.splash{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:var(--bg);overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));transition:background-color .6s ease}
.splash::before{content:"";position:absolute;inset:-2px;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);
  background-size:56px 40px;opacity:.55;mask-image:radial-gradient(ellipse at center,#000 10%,transparent 70%);-webkit-mask-image:radial-gradient(ellipse at center,#000 10%,transparent 70%);transition:opacity .4s}
.sp-bars{position:absolute;inset:0;pointer-events:none;transition:opacity .4s}
.sp-bars i{position:absolute;height:28px;border-radius:5px;background:var(--cc);opacity:0;transform:scaleX(0);transform-origin:left;animation:spbar .7s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spbar{to{opacity:.16;transform:scaleX(1)}}
.sp-inner::before{content:"";position:absolute;inset:-60px -90px;z-index:-1;background:radial-gradient(closest-side,var(--bg) 62%,transparent);transition:opacity .3s}
.splash.out .sp-inner::before{opacity:0}
.sp-inner{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;gap:22px;text-align:center}
.sp-logo{width:min(46vw,240px);aspect-ratio:530/359;transform-origin:0 0;animation:splogo .9s cubic-bezier(.2,.8,.2,1) both}
@keyframes splogo{from{opacity:0;transform:translateY(14px) scale(.92)}to{opacity:1;transform:none}}
.sp-text{display:flex;flex-direction:column;align-items:center;gap:8px;transition:opacity .35s,transform .35s}
.sp-eyebrow{font-size:12px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);font-weight:600;animation:spfade .6s .35s both}
.sp-title{margin:0;font-family:var(--f-display);font-weight:600;font-size:clamp(26px,5.4vw,46px);line-height:1.05;letter-spacing:-.02em;text-wrap:balance;animation:spfade .7s .5s both}
.sp-title span{color:#DB1B50}
.sp-sub{color:var(--muted);font-size:14px;animation:spfade .6s .7s both}
.sp-load{width:min(260px,70vw);display:flex;flex-direction:column;gap:8px;align-items:center;animation:spfade .5s .8s both}
.sp-track{width:100%;height:3px;border-radius:3px;background:var(--line);overflow:hidden}
.sp-track b{display:block;height:100%;width:100%;background:#DB1B50;transform:scaleX(0);transform-origin:left;animation:spload 1.5s .9s cubic-bezier(.6,.1,.3,1) forwards}
.sp-status{font-family:var(--f-mono);font-size:11.5px;color:var(--muted);min-height:1.4em}
@keyframes spfade{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@keyframes spload{to{transform:scaleX(1)}}
.splash.out{background-color:transparent;pointer-events:none}
.splash.out::before,.splash.out .sp-bars{opacity:0}
.splash.out .sp-text{opacity:0;transform:translateY(10px)}
.logo.hide{visibility:hidden}
@media (prefers-reduced-motion:reduce){.sp-logo,.sp-eyebrow,.sp-title,.sp-sub,.sp-load,.sp-bars i{animation-duration:.01s!important;animation-delay:0s!important}.sp-bars i{opacity:.16;transform:none}}
.lang{display:inline-flex;border:1px solid var(--line);border-radius:7px;overflow:hidden;flex:none}
.lang button{border:0;background:transparent;padding:5px 9px;font-size:12px;font-weight:600;letter-spacing:.04em;color:var(--muted)}
.lang button.on{background:var(--ink);color:var(--bg)}
.lang button:not(.on):hover{color:var(--ink)}
.mh .lang{margin-top:2px}

/* Профи-механики */
.dh i{font-style:normal;font-size:9px;font-weight:700;line-height:1;margin-top:1px;color:var(--warn)}
.dh.ev{box-shadow:inset 0 3px 0 var(--c-event)}
.dh.ev i{color:var(--c-event)}
.c.ev{background:color-mix(in srgb,var(--c-event) 7%,transparent)}
.bar.pre{background:color-mix(in srgb,var(--cc) 45%,var(--surface));color:var(--ink);border:1px solid color-mix(in srgb,var(--cc) 60%,transparent);font-weight:500}
.bar.pre.sel{box-shadow:0 0 0 2px var(--surface),0 0 0 4px var(--ink)}
.bar.ooo{z-index:1;pointer-events:none;background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--bad) 28%,transparent) 0 6px,transparent 6px 12px);border:1.5px dashed var(--bad);color:var(--bad);font-weight:700;margin:2px 1px}
.tmr{font-family:var(--f-mono);font-size:11px;font-weight:600;color:var(--warn);white-space:nowrap}
.tmr.low{color:var(--bad)}
.req.lost{opacity:.6}
.chgtag.grp{background:color-mix(in srgb,var(--c-group) 18%,transparent);color:var(--c-group)}
.chgtag.call{background:color-mix(in srgb,var(--c-direct) 20%,transparent);color:var(--c-direct)}
.chat{display:flex;flex-direction:column;gap:8px;margin-top:10px;max-height:min(56vh,520px);overflow:auto;padding:2px 2px 6px}
.bub{max-width:88%;padding:9px 12px;border-radius:14px;font-size:13.5px;line-height:1.45;overflow-wrap:anywhere;animation:bubin .25s ease both}
.bub.g{align-self:flex-start;background:var(--sunk);border:1px solid var(--line);border-bottom-left-radius:4px}
.bub.sys{align-self:center;background:transparent;color:var(--muted);font-size:12.5px;font-style:italic;padding:2px 8px}
.bub.a{align-self:flex-end;background:var(--accent-soft);color:var(--ink);border:1px solid color-mix(in srgb,var(--accent) 35%,transparent);border-bottom-right-radius:4px}
.bub.a.wr{background:var(--bad-soft);border-color:color-mix(in srgb,var(--bad) 35%,transparent)}
@keyframes bubin{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.bub{animation:none}}
@media (max-width:760px){.chat{max-height:42vh}}
.sayopts{display:grid;gap:8px;margin-top:8px}
.sayopt{display:grid;gap:4px;text-align:left;font:inherit;font-size:13.5px;line-height:1.4;padding:10px 12px;border-radius:10px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer;transition:border-color .15s,background .15s}
.sayopt:hover:not(:disabled){border-color:var(--accent);background:var(--accent-soft)}
.sayopt.tried{opacity:.75;cursor:not-allowed;border-color:color-mix(in srgb,var(--bad) 45%,transparent);background:var(--bad-soft)}
.sayopt.tried span{text-decoration:line-through}
.sayopt small{color:var(--bad);font-size:12px}
.gpls{display:flex;flex-wrap:wrap;gap:6px}
.gpl{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-mono);font-size:12px;border:1px solid var(--line);border-radius:6px;padding:3px 4px 3px 8px;background:var(--sunk)}
.gpl .x{border:0;background:transparent;color:var(--muted);font-size:15px;line-height:1;padding:0 4px;cursor:pointer}
.gpl .x:hover{color:var(--bad)}
table.cal td,table.cal th{white-space:nowrap}
tr.evrow td{background:color-mix(in srgb,var(--c-event) 8%,transparent)}
.kpi.lostk b{color:var(--bad)}
.row.head{height:52px}

/* защита от копирования и слежение за уходами */
body{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
input,textarea,select{-webkit-user-select:text;user-select:text}
@media print{body>*{display:none!important}body::after{content:'Печать тренажёра недоступна';display:block;padding:40px;font:16px sans-serif}}
.letter,.chat{background-image:var(--wm,none);background-repeat:repeat;background-size:260px 120px}
.stat.away b{color:var(--bad)}
.feedback.warnbox{border-color:var(--bad);background:var(--bad-soft)}

function plural(n,a,b,c){const m=n%10,h=n%100;if(m===1&&h!==11)return a;if(m>=2&&m<=4&&(h<10||h>=20))return b;return c}

const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
function rng(seed){let a=seed>>>0||1;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
function shuffle(a,R){for(let i=a.length-1;i>0;i--){const j=Math.floor(R()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function wpick(R,w){const k=Object.keys(w);let s=0;k.forEach(x=>s+=w[x]);let r=R()*s;for(const x of k){r-=w[x];if(r<0)return x}return k[k.length-1]}
function digits(R,n){let s='';for(let i=0;i<n;i++)s+=Math.floor(R()*10);if(s[0]==='0')s='7'+s.slice(1);return s}
function parseNum(v){if(v==null)return null;const s=String(v).replace(/[^\d-]/g,'');if(s===''||s==='-')return null;return parseInt(s,10)}
const pad2=n=>String(n).padStart(2,'0');

const NAMES_LAT=['John Miller','Anna Schmidt','Li Wei','Mehmet Yılmaz','Kenji Tanaka','Sophie Martin','Rahul Sharma','Kim Minji','Lucas Fernández','Emma Johansson','Zhang Hui','Oliver Brown','Chen Yu','Ahmed Hassan','Marco Rossi','Park Jisoo'];
const SENDERS=['Сауле Кенжебаева','Гульнара Ибраева','Марина Ковалёва','Айжан Сапарова','Елена Ким'];

const GROUP_CLIENTS=[{ru:'Свадьба Ахметовых',kk:'Ахметовтардың үйлену тойы',who:'Ахметовы'},{ru:'Выпускной вечер КазНУ',kk:'ҚазҰУ түлектер кеші',who:'КазНУ'},{ru:'Чемпионат по шахматам',kk:'Шахмат чемпионаты',who:'Шахматы'}];

function generate(seed){
  const R=rng(seed*7919+13);
  const pick=a=>a[Math.floor(R()*a.length)];
  const usedN=new Set(),uniq=arr=>{let a=arr.filter(n=>!usedN.has(n));if(!a.length)a=NAMES.concat(NAMES_LAT).filter(n=>!usedN.has(n));const n=a[Math.floor(R()*a.length)];usedN.add(n);return n};
  const grid={};ROOMS.forEach(r=>grid[r.no]=Array(DAYS).fill(false));
  const freeRooms=(cat,s,n,excl)=>ROOMS.filter(x=>x.cat===cat&&x.no!==excl&&grid[x.no].slice(s,s+n).every(v=>!v));
  const mark=(room,s,n)=>{for(let k=s;k<s+n;k++)grid[room][k]=true};
  const tm=(a,b)=>pad2(a+Math.floor(R()*(b-a)))+':'+pad2(Math.floor(R()*60));
  /* 1. номер вне эксплуатации: 203, 3 ночи */
  const OOO={room:'203',s:3+Math.floor(R()*5),n:3};mark(OOO.room,OOO.s,OOO.n);
  /* 2. группа: 8 номеров на 2 ночи */
  const MIXES=[{STD:4,SUP:2,DLX:2},{STD:3,SUP:3,FAM:2},{STD:5,SUP:3},{STD:4,SUP:3,DLX:1}],SMALL=[{STD:3,SUP:3},{STD:2,SUP:2,DLX:2},{STD:2,SUP:2}];
  let group=null;
  for(let t=0;t<400&&!group;t++){const s=1+Math.floor(R()*(DAYS-3)),mix=pick(t<300?MIXES:SMALL);
    if(Object.entries(mix).every(([c,k])=>freeRooms(c,s,2).length>=k)){const rooms=[];
      for(const [c,k] of Object.entries(mix)){const f=shuffle(freeRooms(c,s,2),R).slice(0,k);f.forEach(x=>{mark(x.no,s,2);rooms.push(x.no)})}
      const cl=pick(GROUP_CLIENTS);group={kind:'grp',ch:'group',s,nights:2,mix,rooms,guests:rooms.length*2,client:cl,guest:cl.who,sender:pick(SENDERS),ref:'G-'+digits(R,4),sv:['bf']}}}
  /* 3. брони, которые уже стоят в шахматке */
  const PRE=[];
  const mkStay=(ch,forceCat,forceS)=>{for(let t=0;t<300;t++){
      const cat=forceCat||wpick(R,{STD:34,SUP:30,DLX:15,FAM:13,STE:8});
      const n=Number(wpick(R,{1:20,2:34,3:26,4:14,5:6}));
      const s=forceS!=null?forceS:Math.floor(R()*(DAYS-n+1));if(s+n>DAYS)continue;
      const f=freeRooms(cat,s,n);if(f.length){const room=pick(f);mark(room.no,s,n);return{cat,n,s,room:room.no}}}return null};
  const preChans=['booking','ostrovok','corp','site','phone','bronevik','booking','corp'];
  /* одна обязательная бронь, которая окажется в 203 во время аварии */
  {const st=mkStay('booking','SUP',OOO.s+Math.floor(R()*2));if(st)PRE.push(Object.assign(st,{ch:'booking',forced203:true}))}
  for(let k=0;PRE.length<22&&k<200;k++){const st=mkStay();if(st)PRE.push(Object.assign(st,{ch:pick(preChans)}))}
  PRE.forEach((p,k)=>{p.id=k;p.guest=uniq(R()<.15?NAMES_LAT:NAMES);p.nights=p.n;
    if(p.ch==='corp')p.corp=pick(Object.keys(CORPS));if(p.ch==='booking')p.plan=R()<.35?'nr':'flex';if(p.ch==='phone')p.promo=R()<.4});
  /* 4. обычные заявки */
  const chans=[].concat(Array(5).fill('booking'),Array(4).fill('ostrovok'),Array(3).fill('bronevik'),Array(4).fill('trip'),Array(6).fill('corp'),Array(2).fill('site'),Array(3).fill('phone'),Array(2).fill('walkin'));
  shuffle(chans,R);
  const order=chans.map((c,i)=>i).sort((a,b)=>(chans[b]==='walkin')-(chans[a]==='walkin'));
  const books=new Array(chans.length);
  const mkBooking=(ch,stay,opts)=>{
    const {cat,n,s}=stay;let guests;
    if(ch==='corp')guests=1;else if(cat==='DLX')guests=R()<.35?3:2;else if(cat==='FAM')guests=R()<.5?3:4;else if(cat==='STE')guests=2;else guests=R()<.35?1:2;
    const sv=[];const p=x=>R()<x;
    if(p(ch==='corp'?.7:.5))sv.push('bf');if(ch!=='walkin'&&p(.2))sv.push('trf_in');if(p(.15))sv.push('trf_out');
    if(ch!=='walkin'&&p(.13))sv.push('early');if(p(.13))sv.push('late');if(cat==='DLX'&&guests===3)sv.push('bed');
    if(p(.15))sv.push('park');if(ch!=='corp'&&p(.1))sv.push('spa');if(cat==='FAM'&&p(.45))sv.push('cot');
    if(ch!=='corp'&&ch!=='bronevik'&&p(.06))sv.push('pet');if(cat==='STE'&&ch!=='corp'&&p(.45))sv.push('dinner');
    const latin=['booking','trip'].includes(ch)&&p(.6);
    const r={ch,cat,s,nights:n,room:stay.room,guests,sv,guest:uniq(latin?NAMES_LAT:NAMES),flight:pick(FLIGHTS)};
    if(ch==='corp'){r.corp=pick(Object.keys(CORPS));r.sender=pick(SENDERS);r.ref=String(100+Math.floor(R()*800));r.variant=p(.5)?1:0}
    if(ch==='phone'){r.call=true;r.promo=p(.5);r.phone='+7 7'+digits(R,2)+' ••• '+digits(R,2)+' '+digits(R,2)}
    if(ch==='booking'){r.ref=digits(R,10);r.plan=p(.4)?'nr':'flex'}
    if(ch==='ostrovok')r.ref='OS-'+digits(R,7);
    if(ch==='bronevik'){r.ref='БР-'+digits(R,6);r.agent=pick(AGENTS)}
    if(ch==='trip')r.ref=digits(R,16);
    if(ch==='site')r.ref='W-'+digits(R,5);
    r.time=tm(8,20);return r};
  for(const i of order){const ch=chans[i];let stay=null;
    for(let t=0;t<400&&!stay;t++){
      const cat=ch==='corp'?wpick(R,{STD:4,SUP:4,DLX:2,STE:1}):wpick(R,{STD:34,SUP:30,DLX:15,FAM:13,STE:8});
      const n=ch==='walkin'?1+Math.floor(R()*3):Number(wpick(R,{1:18,2:30,3:26,4:16,5:10}));
      const s=ch==='walkin'?0:Math.floor(R()*(DAYS-n+1));
      const f=freeRooms(cat,s,n);if(f.length){const room=pick(f);mark(room.no,s,n);stay={cat,n,s,room:room.no}}}
    if(!stay){outer:for(const cat of ORDER)for(let s=0;s<DAYS;s++){const f=freeRooms(cat,s,1);if(f.length){mark(f[0].no,s,1);stay={cat,n:1,s,room:f[0].no};break outer}}}
    books[i]=mkBooking(ch,stay)}
  /* 5. заявки с ошибками: в шахматку не ставятся */
  const errs=[];const reasons=shuffle(['dates','cap','cat',pick(['dates','cap','cat'])],R);
  for(const reason of reasons){
    const ch=reason==='dates'?pick(['booking','ostrovok','bronevik','corp']):pick(['booking','ostrovok','site','corp']);
    const cat=reason==='cap'?pick(['STD','SUP','STE','FAM']):wpick(R,{STD:4,SUP:4,DLX:2});
    const n=2+Math.floor(R()*3),s=Math.floor(R()*(DAYS-n));
    const r=mkBooking(ch,{cat,n,s,room:null});r.kind='err';r.reason=reason;r.room=null;
    if(reason==='cap'){r.guests=CAP[cat]+1;r.sv=r.sv.filter(x=>x!=='bed'&&x!=='cot')}
    if(reason==='cat')r.fake=pick(FAKE_CATS);
    if(reason==='dates'){r.badN=n+1;if(ch==='corp')r.variant=2}
    errs.push(r)}
  /* 6. сборка ленты из 40 позиций */
  const TOTALN=TOTAL;const slots=new Array(TOTALN).fill(null);
  const reserve=(lo,hi)=>{for(let t=0;t<500;t++){const q=lo+Math.floor(R()*(hi-lo+1));if(!slots[q]){slots[q]='X';return q}}for(let q=lo;q<TOTALN;q++)if(!slots[q]){slots[q]='X';return q}return -1};
  const posGroup=reserve(6,18),posOOO=reserve(14,26);
  const posErr=errs.map(()=>reserve(3,TOTALN-3));
  const posChg=[0,1,2,3,4].map(()=>reserve(10,TOTALN-1)).sort((a,b)=>a-b);
  const out=new Array(TOTALN);let bi=0;
  for(let q=0;q<TOTALN;q++){if(slots[q])continue;const r=books[bi++];r.i=q;out[q]=r}
  if(group){group.i=posGroup;group.time=tm(9,18);out[posGroup]=group}else{slots[posGroup]=null}
  errs.forEach((r,k)=>{r.i=posErr[k];out[posErr[k]]=r});
  out[posOOO]={i:posOOO,kind:'ooo',ch:'service',room:OOO.room,s:OOO.s,nights:OOO.n,guest:'OOO '+OOO.room,time:tm(9,18)};
  /* 7. отмены и продления */
  const types=shuffle(['cancel_nr','cancel_late','cancel_free','ext','ext'],R),used=new Set();
  posChg.forEach((q,k)=>{
    let type=types[k],add=1+(R()<.4?1:0),cand=[];
    const pool=out.slice(0,q-2).filter(r=>r&&!r.kind&&!used.has(r.i)&&r.room);
    if(type==='ext'){for(const a of [add,1]){cand=pool.filter(r=>r.s+r.nights+a<=DAYS&&grid[r.room].slice(r.s+r.nights,r.s+r.nights+a).every(v=>!v));if(cand.length){add=a;break}}if(!cand.length)type='cancel_free'}
    let time=tm(9,20);
    if(type==='cancel_nr'){cand=pool.filter(r=>r.ch==='booking'&&r.plan==='nr');if(!cand.length)type='cancel_late'}
    if(type==='cancel_late'){cand=pool.filter(r=>r.ch!=='walkin'&&!(r.ch==='booking'&&r.plan==='nr')&&r.s<=1);if(cand.length){time=tm(14,21)}else type='cancel_free'}
    if(type==='cancel_free'){cand=pool.filter(r=>r.ch!=='walkin'&&!(r.ch==='booking'&&r.plan==='nr')&&r.s>=2)}
    if(!cand.length)cand=pool.filter(r=>r.ch!=='walkin');
    const t=cand[Math.floor(R()*cand.length)]||pool[0];used.add(t.i);
    const base=type.startsWith('cancel')?'cancel':'ext';
    if(base==='ext'){mark(t.room,t.s+t.nights,add);t.extBy=q;t.add=add}else t.cxlBy=q;
    out[q]={i:q,kind:'chg',type:base,t:t.i,ch:t.ch,guest:t.guest,add:base==='ext'?add:0,time};
  });
  /* 8. показ «старых» броней: часть стоит не там, где удобно — придётся переселять */
  const show={};ROOMS.forEach(r=>show[r.no]=Array(DAYS).fill(false));
  const order2=PRE.map((p,k)=>k).sort((a,b)=>(PRE[b].forced203?1:0)-(PRE[a].forced203?1:0));
  for(const k of order2){const p=PRE[k];let room=p.room;
    const free=no=>show[no].slice(p.s,p.s+p.n).every(v=>!v);
    const opts=ROOMS.filter(x=>x.cat===p.cat&&free(x.no));
    if(p.forced203&&free('203'))room='203';
    else if(opts.length&&R()<.6)room=pick(opts).no;
    else if(free(p.room))room=p.room;
    else if(opts.length)room=opts[0].no;
    else{const up=ROOMS.find(x=>oneUp(p.cat,x.cat)&&free(x.no));room=up?up.no:p.room}
    if(!free(room)){p.drop=true;continue}
    p.show=room;for(let d=p.s;d<p.s+p.n;d++)show[room][d]=true}
  out.pre=PRE.filter(p=>!p.drop);out.ooo=OOO;
  return out;
}

/* ---------- Правильный расчёт ---------- */
function discOf(r){
  if(r.ch==='corp')return{disc:CORPS[r.corp].disc,dl:L('корп. скидка ','корп. жеңілдік ')+coName(CORPS[r.corp])};
  if(r.ch==='site')return{disc:SITE_DISC,dl:L('тариф «Лучшая цена на сайте»','«Сайттағы ең жақсы баға» тарифі')};
  if(r.ch==='phone'&&r.promo)return{disc:PROMO_DISC,dl:L('промокод ','промокод ')+promoCode()};
  if(r.ch==='booking'&&r.plan==='nr')return{disc:NR_DISC,dl:L('невозвратный тариф','қайтарылмайтын тариф')};
  return{disc:0,dl:''};
}
function svcLine(code,r){
  const rate=CATS[r.cat].rate;const G=L('гост.','қон.'),N=L('ноч.','түн');
  switch(code){
    case 'bf':{if(r.ch==='corp'&&CORPS[r.corp].bf)return{amt:0,f:L('включён в корпоративный тариф','корпоративтік тарифке кіреді')};const q=r.guests*r.nights;return{amt:5000*q,f:`5 000 × ${r.guests} ${G} × ${r.nights} ${N}`}}
    case 'trf_in':return{amt:12000,f:'12 000'};
    case 'trf_out':return{amt:12000,f:'12 000'};
    case 'early':return{amt:rate/2,f:`${money(rate)} × 50%`};
    case 'late':return{amt:rate/2,f:`${money(rate)} × 50%`};
    case 'bed':return{amt:10000*r.nights,f:`10 000 × ${r.nights} ${N}`};
    case 'park':return{amt:3000*r.nights,f:`3 000 × ${r.nights} ${N}`};
    case 'spa':return{amt:15000*r.guests,f:`15 000 × ${r.guests} ${G}`};
    case 'cot':return{amt:0,f:L('бесплатно','тегін')};
    case 'pet':return{amt:7000*r.nights,f:`7 000 × ${r.nights} ${N}`};
    case 'dinner':return{amt:25000,f:L('25 000 разово','25 000 бір рет')};
  }
}
function calc(r){
  if(r.kind==='grp')return calcGroup(r);
  const {disc,dl}=discOf(r);let acc,accF,nl=[];
  if(r.ch==='trip'){const usd=TRIP_USD[r.cat],tot=usd*r.nights;acc=Math.round(tot*USD_RATE);
    accF=`${usdFmt(usd)} × ${r.nights} ${L('ноч.','түн')} = ${usdFmt(tot)} × ${rateFmt()} ₸`}
  else{let sum=0;for(let d=r.s;d<r.s+r.nights;d++){const v=nightRate(r.cat,d);sum+=v;nl.push(num(v)+(multTag(d)?` (${multTag(d)})`:''))}
    acc=Math.round(sum*(100-disc)/100);accF=(r.nights>1?nl.join(' + ')+' = '+money(sum):money(sum)+(multTag(r.s)?` (${multTag(r.s)})`:''))+(disc?` × (1 − ${disc}%)`:'')}
  const lines=r.sv.map(c=>({code:c,name:svName(c),...svcLine(c,r)}));
  const svc=lines.reduce((a,b)=>a+b.amt,0),total=acc+svc,pct=OTA[r.ch]?OTA[r.ch].pct:0,comm=Math.round(acc*pct/100);
  return{disc,dl,acc,accF,lines,svc,total,pct,comm,net:total-comm};
}
function calcGroup(g){
  let sum=0;const parts=[];
  for(const [c,k] of Object.entries(g.mix)){let one=0;for(let d=g.s;d<g.s+g.nights;d++)one+=nightRate(c,d);sum+=one*k;parts.push(`${k} × ${c} ${num(one)}`)}
  const acc=Math.round(sum*(100-GROUP_DISC)/100),bf=5000*g.guests*g.nights;
  return{disc:GROUP_DISC,dl:L('групповая скидка','топтық жеңілдік'),acc,accF:parts.join(' + ')+` = ${money(sum)} × (1 − ${GROUP_DISC}%)`,
    lines:[{code:'bf',name:svName('bf'),amt:bf,f:`5 000 × ${g.guests} ${L('гост.','қон.')} × ${g.nights} ${L('ноч.','түн')}`}],svc:bf,total:acc+bf,pct:0,comm:0,net:acc+bf};
}
function nightRev(r,d,cat){
  cat=cat||r.cat;
  if(r.kind==='grp')return Math.round(nightRate(cat,d)*(100-GROUP_DISC)/100);
  if(r.ch==='trip')return Math.round(TRIP_USD[r.cat]*USD_RATE);
  return Math.round(nightRate(r.cat,d)*(100-discOf(r).disc)/100);
}
function isLate(T,time){const h=+String(time).slice(0,2);return T.s===0||(T.s===1&&h>=14)}
function penalty(c){const T=REQS[c.t];let pen=0,why='free';
  if(T.ch==='booking'&&T.plan==='nr'){pen=calc(T).acc;why='nr'}
  else if(isLate(T,c.time)){pen=T.ch==='trip'?Math.round(TRIP_USD[T.cat]*USD_RATE):nightRev(T,T.s);why='late'}
  const pct=OTA[T.ch]?OTA[T.ch].pct:0,comm=Math.round(pen*pct/100);
  return{pen,comm,net:pen-comm,why,pct};
}

function evalGroup(x,g){const c=calcGroup(g),pl=plc(x),eq=(k)=>Math.abs(parseNum(x.inputs[k])-c[k])<=1;

function auditCorrect(){let sold=0,rev=0;
  (REQS.pre||[]).forEach((p,k)=>{if(p.s<=0&&p.s+p.n>0){sold++;rev+=nightRev(p,0)}});
  for(let i=0;i<TOTAL;i++){const x=S.items[i];if(!x||!x.done||x.cancelled||x.lost||x.clar)continue;const r=REQS[i];if(r.kind==='chg'||r.kind==='ooo')continue;
    for(const pl of plc(x))if(pl.s<=0&&pl.e>0){sold++;rev+=r.kind==='grp'?nightRev(r,0,roomCat(pl.room)):nightRev(eff(i),0)}}
  return{sold,rev,occ:Math.round(sold/ROOMS.length*100),adr:sold?Math.round(rev/sold):0,revpar:Math.round(rev/ROOMS.length)}}

function showReport(){
  curModal=showReport;
  const {p}=points(),MX=MAXP(),pct=Math.round(p/MX*100);
  let acc=0,svc=0,comm=0,rn=0,lostRev=0,penRev=0;const by={};
  for(let i=0;i<TOTAL;i++){const x=S.items[i],R0=REQS[i];if(!x)continue;
    if(R0.kind==='chg'&&R0.type==='cancel'&&x.done&&x.res.cx){penRev+=penalty(R0).net}
    if(x.lost&&R0.kind!=='err'){lostRev+=calc(R0.kind==='grp'?R0:eff(i)).total;continue}
    if(!x.done||x.cancelled||x.clar||R0.kind==='chg'||R0.kind==='ooo'||R0.kind==='err')continue;
    const r=R0.kind==='grp'?R0:eff(i),c=calc(r);
    acc+=c.acc;svc+=c.svc;comm+=c.comm;plc(x).forEach(pl=>rn+=pl.e-pl.s);

  const errs=[];for(let i=0;i<TOTAL;i++){const x=S.items[i];if(!x||!x.done){errs.push({i,miss:true});continue}if(x.res.score<7)errs.push({i,x})}
  const lab=LANG==='kk'?{cat:'санат',dates:'күндер',acc:'тұру',svc:'қосымша қызметтер',total:'барлығы',comm:'комиссия',net:'нетто'}:{cat:'категория',dates:'даты',acc:'проживание',svc:'доп. услуги',total:'итого',comm:'комиссия',net:'нетто'};
  let started='';try{started=new Date(S.startedAt||Date.now()).toLocaleString(LANG==='kk'?'kk-KZ':'ru-RU',{day:'numeric',month:'long',hour:'2-digit',minute:'2-digit'})}catch(e){}
  const det=(i,what,body)=>`<details style="border-bottom:1px solid var(--line);padding:6px 0"><summary>№${String(i+1).padStart(2,'0')} · ${esc(dispName(REQS[i]))} · ${esc(chName(REQS[i].ch))} — <span class="mark bad">${what}</span></summary>${body?`<div class="fl" style="margin-top:6px">${body}</div>`:''}</details>`;

    <div class="feedback${(S.away&&S.away.n)||S.tamper?' warnbox':''}" style="display:grid;gap:4px">

    </div></div>
    ${A?`<div><div class="lbl">${L('Ночной аудит · 15 октября','Түнгі аудит · 15 қазан')} — ${A.res.score} / ${AUDIT_MAX}</div><div class="tw"><table>
      <tr><th></th><th class="n">${L('Ваш ответ','Сіздің жауабыңыз')}</th><th class="n">${L('Верно','Дұрысы')}</th></tr>

    </table></div><p class="hintline">${L('Выручка за ночь','Түн түсімі')}: ${money(A.correct.rev)}</p></div>`:''}
    ${(()=>{const cl=REQS.map((r,i)=>r&&r.call?i:-1).filter(i=>i>=0);if(!cl.length)return '';
      return `<div><div class="lbl">${L('Телефонные звонки · скрипт','Телефон қоңыраулары · скрипт')}</div>${cl.map(i=>{const x=S.items[i],st=callSteps(REQS[i]),dl=x&&x.dlg;
        const sc=scriptScore(x),bad=dl?dl.bad.map(([k,id])=>{const o=st[k].opts.find(z=>z.id===id);return o?`<span style="grid-column:1/-1">✗ «${esc(o.t)}» — ${esc(o.why)}</span>`:''}).join(''):'';
        const what=!dl||!dl.fin?L('разговор не завершён','әңгіме аяқталмады'):dl.miss?L(`ошибок скрипта: ${dl.miss}`,`скрипт қателері: ${dl.miss}`):L('без ошибок','қатесіз');

      ${Object.entries(by).map(([k,v])=>`<tr><td>${esc(k)}</td><td class="n">${v.n}</td><td class="n">${money(v.acc)}</td><td class="n">${money(v.comm)}</td></tr>`).join('')}</table></div></div>
    <div><div class="lbl">${L('Ошибки и пропуски','Қателер мен өткізіп алғандар')} (${errs.length})</div>
      ${errs.length?errs.map(e=>{const r0=REQS[e.i],x=e.x;
        if(r0.kind==='chg')return det(e.i,e.miss?L('не обработана','өңделмеген'):L('есть ошибки','қателер бар'),`<span style="grid-column:1/-1">${esc(chgExpect(r0))}</span>`);
        if(r0.kind==='ooo')return det(e.i,e.miss?L('не обработана','өңделмеген'):L('гости не переселены','қонақтар көшірілмеген'),'');
        if(x&&x.lost)return det(e.i,L('гость ушёл — не ответили за 5 минут','қонақ кетті — 5 минутта жауап берілмеді'),'');
        if(r0.kind==='err')return det(e.i,x&&x.clar?L('уточнение с неверной причиной','себебі қате нақтылау'):x?L('внесли заявку с ошибкой','қатесі бар өтінім енгізілді'):L('не обработана','өңделмеген'),`<span style="grid-column:1/-1">${L('Правильно: запросить уточнение — ','Дұрысы: нақтылау сұрау — ')}${esc(REASONS()[r0.reason])}</span>`);
        if(x&&x.clar)return det(e.i,L('запросили уточнение у корректной заявки','дұрыс өтінімнен нақтылау сұралды'),'');
        if(x&&x.cancelled)return det(e.i,L('аннулирована без запроса гостя','қонақтың сұрауынсыз жойылды'),'');
        const r=r0.kind==='grp'?r0:eff(e.i),c=calc(r);
        const what=e.miss?(cxlDue(e.i)?L('не оформлена (по ней пришла отмена — нужно было аннулировать)','рәсімделмеген (бас тарту келген — жою керек еді)'):L('не оформлена','рәсімделмеген')):Object.keys(lab).filter(k=>x.res[k]===false).map(k=>lab[k]).join(', ');
        return det(e.i,what,calcLines(r,c)+(x?`<span style="color:var(--muted)">${L('Введено','Енгізілді')}: ${['acc','svc','total','comm','net'].map(k=>esc(x.inputs[k]||'—')).join(' / ')}</span><span></span>`:''))}).join(''):`<p>${L('Ошибок нет. Отличная смена.','Қате жоқ. Тамаша ауысым.')}</p>`}
    </div>
    <div class="actions"><button class="btn primary" type="button" id="new-shift">${L('Начать новую смену','Жаңа ауысымды бастау')}</button></div>
  </div>`);
  ov.addEventListener('click',e=>{if(e.target===ov||e.target.closest('[data-close]'))closeModal();if(e.target.id==='new-shift')showStart()});
}
function showStart(){
  curModal=showStart;
  const ov=modal(`<div class="mh"><h2>${L('Приём смены','Ауысымды қабылдау')} · Urban Hotel</h2>${langSwitch()}</div>
  <form class="mb" id="startform">
    <p>${L('Вы — администратор Urban Hotel. Отель уже заполнен примерно наполовину. За смену поступит 40 заявок: OTA с разными тарифами, доллары с Trip.com, корпоративные клиенты, телефонные звонки по скрипту, групповая бронь, отмены со штрафами, продления, заявки с ошибками и авария в номере. Цены меняются по дням, на ответ гостю — 5 минут. В конце — ночной аудит.','Сіз — Urban Hotel әкімшісісіз. Қонақүй жартылай толы. Ауысым ішінде 40 өтінім түседі: әртүрлі тарифтегі OTA, Trip.com-нан доллар, корпоративтік клиенттер, скрипт бойынша телефон қоңыраулары, топтық брондау, айыппұлмен бас тартулар, ұзартулар, қатесі бар өтінімдер және нөмірдегі апат. Бағалар күн сайын өзгереді, қонаққа жауап беруге — 5 минут. Соңында — түнгі аудит.')}</p>
    <div class="f"><label for="st-name">${L('Фамилия и имя студента','Студенттің тегі мен аты')}</label><input class="tin" id="st-name" autocomplete="off" placeholder="${L('Например, Сейткали Айгерим','Мысалы, Сейткали Айгерим')}" style="font-family:var(--f-body)"></div>
    <div class="opt"><span class="lbl">${L('Режим','Режим')}</span><div class="seg">
      <label><input type="radio" name="mode" value="train" checked><span><b>${L('Обучение','Оқу')}</b><small>${L('Проверка и разбор сразу после каждой брони','Әр брондаудан кейін бірден тексеру және талдау')}</small></span></label>
      <label><input type="radio" name="mode" value="exam"><span><b>${L('Экзамен','Емтихан')}</b><small>${L('Результат только в отчёте в конце смены','Нәтиже тек ауысым соңындағы есепте')}</small></span></label>
    </div></div>
    <div class="f"><label for="st-int">${L('Поток заявок','Өтінімдер ағыны')}</label><select class="tin" id="st-int"><option value="0">${L('Вручную, по кнопке','Қолмен, батырма арқылы')}</option><option value="60">${L('Каждую минуту','Әр минут сайын')}</option><option value="90" selected>${L('Каждые 90 секунд','Әр 90 секунд сайын')}</option><option value="150">${L('Каждые 2,5 минуты','Әр 2,5 минут сайын')}</option></select><small>${L('Сначала во входящих 3 заявки. У каждого студента свой набор заявок.','Басында кіріс бөлімінде 3 өтінім болады. Әр студенттің өз өтінімдер жинағы бар.')}</small></div>
    <div class="actions"><button class="btn primary" type="submit">${L('Принять смену','Ауысымды қабылдау')}</button><button class="btn" type="button" id="see-rates">${L('Сначала посмотреть тарифы','Алдымен тарифтерді қарау')}</button></div>

    const sd=newSeed(nm);

    {let n=0;try{n=+(localStorage.getItem(ATT)||0)}catch(e){}n++;try{localStorage.setItem(ATT,String(n))}catch(e){}S.att=n;S.away={n:0,sec:0}}setMark();
    loadReqs();active=null;anchor=null;selPre=null;save();closeModal();renderAll();setView('inbox');toast(L('Смена принята. Во входящих 3 заявки.','Ауысым қабылданды. Кіріс бөлімінде 3 өтінім бар.'));

/* ---------- Честная смена: уходы со страницы, копирование, водяной знак ---------- */
let awayAt=null;
function goAway(){if(!S||S.finished||awayAt!==null||$('startform'))return;awayAt=Date.now()}
function comeBack(){if(awayAt===null)return;const sec=Math.round((Date.now()-awayAt)/1000);awayAt=null;if(!S||S.finished||sec<3)return;
  S.away=S.away||{n:0,sec:0};S.away.n++;S.away.sec+=sec;save();renderStats();
  toast(L(`Вы уходили со страницы (${clock(sec)}). Это отмечено в отчёте`,`Сіз беттен кеттіңіз (${clock(sec)}). Бұл есепте белгіленді`))}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')goAway();else comeBack()});
window.addEventListener('blur',goAway);window.addEventListener('focus',comeBack);
const isField=t=>t&&t.closest&&t.closest('input,textarea,select');
['copy','cut','contextmenu','selectstart','dragstart'].forEach(ev=>document.addEventListener(ev,e=>{if(!isField(e.target))e.preventDefault()}));
document.addEventListener('copy',e=>{if(isField(e.target))return;try{e.clipboardData.setData('text/plain','')}catch(_){}});
document.addEventListener('keydown',e=>{if((e.ctrlKey||e.metaKey)&&['p','s','u'].includes(e.key.toLowerCase())){e.preventDefault()}});
function setMark(){const n=S&&S.name?S.name:'';if(!n){document.documentElement.style.removeProperty('--wm');return}
  const t=esc(n+' · URBAN').replace(/'/g,'&#39;');const svg=`<svg xmlns='http://www.w3.org/2000/svg' width='260' height='120'><text x='10' y='70' transform='rotate(-18 130 60)' font-family='sans-serif' font-size='13' fill='rgba(128,128,128,0.13)'>${t}</text></svg>`;
  document.documentElement.style.setProperty('--wm',`url("data:image/svg+xml;utf8,${encodeURIComponent(svg)}")`)}
/* ---------- Таймер ---------- */
setInterval(()=>{
  if(!S||S.finished||$('startform')||$('auditform'))return;
  S.elapsed++;
  if(S.interval>0&&S.arrived<TOTAL){S.nextIn--;if(S.nextIn<=0)arrive()}
  let lost=false;
  for(let i=0;i<S.arrived;i++){const r=REQS[i];if(!timedKind(r))continue;const x=it(i);if(x.done||x.ans)continue;
    if(leftOf(i)<=0){x.lost=true;x.done=true;x.place=null;x.places=[];x.editing=false;x.res={score:0,lost:true};lost=true;if(active===i)anchor=null;
      toast(L(`Заявка №${i+1}: гость не дождался ответа и ушёл`,`№${i+1} өтінім: қонақ жауап күтпей кетті`))}}
  if(lost){save();renderAll();return}
  if(S.elapsed%5===0)save();
  renderStats();
  document.querySelectorAll('[data-tmr]').forEach(el=>{const i=+el.dataset.tmr,l=leftOf(i);el.textContent='⏱ '+clock(l);el.classList.toggle('low',l<=60)});
  const nb=document.querySelector('#nextline .num');if(nb&&S.interval>0&&S.arrived<TOTAL)nb.textContent=clock(S.nextIn);
},1000);

/* ---------- Запуск ---------- */
function boot(data){
  const hot=!!(data&&data.S&&data.S.seed);
  if(hot){S=data.S;loadReqs();setMark();active=data.active??null;selPre=data.selPre??null}
  $('logo').innerHTML=LOGO_SRC?`<img src="${LOGO_SRC}" alt="URBAN College">`:'URBAN';
  applyStatic();renderAll();
  if(hot){$('splash').remove();setView(data.view||'inbox');return}
  const sv=loadSaved();
  if(sv&&!sv.finished){S=sv;loadReqs();setMark();active=(sv.ui&&sv.ui.active!=null&&sv.ui.active<S.arrived)?sv.ui.active:null;
    $('splash').remove();renderAll();setView((sv.ui&&sv.ui.view)||'inbox');toast(L('Смена восстановлена — продолжайте с того же места','Ауысым қалпына келтірілді — сол жерден жалғастырыңыз'));return}
  setView('inbox');
  splash(()=>{if(!S)showStart()});
}

function splash(done){
  const sp=$('splash'),lg=$('sp-logo'),hd=$('logo');
  lg.src=LOGO_SRC;hd.classList.add('hide');
  const reduce=matchMedia('(prefers-reduced-motion: reduce)').matches;
  const cols=['--c-booking','--c-ostrovok','--c-bronevik','--c-trip','--c-corp','--c-direct'];let bh='';
  for(let k=0;k<16;k++){const top=(k*6.1+3)%96,left=(k*37)%80,w=8+(k*13)%18;bh+=`<i style="top:${top}%;left:${left}%;width:${w}%;--cc:var(${cols[k%6]});animation-delay:${(k*0.07).toFixed(2)}s"></i>`}
  $('sp-bars').innerHTML=bh;
  const msgs=LANG==='kk'?['Нөмір қорын жүктеп жатырмыз…','Сату арналарын қосып жатырмыз…','Шахматканы ашып жатырмыз…']:['Загружаем номерной фонд…','Подключаем каналы продаж…','Открываем шахматку…'];
  $('sp-status').textContent=msgs[0];
  let mi=0;const mt=setInterval(()=>{mi++;if(mi<msgs.length)$('sp-status').textContent=msgs[mi]},700);
  let finished=false;
  const finish=()=>{if(finished)return;finished=true;clearInterval(mt);hd.classList.remove('hide');sp.remove();done()};
  setTimeout(()=>{
    clearInterval(mt);$('sp-status').textContent=L('Смена готова','Ауысым дайын');
    const a=lg.getBoundingClientRect(),b=hd.getBoundingClientRect();
    lg.style.animation='none';
    if(reduce||!a.width||!b.width){finish();return}
    sp.classList.add('out');
    lg.style.transition='transform .85s cubic-bezier(.65,0,.25,1)';
    lg.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width})`;
    lg.addEventListener('transitionend',finish,{once:true});
    setTimeout(finish,950);
  },reduce?600:2700);
}
try{window.claude?.hot?.snapshot?.(()=>({S,active,view}))}catch(e){}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='hidden')save()});
window.addEventListener('pagehide',save);
if(window.claude?.hot?.ready)window.claude.hot.ready(boot);else boot(window.claude?.hot?.data??{});
})();/*IIFE*/
