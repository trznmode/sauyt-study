<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Чистый номер</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen game — top bar, then a big scene with large tap targets; hotel linen + fresh mint world */
:root{
  --bg:#E6F4EF; --panel:#FFFFFF; --ink:#1E3A45; --soft:#58747D; --line:#CBE2DA;
  --accent:#FF8A3D; --accent-deep:#D96A22; --blue:#2E9BD6; --good:#2FB36A; --bad:#E25B4F; --gold:#FFC531;
  --display:'Comfortaa', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Rubik', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--display)}
.brand svg{width:30px;height:auto}
.lvname{font:700 18px var(--display);color:var(--soft);margin-right:auto}
.btn{font:600 20px var(--body);border:0;border-radius:18px;padding:14px 24px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--accent-deep);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sm{font-size:17px;padding:10px 16px;border-radius:14px}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #1F78A8}

/* menu */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel);border-radius:28px;padding:22px 26px;box-shadow:0 6px 0 var(--line);flex-wrap:wrap}
.hero h1{font:700 clamp(30px,5vw,48px)/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;font-size:20px;line-height:1.45;max-width:30ch;color:var(--soft)}
.hero-side{display:flex;align-items:center;gap:22px}
.hanger{width:96px;transform-origin:50% 10%;animation:swing 3.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.total{font:700 26px var(--display);background:#FFF6DA;border-radius:20px;padding:14px 18px;white-space:nowrap}
.total .s{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--panel);border:0;border-radius:26px;padding:20px 14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--line);transition:transform .15s}
.lv:hover{transform:translateY(-4px)}
.lv .door{position:absolute;top:12px;left:14px;font:700 14px var(--body);letter-spacing:.06em;color:var(--soft);background:var(--bg);border-radius:10px;padding:4px 8px}
.lv .ico{font-size:64px;line-height:1.1;margin-top:10px}
.lv .nm{font:700 20px/1.2 var(--display)}
.lv .sb{font-size:16px;color:var(--soft);line-height:1.3}
.stars{display:flex;gap:2px;font-size:28px;line-height:1}
.st{color:#D6E3DF}.st.on{color:var(--gold)}
.foot{color:var(--soft);font-size:15px;text-align:center;margin:4px 0 0}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:15px;padding:4px}

/* level common */
.level{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.prompt{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:22px;padding:12px 16px;box-shadow:0 4px 0 var(--line)}
.ptext{font:700 clamp(18px,2.3vw,25px)/1.35 var(--display);flex:1;min-width:0;text-wrap:balance}
.speak{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #1F78A8}
.pill{flex:none;font:700 20px var(--display);background:var(--bg);border-radius:16px;padding:10px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scene{position:relative;width:min(100%, calc((100dvh - var(--reserve,250px)) * 1.6));min-width:min(100%,520px);margin-inline:auto;aspect-ratio:16/10;border-radius:26px;overflow:hidden;container-type:inline-size;background:var(--panel);box-shadow:0 6px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.it{position:absolute;transform:translate(-50%,-50%);font-size:7cqw;line-height:1;background:none;border:0;padding:0;cursor:pointer;touch-action:none}
.it .in{display:inline-block;transition:transform .15s;filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.25))}
.it:hover .in{transform:scale(1.12)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.hint .in,.hint.card,.hint.tile{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.card.hint{box-shadow:0 0 0 5px var(--gold),0 6px 0 var(--line)}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.flyer{position:fixed;z-index:60;pointer-events:none;line-height:1}

/* toast */
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);z-index:70;font:700 clamp(20px,3vw,30px) var(--display);color:#fff;padding:14px 26px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;text-align:center;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.good{background:var(--good)} #toast.bad{background:var(--bad)}

/* cart */
.cart-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{background:var(--panel);border:0;border-radius:22px;padding:14px 8px 12px;cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .15s, opacity .3s}
.tile:hover{transform:translateY(-4px)}
.tile .in{display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .emo{font-size:58px;line-height:1.1}
.tile .nm{font:500 17px/1.2 var(--body)}
.tile.done{opacity:.35;pointer-events:none;background:#E3F6EA}
.cart-box{background:var(--panel);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}
.cart-box h3{margin:0;font:700 20px var(--display)}
.cart-load{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:52px;font-size:40px;line-height:1}
.cart-load span{animation:popin .4s}
.cart-box svg{width:100%;max-width:220px}

/* bed */
.bed-wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.bed-scene{aspect-ratio:3/2;width:100%;min-width:0}
.layer{opacity:0;transform:translateY(-40px);transition:opacity .7s, transform .7s}
.layer.on{opacity:1;transform:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:0;border-radius:22px;padding:12px 8px;cursor:pointer;box-shadow:0 5px 0 var(--line);position:relative;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .in{display:flex;flex-direction:column;align-items:center;gap:6px}
.card .ic{height:58px;display:flex;align-items:center;font-size:50px}
.card .ic svg{height:52px;width:auto}
.card .nm{font:600 17px/1.2 var(--body)}
.card .badge{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--good);color:#fff;font:700 18px/32px var(--display);display:none}
.card.done{background:#E3F6EA;pointer-events:none}
.card.done .badge{display:block}

/* bath */
.spot .in{width:9cqw;display:block}
.spot svg{width:100%;height:auto;display:block}
.bub{position:absolute;width:2cqw;height:2cqw;border-radius:50%;border:.3cqw solid #8FD3F0;background:rgba(255,255,255,.7);pointer-events:none;transform:translate(-50%,-50%)}
.slot::after{content:"";position:absolute;inset:-22%;border:.4cqw dashed rgba(30,58,69,.35);border-radius:50%}
.slot .in{filter:grayscale(1) brightness(0) opacity(.22)}
.slot.glow::after{border-color:var(--accent);animation:pulse 1s ease-in-out infinite}
.slot.placed{pointer-events:none}
.slot.placed::after{display:none}
.slot.placed .in{filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.25));animation:popin .5s}
.tray{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tray button{background:var(--panel);border:0;border-radius:20px;padding:10px 14px;min-width:120px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.tray .emo{font-size:48px;line-height:1.1;height:56px;display:flex;align-items:center}
.tray .emo svg{height:52px;width:auto}
.tray .nm{font:500 16px var(--body)}
.tray button.sel{transform:translateY(-8px);box-shadow:0 0 0 5px var(--accent),0 8px 0 var(--line)}

/* room */
.dust{position:absolute;left:0;top:62%;width:100%;height:38%;pointer-events:none;transition:opacity .8s}
.bin .in{font-size:9cqw}
.bin{cursor:default}
.bin.bump .in{animation:popin .45s}
.trash.drag .in{transform:scale(1.25)}
.vac{position:absolute;width:9cqw;transform:translate(-50%,-92%);pointer-events:none;z-index:5}
.meter{position:relative;height:42px;border-radius:21px;background:var(--panel);box-shadow:0 4px 0 var(--line);overflow:hidden;width:min(100%,560px);margin-inline:auto}
.meter-fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#9BE3B8,var(--good));transition:width .3s}
.meter span{position:relative;display:block;text-align:center;font:700 20px/42px var(--display);font-variant-numeric:tabular-nums}

/* check */
.prob .ok{position:absolute;right:-1.5cqw;top:-1.5cqw;width:4cqw;height:4cqw;border-radius:50%;background:var(--good);color:#fff;font:700 2.6cqw/4cqw var(--body);text-align:center;animation:popin .4s}
.prob{transition:left .8s, top .8s, opacity .6s}
.prob .in{transition:transform .8s}
.under{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}

/* win */
[hidden]{display:none!important}
#win:not([hidden]){position:fixed;inset:0;z-index:80;background:rgba(30,58,69,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.wincard{background:var(--panel);border-radius:32px;padding:30px 28px;text-align:center;max-width:460px;width:100%;animation:popin .45s}
.wincard h2{font:700 40px var(--display);margin:0 0 6px}
.wincard p{font-size:20px;color:var(--soft);margin:10px 0 22px}
.wincard .stars{justify-content:center;font-size:64px;gap:8px}
.wincard .st.on{animation:popin .5s backwards}
.wincard .st.on:nth-child(2){animation-delay:.2s}.wincard .st.on:nth-child(3){animation-delay:.4s}
.winbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}


/* sorting */
.sort-stage{display:flex;justify-content:center}
.sort-item{min-height:230px;min-width:260px;background:var(--panel);border-radius:30px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 28px}
.sort-item.pop{animation:popin .45s}
.sort-item .emo{font-size:110px;line-height:1;height:140px;display:flex;align-items:center}
.sort-item .emo svg{height:140px;width:auto}
.sort-item .nm{font:700 clamp(22px,3vw,30px)/1.2 var(--display);text-align:center;max-width:22ch;text-wrap:balance}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.bin-btn{background:var(--panel);border:0;border-top:12px solid var(--c);border-radius:22px;padding:14px 10px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.bin-btn:hover{transform:translateY(-4px)}
.bin-btn .bi{font-size:52px;height:60px;display:flex;align-items:center}
.bin-btn .bi svg{height:54px;width:auto}
.bin-btn .bl{font:700 18px/1.25 var(--display);text-align:center}
.bin-btn.bump,.basket.bump{animation:popin .4s}
.bin-btn.hint{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 5px var(--gold),0 5px 0 var(--line)}
/* order ladder */
.ladder{list-style:none;margin:0;padding:14px;background:var(--panel);border-radius:24px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.ladder li{display:flex;align-items:center;gap:12px;min-height:38px;border-radius:14px;background:var(--bg);padding:4px 12px 4px 4px;font:600 17px var(--body);color:var(--soft)}
.ladder li::before{content:attr(data-n);flex:none;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 18px var(--display);color:var(--ink)}
.ladder li.done{background:#E3F6EA;color:var(--ink);animation:popin .4s}
.ladder li.done::before{background:var(--good);color:#fff}
.lic{font-size:26px;display:flex;align-items:center}.lic svg{height:30px;width:auto}
/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,calc((100dvh - 220px)*1.05));margin-inline:auto}
.mcard{aspect-ratio:1.15;border:0;background:none;padding:0;cursor:pointer;perspective:800px}
.mi{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .mi{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 var(--line)}
.mf.back{background:var(--blue)}
.mf.front{background:var(--panel);transform:rotateY(180deg)}
.mf .emo{font-size:clamp(34px,6vw,58px);line-height:1}
.mf .nm{font:600 clamp(13px,1.6vw,17px) var(--body)}
.mcard.ok .mf.front{background:#E3F6EA;box-shadow:0 0 0 4px var(--good)}
/* catch */
.catch{cursor:none}
.basket{position:absolute;bottom:3%;width:15cqw;transform:translateX(-50%);pointer-events:none}
.fall{position:absolute;transform:translate(-50%,-50%);font-size:6.5cqw;line-height:1;pointer-events:none}
.fall svg{height:1em;width:auto}
.start-ov{position:absolute;inset:0;background:rgba(30,58,69,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:default}
.start-ov p{background:var(--panel);border-radius:16px;padding:10px 16px;font:600 18px var(--body);margin:0;text-align:center;max-width:90%}
.start-ov .btn{font-size:26px;padding:18px 36px}

/* part 2 */
.part{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;font:700 24px var(--display);margin:10px 0 -2px}
.part span{font:600 18px var(--body);color:var(--soft)}
.lv.p2 .door{background:#FFF0E3;color:var(--accent-deep)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcard{position:relative;background:var(--panel);border:0;border-radius:18px;padding:8px 8px 10px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.rcard:hover{transform:translateY(-3px)}
.rn{font:700 18px var(--display)}
.mroom{width:100%;height:auto;border-radius:10px;display:block}
.stamp{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-10deg);font:700 19px var(--display);color:#fff;padding:6px 12px;border-radius:12px;opacity:0;pointer-events:none;white-space:nowrap}
.rcard.marked .stamp{opacity:1;animation:popin .4s}
.m-dirty .stamp{background:var(--bad)} .m-dnd .stamp{background:#7A5BC7;font-size:15px} .m-clean .stamp{background:var(--good)}
.rcard.marked{pointer-events:none}
.rcard.hint{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 5px var(--gold),0 5px 0 var(--line)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--panel);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line);min-height:96px}
.chip{display:flex;align-items:center;gap:8px;border:0;background:var(--bg);border-radius:16px;padding:8px 14px;cursor:pointer;font:700 24px var(--display);transition:transform .15s}
.chip .dm{height:44px;width:auto}
.chip.sel{transform:translateY(-6px);box-shadow:0 0 0 5px var(--accent)}
.flynum{font:700 26px var(--display);background:var(--gold);border-radius:10px;padding:4px 8px}
.maids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.maid{background:var(--panel);border:0;border-radius:24px;padding:14px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.maid:hover{transform:translateY(-3px)}
.maid.full{background:#E3F6EA}
.mav{font-size:64px;line-height:1}
.mnm{font:700 22px var(--display)}
.mslots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ms{width:58px;height:40px;border-radius:10px;border:3px dashed var(--line);display:grid;place-items:center;font:700 18px var(--display)}
.ms.on{border:3px solid var(--good);background:#fff;animation:popin .4s}
.call{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:center}
.phone{background:var(--panel);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:10px 14px;align-items:center}
.ring{font-size:54px;grid-row:1}
.ringing{animation:ring .5s 3}
@keyframes ring{25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.gav{font-size:76px;line-height:1;grid-row:1;justify-self:start}
.bubble{grid-column:1/-1;position:relative;background:#FFF6DA;border-radius:22px;padding:16px 18px;font:700 clamp(19px,2.2vw,24px)/1.4 var(--display)}
.bubble.pop{animation:popin .45s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices .card .ic{height:70px;font-size:60px}.choices .card .ic svg{height:60px}
.choices .card.done{background:#E3F6EA}
.count{display:flex;flex-direction:column;gap:18px;align-items:center}
.guests{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;background:var(--panel);border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--line);width:100%}
.guest{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:120px}
.gp{font-size:80px;line-height:1}
.gis{display:flex;gap:6px}
.gi{position:relative;font-size:46px;line-height:1;opacity:.85}
.gi svg{height:50px;width:auto}
.gi.on,.gi.peek{opacity:1}
.gi.on::after,.gi.peek::after{content:attr(data-c);position:absolute;right:-8px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font:700 16px/28px var(--display);text-align:center;animation:popin .3s}
.gi.on::after{background:var(--good)}
.nums{display:flex;gap:18px;justify-content:center}
.num{width:110px;height:110px;border:0;border-radius:26px;background:var(--panel);box-shadow:0 6px 0 var(--line);font:700 54px var(--display);cursor:pointer;transition:transform .15s}
.num:hover{transform:translateY(-4px)}
.num.right{background:var(--good);color:#fff}
.kp-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.kp-door{background:var(--panel);border-radius:24px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.kp-door svg{display:block;width:100%;height:auto;max-height:52dvh}
.kp-door.pop{animation:popin .45s}
.kp{background:var(--panel);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.kp-disp{display:flex;gap:10px;justify-content:center}
.kp-disp span{width:64px;height:76px;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center;font:700 44px var(--display)}
.kp-disp span.f{border-color:var(--blue);background:#EAF6FC}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:62px;border:0;border-radius:16px;background:var(--bg);font:700 30px var(--display);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.kok{background:var(--good);color:#fff;box-shadow:0 4px 0 #23864F}
.key.kdel{background:#FDE3E0}
.key.hint{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 5px var(--gold)}
.sheet{background:#FFFDF6;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 var(--line);background-image:repeating-linear-gradient(transparent 0 37px,#E6EEF2 37px 39px)}
.sheet h3{margin:0 0 8px;font:700 19px var(--display)}
.rep{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font:600 19px var(--body);font-variant-numeric:tabular-nums}
.rep li{animation:popin .4s}
.rep li span{display:inline-block;min-width:80px}
.rep .ok{color:var(--good)}
.diff-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.diff-wrap .scene{width:100%;min-width:0}
.dl{align-self:flex-start;font:700 17px var(--display);color:#fff;border-radius:12px;padding:5px 12px}
.dl.good{background:var(--good)}.dl.bad{background:var(--accent)}
.dright .prob .in{transition:none}
.scene .dring{width:9cqw;height:9cqw;border:.6cqw solid var(--bad);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:popin .4s;z-index:3}
.pz-wrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
.pz-grid{display:grid;gap:4px;aspect-ratio:16/10;width:min(100%,calc((100dvh - 250px)*1.6));background:var(--line);padding:4px;border-radius:20px;box-shadow:0 6px 0 var(--line)}
.pz-grid.solved{gap:0;transition:gap .5s}
.pz-tile{border:0;padding:0;cursor:pointer;overflow:hidden;border-radius:10px;background:var(--panel);position:relative}
.pz-tile svg{display:block;width:100%;height:100%}
.pz-tile.sel{outline:6px solid var(--accent);outline-offset:-6px;z-index:2}
.pz-tile.right::after{content:"✓";position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;font:700 16px/26px var(--display);text-align:center}
.pz-grid.solved .pz-tile{border-radius:0}.pz-grid.solved .pz-tile::after{display:none}
.pz-tile.swap{animation:popin .35s}
.pz-ref{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--line)}
.pz-refimg{aspect-ratio:16/10;border-radius:10px;overflow:hidden}
.pz-refimg svg{display:block;width:100%;height:100%}
@media (max-width:760px){.call,.kp-wrap,.diff-wrap,.pz-wrap{grid-template-columns:1fr}.num{width:88px;height:88px}}

@media (max-width:760px){
  .cart-wrap,.bed-wrap{grid-template-columns:1fr}
  .scene{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

function fly(fromEl,toEl,html,cb){

  d.style.left=(a.left+a.width/2)+'px';d.style.top=(a.top+a.height/2)+'px';d.style.transform='translate(-50%,-50%)';
  document.body.append(d);
  const dx=b.left+b.width/2-(a.left+a.width/2),dy=b.top+b.height/2-(a.top+a.height/2);

}

/* ---------- cart (2 rounds) ---------- */
function lvCart(root){
  const rounds=[
    {intro:'Собери тележку для уборки! Нажми на вещи, которые нужны горничной.',done:'Тележка для уборки готова!',
     items:[['🧴','Моющее средство',1],['🧤','Перчатки',1],['🧻','Туалетная бумага',1],['🧽','Губка',1],['🪣','Ведро',1],['🧹','Веник',1],['⚽','Мяч',0],['🍰','Торт',0],['📱','Телефон',0],['🎮','Игра',0],['🧸','Игрушка',0],['🎸','Гитара',0]]},
    {intro:'Теперь собери набор для гостя. Что гость найдёт в номере?',done:'Набор для гостя готов!',
     items:[['🧼','Мыло',1],['🧴','Шампунь',1],['🩴','Тапочки',1],['💧','Вода',1],['🍵','Чай',1],['🪥','Зубная щётка',1],['🔨','Молоток',0],['🎈','Шарик',0],['🍕','Пицца',0],['🧦','Грязный носок',0],['🔋','Батарейка',0],['🐟','Рыба',0]]}];
  let r=0;
  function run(){
    const R=rounds[r],items=shuffle(R.items),need=items.filter(i=>i[2]).length;let got=0;
    root.innerHTML=promptHTML(R.intro,`Круг ${r+1} из 2 · <b>0</b> из ${need}`)+
    `<div class="cart-wrap"><div class="tiles">${items.map((it,i)=>`<button class="tile" data-i="${i}" aria-label="${it[1]}"><span class="in"><span class="emo">${it[0]}</span><span class="nm">${it[1]}</span></span></button>`).join('')}</div>
    <div class="cart-box"><h3>Моя тележка</h3><div class="cart-load"></div>${CART}</div></div>`;
    const load=root.querySelector('.cart-load');
    root.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{
      const it=items[t.dataset.i];
      if(it[2]){
        t.classList.add('done');sGood();speak(it[1]);got++;setPill(`Круг ${r+1} из 2 · <b>${got}</b> из ${need}`);
        fly(t.querySelector('.emo'),load,it[0],()=>{const s=document.createElement('span');s.textContent=it[0];load.append(s);sPop()});
        toast('Верно!','good');
        if(got===need)later(()=>{setPrompt(R.done);r++;later(r<rounds.length?()=>{run();speak(rounds[r].intro)}:win,1600)},900);
      }else{state.mistakes++;sBad();shake(t);toast('Это не нужно','bad');speak('Это не нужно. Попробуй ещё.')}
    });
  }
  run();
}

/* ---------- generic: sorting game ---------- */
function sortGame(root,o){
  const items=shuffle(o.items).slice(0,o.count||o.items.length);let i=0,cur=null,streak=0;
  root.innerHTML=promptHTML(o.intro,`<b>0</b> из ${items.length}`)+
   `<div class="sort-stage"><div class="sort-item"></div></div>
    <div class="bins">${o.bins.map(b=>`<button class="bin-btn" data-k="${b.k}" style="--c:${b.c}"><span class="bi">${b.icon}</span><span class="bl">${b.label}</span></button>`).join('')}</div>`;
  const card=root.querySelector('.sort-item'),bins=[...root.querySelectorAll('.bin-btn')];
  function show(){cur=items[i];streak=0;card.innerHTML=`<span class="emo">${cur.h}</span><span class="nm">${cur.n}</span>`;card.classList.remove('pop');void card.offsetWidth;card.classList.add('pop');if(i>0)speak(cur.n)}
  bins.forEach(b=>b.onclick=()=>{
    if(!cur)return;
    if(b.dataset.k===cur.k){
      const it=cur;cur=null;sGood();bins.forEach(x=>x.classList.remove('hint'));
      fly(card.querySelector('.emo'),b,it.h,()=>{b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');sPop()});
      card.innerHTML='';i++;setPill(`<b>${i}</b> из ${items.length}`);
      const pt=document.querySelector('.ptext');pt.textContent='Верно! '+it.why;speak('Верно! '+it.why);
      later(()=>{if(i<items.length){show();pt.textContent=o.intro}else{setPrompt(o.done);later(win,1500)}},1900);
    }else{
      state.mistakes++;streak++;sBad();shake(b);shake(card);toast('Не сюда. Подумай ещё','bad');speak('Не сюда. Подумай ещё.');
      if(streak>=2)bins.find(x=>x.dataset.k===cur.k).classList.add('hint');
    }
  });
  show();
}

/* ---------- generic: put steps in order ---------- */
function orderGame(root,o){
  let cur=0,streak=0;const steps=o.steps,order=shuffle(steps.map((s,i)=>i));
  root.innerHTML=promptHTML(o.intro,`Шаг <b>1</b> из ${steps.length}`)+
  `<div class="bed-wrap">${o.scene?`<div class="scene bed-scene">${o.scene}</div>`:`<ol class="ladder">${steps.map((s,i)=>`<li data-n="${i+1}"><span class="lic"></span><span class="lnm">?</span></li>`).join('')}</ol>`}
   <div class="cards">${order.map(i=>`<button class="card" data-i="${i}"><span class="in"><span class="ic">${steps[i].icon}</span><span class="nm">${steps[i].n}</span></span><span class="badge"></span></button>`).join('')}</div></div>`;
  const cards=[...root.querySelectorAll('.card')],lis=[...root.querySelectorAll('.ladder li')];
  cards.forEach(c=>c.onclick=()=>{
    const i=+c.dataset.i;
    if(i===cur){
      sGood();cards.forEach(x=>x.classList.remove('hint'));c.classList.add('done');c.querySelector('.badge').textContent=cur+1;
      if(lis[i]){lis[i].classList.add('done');lis[i].querySelector('.lic').innerHTML=steps[i].icon;lis[i].querySelector('.lnm').textContent=steps[i].n}
      o.apply&&o.apply(i,root);cur++;streak=0;
      if(cur===steps.length){setPill('Готово!');setPrompt(o.done);later(win,1800)}
      else{setPill(`Шаг <b>${cur+1}</b> из ${steps.length}`);setPrompt('Верно! '+(steps[i].x||'')+' Что дальше?')}
    }else{
      state.mistakes++;streak++;sBad();shake(c);toast('Пока рано','bad');speak('Пока рано. Подумай, что идёт раньше.');
      if(streak>=2)cards.find(x=>+x.dataset.i===cur).classList.add('hint');
    }
  });
}

function lvMinibar(root){

    const missing=shuffle(items).slice(0,5),extra=shuffle([['🧦','Носок'],['🔑','Ключ'],['📱','Телефон'],['🧴','Шампунь']]).slice(0,2);

    tray.innerHTML=shuffle([...missing.map(m=>[m.h,m.n,m.k]),...extra.map(e=>[e[0],e[1],'x'])]).map(t=>`<button data-k="${t[2]}" data-n="${t[1]}"><span class="emo">${t[0]}</span><span class="nm">${t[1]}</span></button>`).join('');
    tray.querySelectorAll('button').forEach(b=>b.onclick=()=>{tray.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');sPop();speak(b.dataset.n);slots.forEach(g=>g.classList.toggle('glow',!g.classList.contains('placed')))});
    slots.forEach(g=>g.onclick=()=>{
      if(!sel){toast('Сначала выбери продукт внизу','bad');speak('Сначала выбери продукт внизу');return}

/* ---------- level: catch clean linen ---------- */
function lvCatch(root){
  const goal=20,good=[[TOWEL,'Полотенце'],[PILLOW_MINI,'Подушка'],['🧼','Мыло'],['🧴','Шампунь'],[ICONS.sheet,'Простыня']],bad=[['🧦','Грязный носок'],['🍌','Кожура'],['🥤','Мусор']];
  let score=0,running=false,bx=50,items=[],last=0,spawnT=0;
  root.innerHTML=promptHTML('Лови корзиной только чистые вещи! Мусор и грязное пропускай.',`Поймано: <b>0</b> из ${goal}`)+
   `<div class="scene catch" style="--reserve:270px">${LAUNDRY_BG}<div class="basket">${BASKET}</div><div class="start-ov"><button class="btn" id="go">▶ Начать</button><p>Двигай мышкой влево и вправо или нажимай стрелки ← →</p></div></div>`;
  const scene=root.querySelector('.scene'),basket=root.querySelector('.basket');
  const setB=x=>{bx=Math.max(7,Math.min(93,x));basket.style.left=bx+'%'};setB(50);
  scene.addEventListener('pointermove',e=>{const r=scene.getBoundingClientRect();setB((e.clientX-r.left)/r.width*100)});
  scene.addEventListener('pointerdown',e=>{const r=scene.getBoundingClientRect();setB((e.clientX-r.left)/r.width*100)});
  const key=e=>{if(!document.contains(scene)){removeEventListener('keydown',key);return}if(e.key==='ArrowLeft'){setB(bx-6);e.preventDefault()}if(e.key==='ArrowRight'){setB(bx+6);e.preventDefault()}};
  addEventListener('keydown',key);
  root.querySelector('#go').onclick=()=>{root.querySelector('.start-ov').remove();running=true;last=performance.now();requestAnimationFrame(loop)};
  function spawn(){const isBad=Math.random()<.32,src=isBad?bad[Math.random()*bad.length|0]:good[Math.random()*good.length|0];const el=document.createElement('div');el.className='fall';el.innerHTML=`<span class="in">${src[0]}</span>`;const it={el,x:8+Math.random()*84,y:-8,bad:isBad,n:src[1]};placeIt(el,it.x,it.y);scene.append(el);items.push(it)}
  function loop(t){
    if(!running||!document.contains(scene))return;
    const dt=Math.min(.05,(t-last)/1000);last=t;spawnT-=dt;
    if(spawnT<=0){spawn();spawnT=1.5-score*.025}
    const sp=12+score*.35;
    items=items.filter(it=>{it.y+=sp*dt;placeIt(it.el,it.x,it.y);
      if(it.y>78&&it.y<90&&Math.abs(it.x-bx)<9){it.el.remove();
        if(it.bad){state.mistakes++;sBad();toast(it.n+'! Это не ловим','bad');basket.classList.remove('shake');void basket.offsetWidth;basket.classList.add('shake')}
        else{score++;sGood();setPill(`Поймано: <b>${score}</b> из ${goal}`);basket.classList.remove('bump');void basket.offsetWidth;basket.classList.add('bump');
          if(score>=goal){running=false;items.forEach(i=>i.el.remove());setPrompt('Вся чистая бельевая собрана!');later(()=>win(state.mistakes<=1?3:state.mistakes<=4?2:1),1300);return false}}
        return false}
      if(it.y>108){it.el.remove();return false}return true});
    if(running)requestAnimationFrame(loop);
  }
}

  placeIt(bin,7,85);

  const blocked=(x,y)=>(x>=198&&y<34)||(x>=148&&x<198&&y<16);
  cx.fillStyle='rgba(150,118,78,.32)';cx.fillRect(0,0,148,95);cx.fillRect(148,16,50,79);cx.fillRect(198,34,202,61);
  for(let i=0;i<2200;i++){const x=Math.random()*400,y=Math.random()*95;if(blocked(x,y))continue;cx.fillStyle=`rgba(${90+Math.random()*40|0},${65+Math.random()*30|0},40,${.4+Math.random()*.4})`;cx.beginPath();cx.arc(x,y,.6+Math.random()*2.2,0,6.3);cx.fill()}
  const countDust=()=>{const d=cx.getImageData(0,0,400,95).data;let n=0;for(let i=3;i<d.length;i+=4)if(d[i]>30)n++;return n};
  const total=countDust();
  let phase=1,trashLeft=5;
  const trash=[['🍌',22,74],['🥤',36,91],['📰',50,82],['🍬',66,91],['🧃',86,87]];
  trash.forEach(([e,x,y])=>{
    const t=document.createElement('button');t.className='it trash';t.setAttribute('aria-label','Мусор');t.innerHTML=`<span class="in">${e}</span>`;placeIt(t,x,y);scene.append(t);
    let start=null,ox,oy,moved=false;
    t.addEventListener('pointerdown',ev=>{ev.preventDefault();t.setPointerCapture(ev.pointerId);start={x:ev.clientX,y:ev.clientY};ox=parseFloat(t.style.left);oy=parseFloat(t.style.top);moved=false;t.style.transition='none';t.style.zIndex=4});
    t.addEventListener('pointermove',ev=>{if(!start)return;const r=scene.getBoundingClientRect(),dx=ev.clientX-start.x,dy=ev.clientY-start.y;if(Math.hypot(dx,dy)>8){moved=true;t.classList.add('drag')}if(moved)placeIt(t,ox+dx/r.width*100,oy+dy/r.height*100)});
    t.addEventListener('pointerup',ev=>{
      if(!start)return;start=null;t.classList.remove('drag');
      const a=t.getBoundingClientRect(),b=bin.getBoundingClientRect(),cxp=a.left+a.width/2,cyp=a.top+a.height/2,pad=40;
      const over=cxp>b.left-pad&&cxp<b.right+pad&&cyp>b.top-pad&&cyp<b.bottom+pad;
      if(!moved||over){
        t.style.transition=RM?'none':'left .45s, top .45s, opacity .45s';placeIt(t,7,82);t.style.opacity=0;t.style.pointerEvents='none';
        later(()=>{t.remove();bin.classList.remove('bump');void bin.offsetWidth;bin.classList.add('bump');sGood();trashLeft--;setPill(`Мусор: <b>${trashLeft}</b>`);toast('В мусор!','good');if(trashLeft===0)later(startVac,700)},RM?0:450);
      }else{t.style.transition='left .3s, top .3s';placeIt(t,ox,oy)}
    });
  });
  let last=null,moves=0;
  function startVac(){
    phase=2;root.querySelector('.meter').hidden=false;vac.hidden=false;placeIt(vac,50,80);setPill('Пылесос');
    setPrompt('Теперь пропылесось пол. Води пылесосом по грязному полу.');
  }
  function toCanvas(ev){const r=scene.getBoundingClientRect(),x=(ev.clientX-r.left)/r.width,y=(ev.clientY-r.top)/r.height;return {x,y,cx:x*400,cy:(y-.62)/.38*95}}
  function vacMove(ev){
    if(phase!==2)return;const p=toCanvas(ev);placeIt(vac,p.x*100,p.y*100);
    cx.globalCompositeOperation='destination-out';cx.lineCap='round';cx.lineWidth=36;
    cx.beginPath();const l=last||p;cx.moveTo(l.cx,l.cy);cx.lineTo(p.cx,p.cy);cx.stroke();
    cx.beginPath();cx.arc(p.cx,p.cy,18,0,6.3);cx.fill();
    last=p;moves++;
    if(moves%14===0)tone(95,.09,'sawtooth',.025);
    if(moves%6===0){const left=countDust()/total,pct=Math.min(100,Math.round((1-left)/.94*100));root.querySelector('.meter-fill').style.width=pct+'%';root.querySelector('.meter b').textContent=pct;
      if(left<.06){phase=3;cv.style.opacity=0;vac.hidden=true;root.querySelector('.meter-fill').style.width='100%';root.querySelector('.meter b').textContent=100;sGood();setPrompt('Пол чистый! Отличная работа.');later(win,1500)}}
  }
  scene.addEventListener('pointermove',vacMove);
  scene.addEventListener('pointerdown',ev=>{if(phase===2){last=toCanvas(ev);vacMove(ev)}});
  scene.addEventListener('pointerleave',()=>last=null);
}

function lvStatus(root){

  function mark(c,t){c.classList.add('marked','m-'+t);c.querySelector('.stamp').textContent=LBL[t]}

    root.innerHTML=promptHTML('Это доска этажа. Нажми на все грязные номера.',`Этаж ${floor} · круг ${floor-1} из 2`)+
      `<div class="board">${rooms.map((r,i)=>`<button class="rcard" data-i="${i}" aria-label="Номер ${r.n}"><span class="rn">№ ${r.n}</span>${miniRoom(r.t)}<span class="stamp"></span></button>`).join('')}</div>`;
    const cards=[...root.querySelectorAll('.rcard')];let phase='dirty',got=0,streak=0;
    cards.forEach(c=>c.onclick=()=>{

      if(r.t===phase){
        mark(c,phase);got++;streak=0;sGood();cards.forEach(x=>x.classList.remove('hint'));
        if(got===rooms.filter(x=>x.t===phase).length){got=0;
          if(phase==='dirty'){phase='dnd';later(()=>setPrompt('Молодец! Теперь нажми на номера с табличкой «Не беспокоить».'),700)}
          else{phase=null;later(()=>{
            cards.filter(x=>!x.classList.contains('marked')).forEach((x,k)=>later(()=>{mark(x,'clean');sPop()},k*300));
            setPrompt('Остальные номера чистые. Доска этажа готова!');
            later(()=>{if(floor===2){floor=3;run();speak('Этаж 3. Нажми на все грязные номера.')}else win()},2800)},600)}
        }
      }else{
        state.mistakes++;streak++;sBad();shake(c);const m=phase==='dirty'?'Этот номер не грязный':'Здесь нет таблички «Не беспокоить»';toast(m,'bad');speak(m);
        if(streak>=2){const k=rooms.findIndex((x,i)=>x.t===phase&&!cards[i].classList.contains('marked'));if(k>=0)cards[k].classList.add('hint')}
      }
    });
  }
  run();
}

    const q=`В номере ${n} ${plural(n,['гость','гостя','гостей'])}. Каждому — ${k} ${plural(k,it.f)}. Сколько всего?`;
    setPrompt(q);
    const ps=shuffle(people);
    G.innerHTML=Array.from({length:n},(_,g)=>`<div class="guest"><span class="gp">${ps[g]}</span><span class="gis">${Array.from({length:k},()=>`<span class="gi">${it.h}</span>`).join('')}</span></div>`).join('');
    const opts=shuffle([c,...shuffle([c-2,c-1,c+1,c+2].filter(x=>x>0)).slice(0,2)]).sort((a,b)=>a-b);
    N.innerHTML=opts.map(o=>`<button class="num" data-v="${o}">${o}</button>`).join('');
    N.querySelectorAll('.num').forEach(b=>b.onclick=()=>{
      if(+b.dataset.v===c){
        sGood();b.classList.add('right');N.querySelectorAll('.num').forEach(x=>x.disabled=true);
        [...G.querySelectorAll('.gi')].forEach((g,j)=>later(()=>{g.classList.add('on');g.dataset.c=j+1;sPop()},j*260));
        later(()=>{setPrompt(`Верно! Всего ${c} ${plural(c,it.f)}.`);i++;setPill(`Задача <b>${Math.min(i+1,total)}</b> из ${total}`);
          later(i===total?win:show,2200)},c*260+200);
      }else{state.mistakes++;streak++;sBad();shake(b);toast('Посчитай картинки ещё раз','bad');speak('Посчитай картинки ещё раз');
        if(streak>=2)[...G.querySelectorAll('.gi')].forEach((g,j)=>later(()=>{g.classList.add('peek');g.dataset.c=j+1},j*300))}
    });
  }
  show();
}

function bigDoor(n){return `<svg viewBox="0 0 140 200" aria-label="Дверь номера ${n}"><rect width="140" height="200" fill="#F3E6D3"/><rect x="20" y="10" width="100" height="190" rx="4" fill="#A8703F"/><rect x="32" y="62" width="76" height="56" rx="3" fill="#BF8550"/><rect x="32" y="128" width="76" height="62" rx="3" fill="#BF8550"/><rect x="36" y="18" width="68" height="34" rx="6" fill="#F1C75B"/><text x="70" y="45" text-anchor="middle" font-family="Comfortaa,Rubik,sans-serif" font-weight="700" font-size="28" fill="#1E3A45">${n}</text><circle cx="104" cy="126" r="6" fill="#F1C75B"/></svg>`}

function lvKeypad(root){
  const set=new Set();while(set.size<8)set.add((1+Math.random()*5|0)*100+1+(Math.random()*19|0));
  const nums=[...set];let i=0,val='',streak=0,hinting=false;
  root.innerHTML=promptHTML('Ты убрала номер. Посмотри на дверь и запиши номер в отчёт.','Номер <b>1</b> из 8')+
   `<div class="kp-wrap"><div class="kp-door"></div><div class="kp"><div class="kp-disp"><span></span><span></span><span></span></div>
    <div class="kp-keys">${[1,2,3,4,5,6,7,8,9,'⌫',0,'✓'].map(k=>`<button class="key${k==='✓'?' kok':k==='⌫'?' kdel':''}" data-k="${k}" aria-label="${k==='⌫'?'Стереть':k==='✓'?'Готово':k}">${k}</button>`).join('')}</div></div>
    <div class="sheet"><h3>Отчёт горничной</h3><ol class="rep"></ol></div></div>`;
  const door=root.querySelector('.kp-door'),disp=root.querySelector('.kp-disp'),rep=root.querySelector('.rep'),keys=[...root.querySelectorAll('.key')];
  function upd(){[...disp.children].forEach((s,j)=>{s.textContent=val[j]||'';s.classList.toggle('f',!!val[j])});
    keys.forEach(k=>k.classList.remove('hint'));
    if(hinting){const t=String(nums[i]),nk=val.length<3?t[val.length]:'✓';if(t.startsWith(val)){const el=keys.find(k=>k.dataset.k===nk);el&&el.classList.add('hint')}}}
  function show(){door.innerHTML=bigDoor(nums[i]);door.classList.remove('pop');void door.offsetWidth;door.classList.add('pop');val='';streak=0;hinting=false;upd()}
  function press(k){
    if(!document.contains(root))return;
    if(k==='⌫'){val=val.slice(0,-1);sPop()}else if(k==='✓'){check();return}else if(val.length<3){val+=k;sPop()}
    upd();
  }
  function check(){
    if(val===String(nums[i])){sGood();toast('Записано!','good');
      const li=document.createElement('li');li.innerHTML=`<span>№ ${nums[i]}</span><span class="ok">✓ Убрано</span>`;rep.append(li);
      i++;setPill(`Номер <b>${Math.min(i+1,8)}</b> из 8`);
      if(i===8){setPrompt('Отчёт готов! Отдай его старшей горничной.');later(win,1600)}else later(show,900);
    }else{state.mistakes++;streak++;sBad();shake(disp);const t='Посмотри на дверь ещё раз. Номер '+nums[i];toast('Не тот номер','bad');speak(t);val='';if(streak>=2)hinting=true;upd()}
  }
  keys.forEach(k=>k.onclick=()=>press(k.dataset.k));
  const onKey=e=>{if(!document.contains(root)){removeEventListener('keydown',onKey);return}
    if(/^[0-9]$/.test(e.key))press(e.key);else if(e.key==='Backspace'){e.preventDefault();press('⌫')}else if(e.key==='Enter'){e.preventDefault();press('✓')}};
  addEventListener('keydown',onKey);
  show();
}

function lvDiff(root){
  const POOL=[{h:'🧦',at:[14,74]},{h:'☕',at:[46,45]},{h:'🍌',at:[24,92]},{h:TOWEL,at:[72,88]},{h:BLOB,at:[40,86],w:6},{h:'🍾',at:[93,90]},{h:'📰',at:[56,93]},{h:'🥤',at:[31,68]}];
  let r=0;
  function run(){
    const items=shuffle(POOL).slice(0,5);let found=0;
    root.innerHTML=promptHTML('Слева — как должно быть. Справа — как убрала горничная. Найди 5 ошибок на правой картинке.',`Круг ${r+1} из 2 · найдено <b>0</b> из 5`)+
      `<div class="diff-wrap"><div class="dcol"><span class="dl good">Как должно быть</span><div class="scene dleft">${roomSVG()}</div></div><div class="dcol"><span class="dl bad">Как сейчас</span><div class="scene dright">${roomSVG()}</div></div></div>
       <div class="under"><button class="btn blue" id="hintBtn">💡 Подсказка</button></div>`;
    const L=root.querySelector('.dleft'),R=root.querySelector('.dright');
    L.onclick=()=>{toast('Ищи ошибки на правой картинке','bad');speak('Ищи ошибки на правой картинке')};
    const els=items.map(p=>{
      const b=document.createElement('button');b.className='it prob';b.setAttribute('aria-label','Ошибка');
      b.innerHTML=`<span class="in" style="${p.w?`width:${p.w}cqw;display:block`:''}">${p.h}</span>`;placeIt(b,...p.at);R.append(b);
      b.onclick=e=>{e.stopPropagation();if(b.dataset.done)return;b.dataset.done=1;b.classList.remove('hint');found++;sGood();
        const ok=document.createElement('span');ok.className='ok';ok.textContent='✓';b.append(ok);
        [L,R].forEach(S=>{const ring=document.createElement('span');ring.className='dring';placeIt(ring,...p.at);S.append(ring)});
        setPill(`Круг ${r+1} из 2 · найдено <b>${found}</b> из 5`);toast('Нашёл!','good');
        if(found===5){setPrompt(r===0?'Все ошибки найдены! Следующий номер.':'Отлично! Ты внимательная старшая горничная.');r++;later(r<2?()=>{run();speak(document.querySelector('.ptext').textContent)}:win,1900)}};
      return b});
    root.querySelector('#hintBtn').onclick=()=>{const b=els.find(e=>!e.dataset.done);if(!b)return;state.hints++;b.classList.add('hint');later(()=>b.classList.remove('hint'),3500);speak('Посмотри сюда')};
  }
  run();
}

function lvPuzzle(root){
  const rounds=[{svg:roomSVG(),c:3,rw:2,name:'номер'},{svg:BATH,c:3,rw:2,name:'ванную'},{svg:roomSVG(),c:3,rw:3,name:'номер'}];let r=0;
  function run(){
    const R=rounds[r],n=R.c*R.rw,tw=800/R.c,th=500/R.rw;
    const base=R.svg.replace('class="bg"','class="pzs"').replace(' aria-hidden="true"','');
    const tiles=Array.from({length:n},(_,t)=>base.replace('viewBox="0 0 800 500"',`viewBox="${(t%R.c)*tw} ${Math.floor(t/R.c)*th} ${tw} ${th}"`));
    let pos;do{pos=shuffle([...Array(n).keys()])}while(pos.filter((p,k)=>p===k).length>n/3);
    let sel=null;
    root.innerHTML=promptHTML(`Собери картинку: ${R.name}. Нажми на кусочек, потом на другой — они поменяются местами.`,`Картинка <b>${r+1}</b> из 3`)+
      `<div class="pz-wrap"><div class="pz-grid" style="grid-template-columns:repeat(${R.c},1fr);grid-template-rows:repeat(${R.rw},1fr)">${pos.map((p,k)=>`<button class="pz-tile" data-k="${k}" aria-label="Кусочек"></button>`).join('')}</div>
       <div class="pz-ref"><span class="dl good">Образец</span><div class="pz-refimg">${base}</div></div></div>`;
    const cells=[...root.querySelectorAll('.pz-tile')];
    const draw=()=>cells.forEach((c,k)=>{c.innerHTML=tiles[pos[k]];c.classList.toggle('right',pos[k]===k)});draw();
    cells.forEach(c=>c.onclick=()=>{
      const k=+c.dataset.k;
      if(sel===null){sel=k;c.classList.add('sel');sPop();return}
      cells[sel].classList.remove('sel');
      if(sel!==k){[pos[sel],pos[k]]=[pos[k],pos[sel]];draw();[cells[sel],c].forEach(x=>{x.classList.remove('swap');void x.offsetWidth;x.classList.add('swap')});
        pos[k]===k||pos[sel]===sel?sGood():sPop()}
      sel=null;
      if(pos.every((p,j)=>p===j)){root.querySelector('.pz-grid').classList.add('solved');setPrompt('Картинка собрана!');r++;later(r<rounds.length?()=>{run();speak(document.querySelector('.ptext').textContent)}:win,1800)}
    });
  }
  run();
}

function slotGame(root,o){
  let sel=null,placed=0;const n=o.items.length;
  root.innerHTML=promptHTML(o.intro,`<b>0</b> из ${n}`)+`<div class="scene" style="--reserve:360px">${o.scene}</div><div class="tray"></div>`;
  const scene=root.querySelector('.scene'),tray=root.querySelector('.tray');
  tray.innerHTML=shuffle([...o.items.map(it=>[it.h,it.n,it.k]),...(o.extras||[]).map(e=>[e[0],e[1],'x'])]).map(t=>`<button data-k="${t[2]}" data-n="${t[1]}"><span class="emo">${t[0]}</span><span class="nm">${t[1]}</span></button>`).join('');
  const slots=o.items.map(it=>{const g=document.createElement('button');g.className='it slot';g.dataset.k=it.k;g.setAttribute('aria-label','Место для: '+it.n);g.innerHTML=`<span class="in">${it.h}</span>`;placeIt(g,...it.at);scene.append(g);return g});
  tray.querySelectorAll('button').forEach(b=>b.onclick=()=>{tray.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');sPop();speak(b.dataset.n);slots.forEach(g=>g.classList.toggle('glow',!g.classList.contains('placed')))});
  slots.forEach(g=>g.onclick=()=>{
    if(!sel){toast('Сначала выбери вещь внизу','bad');speak('Сначала выбери вещь внизу');return}
    if(sel.dataset.k==='x'){state.mistakes++;sBad();shake(sel);toast(o.extraMsg,'bad');speak(o.extraMsg);return}
    if(g.dataset.k===sel.dataset.k){const it=o.items.find(x=>x.k===g.dataset.k);g.classList.add('placed');g.classList.remove('glow');sel.remove();sel=null;placed++;sGood();slots.forEach(x=>x.classList.remove('glow'));setPill(`<b>${placed}</b> из ${n}`);toast('На месте!','good');setPrompt(it.say);
      if(placed===n){later(()=>setPrompt(o.done),1600);later(win,3000)}}
    else{state.mistakes++;sBad();shake(g.querySelector('.in'));toast('Здесь место для другой вещи','bad');speak('Здесь место для другой вещи')}
  });
}

const DOOR_MINI=`<svg viewBox="0 0 30 44" class="dm"><rect x="2" y="2" width="26" height="40" rx="2" fill="#A8703F"/><rect x="6" y="6" width="18" height="12" rx="1" fill="#BF8550"/><rect x="6" y="22" width="18" height="16" rx="1" fill="#BF8550"/><circle cx="23" cy="24" r="1.8" fill="#F1C75B"/></svg>`;

/* ---------- flow ---------- */
function totalStars(){return LEVELS.reduce((s,l)=>s+(progress[l.id]||0),0)}
function menu(){
  clearTimers();try{speechSynthesis.cancel()}catch(e){}
  $('#home').hidden=true;$('#lvname').textContent='';
  screen.innerHTML=`<section class="hero"><div><h1>Чистый номер</h1><p>Помоги подготовить номер для гостя. Пройди 1 этаж — работа горничной, потом 2 этаж — работа старшей горничной.</p></div>
  <div class="hero-side">${HANGER}<div class="total"><span class="s">★</span> ${totalStars()} из ${LEVELS.length*3}</div></div></section>
  ${[[1,'1 этаж · Горничная'],[2,'2 этаж · Старшая горничная']].map(([pt,ttl])=>`<h2 class="part">${ttl}<span>★ ${LEVELS.filter(l=>l.part===pt).reduce((a,l)=>a+(progress[l.id]||0),0)} из ${LEVELS.filter(l=>l.part===pt).length*3}</span></h2>
  <div class="levels">${LEVELS.map((l,i)=>l.part!==pt?'':`<button class="lv p${pt}" data-i="${i}"><span class="door">№ ${l.door}</span><span class="ico">${l.icon}</span><span class="nm">${l.name}</span><span class="sb">${l.sub}</span>${starsHTML(progress[l.id]||0)}</button>`).join('')}</div>`).join('')}
  <p class="foot">Звёзды сохраняются на этом компьютере. <button class="link" id="reset">Начать заново</button></p>`;
  screen.querySelectorAll('.lv').forEach(b=>b.onclick=()=>start(+b.dataset.i));
  const r=$('#reset');r.onclick=()=>{if(r.dataset.sure){progress={};save();menu()}else{r.dataset.sure=1;r.textContent='Точно стереть звёзды? Нажми ещё раз'}};
}
function start(i){
  clearTimers();ac();
  state={i,mistakes:0,hints:0,timers:[]};
  $('#home').hidden=false;$('#lvname').textContent=`№ ${LEVELS[i].door} · ${LEVELS[i].name}`;
  screen.innerHTML='';const root=document.createElement('div');root.className='level';screen.append(root);
  LEVELS[i].run(root);
  speak(root.querySelector('.ptext').textContent);
  window.scrollTo(0,0);
}
function win(force){
  const l=LEVELS[state.i],err=state.mistakes+state.hints,s=force||(err===0?3:err<=2?2:1);
  progress[l.id]=Math.max(progress[l.id]||0,s);save();sWin();confetti();
  const msg={3:'Отлично! Без ошибок!',2:'Хорошо! Почти без ошибок.',1:'Получилось! Попробуй ещё раз без ошибок.'}[s];
  const last=state.i===LEVELS.length-1;
  $('#win').innerHTML=`<div class="wincard" role="dialog" aria-label="Уровень пройден"><h2>Молодец!</h2>${starsHTML(s)}<p>${msg}</p><div class="winbtns"><button class="btn ghost" id="wAgain">Ещё раз</button><button class="btn ghost" id="wMenu">Меню</button><button class="btn" id="wNext">${last?'Готово':'Дальше →'}</button></div></div>`;
  $('#win').hidden=false;speak('Молодец! '+msg);
  const close=()=>{$('#win').hidden=true};
  $('#wAgain').onclick=()=>{close();start(state.i)};
  $('#wMenu').onclick=()=>{close();menu()};
  $('#wNext').onclick=()=>{close();last?menu():start(state.i+1)};
  $('#wNext').focus();
}
function confetti(){
  if(RM)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;
  const cols=['#FF8A3D','#2E9BD6','#2FB36A','#FFC531','#E25B4F'];
  const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*3,vy:2.5+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:8+Math.random()*9,c:cols[Math.random()*5|0]}));
  let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(++t<220)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})();
}
$('#home').onclick=menu;
try{speechSynthesis.getVoices()}catch(e){}
menu();
</script>
