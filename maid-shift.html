<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Смена горничной</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@600;700&family=Rubik:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen game — top bar, then a big scene with large tap targets; hotel linen + fresh mint world */
:root{
  --bg:#E6F4EF; --panel:#FFFFFF; --ink:#1E3A45; --soft:#58747D; --line:#CBE2DA;
  --accent:#FF8A3D; --accent-deep:#D96A22; --blue:#2E9BD6; --good:#2FB36A; --bad:#E25B4F; --gold:#FFC531;
  --display:'Comfortaa', 'Trebuchet MS', system-ui, sans-serif;
  --body:'Rubik', 'Segoe UI', system-ui, sans-serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:18px;-webkit-tap-highlight-color:transparent}
#app{max-width:1120px;margin:0 auto;padding-inline:16px;padding-block:12px 28px;display:flex;flex-direction:column;gap:14px}
button{font-family:inherit;color:inherit}
:focus-visible{outline:4px solid var(--blue);outline-offset:3px}

/* top bar */
.bar{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.brand{display:flex;align-items:center;gap:10px;font:700 22px var(--display)}
.brand svg{width:30px;height:auto}
.lvname{font:700 18px var(--display);color:var(--soft);margin-right:auto}
.btn{font:600 20px var(--body);border:0;border-radius:18px;padding:14px 24px;background:var(--accent);color:#fff;cursor:pointer;box-shadow:0 5px 0 var(--accent-deep);transition:transform .1s, box-shadow .1s}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--accent-deep)}
.btn.ghost{background:var(--panel);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sm{font-size:17px;padding:10px 16px;border-radius:14px}
.btn.blue{background:var(--blue);box-shadow:0 5px 0 #1F78A8}

/* menu */
.hero{display:flex;align-items:center;justify-content:space-between;gap:20px;background:var(--panel);border-radius:28px;padding:22px 26px;box-shadow:0 6px 0 var(--line);flex-wrap:wrap}
.hero h1{font:700 clamp(30px,5vw,48px)/1.1 var(--display);margin:0 0 8px;text-wrap:balance}
.hero p{margin:0;font-size:20px;line-height:1.45;max-width:30ch;color:var(--soft)}
.hero-side{display:flex;align-items:center;gap:22px}
.hanger{width:96px;transform-origin:50% 10%;animation:swing 3.5s ease-in-out infinite}
@keyframes swing{0%,100%{transform:rotate(-5deg)}50%{transform:rotate(5deg)}}
.total{font:700 26px var(--display);background:#FFF6DA;border-radius:20px;padding:14px 18px;white-space:nowrap}
.total .s{color:var(--gold)}
.levels{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:16px}
.lv{position:relative;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;background:var(--panel);border:0;border-radius:26px;padding:20px 14px 18px;cursor:pointer;box-shadow:0 6px 0 var(--line);transition:transform .15s}
.lv:hover{transform:translateY(-4px)}
.lv .door{position:absolute;top:12px;left:14px;font:700 14px var(--body);letter-spacing:.06em;color:var(--soft);background:var(--bg);border-radius:10px;padding:4px 8px}
.lv .ico{font-size:64px;line-height:1.1;margin-top:10px}
.lv .nm{font:700 20px/1.2 var(--display)}
.lv .sb{font-size:16px;color:var(--soft);line-height:1.3}
.stars{display:flex;gap:2px;font-size:28px;line-height:1}
.st{color:#D6E3DF}.st.on{color:var(--gold)}
.foot{color:var(--soft);font-size:15px;text-align:center;margin:4px 0 0}
.link{background:none;border:0;color:var(--blue);text-decoration:underline;cursor:pointer;font-size:15px;padding:4px}

/* level common */
.level{display:flex;flex-direction:column;gap:14px;align-items:stretch}
.prompt{display:flex;align-items:center;gap:14px;background:var(--panel);border-radius:22px;padding:12px 16px;box-shadow:0 4px 0 var(--line)}
.ptext{font:700 clamp(18px,2.3vw,25px)/1.35 var(--display);flex:1;min-width:0;text-wrap:balance}
.speak{flex:none;width:58px;height:58px;border-radius:50%;border:0;background:var(--blue);color:#fff;font-size:26px;cursor:pointer;box-shadow:0 4px 0 #1F78A8}
.pill{flex:none;font:700 20px var(--display);background:var(--bg);border-radius:16px;padding:10px 14px;white-space:nowrap;font-variant-numeric:tabular-nums}
.scene{position:relative;width:min(100%, calc((100dvh - var(--reserve,250px)) * 1.6));min-width:min(100%,520px);margin-inline:auto;aspect-ratio:16/10;border-radius:26px;overflow:hidden;container-type:inline-size;background:var(--panel);box-shadow:0 6px 0 var(--line);touch-action:none;user-select:none;-webkit-user-select:none}
.scene>svg.bg{position:absolute;inset:0;width:100%;height:100%;display:block}
.it{position:absolute;transform:translate(-50%,-50%);font-size:7cqw;line-height:1;background:none;border:0;padding:0;cursor:pointer;touch-action:none}
.it .in{display:inline-block;transition:transform .15s;filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.25))}
.it:hover .in{transform:scale(1.12)}
.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px)}40%{transform:translateX(9px)}60%{transform:translateX(-6px)}80%{transform:translateX(5px)}}
.hint .in,.hint.card,.hint.tile{animation:pulse .9s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.18)}}
.card.hint{box-shadow:0 0 0 5px var(--gold),0 6px 0 var(--line)}
@keyframes popin{0%{transform:scale(.2)}70%{transform:scale(1.25)}100%{transform:scale(1)}}
.flyer{position:fixed;z-index:60;pointer-events:none;line-height:1}

/* toast */
#toast{position:fixed;left:50%;top:84px;transform:translate(-50%,-20px);z-index:70;font:700 clamp(20px,3vw,30px) var(--display);color:#fff;padding:14px 26px;border-radius:22px;opacity:0;pointer-events:none;transition:opacity .25s, transform .25s;text-align:center;max-width:calc(100% - 32px)}
#toast.show{opacity:1;transform:translate(-50%,0)}
#toast.good{background:var(--good)} #toast.bad{background:var(--bad)}

/* cart */
.cart-wrap{display:grid;grid-template-columns:minmax(0,1fr) 270px;gap:18px;align-items:start}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:14px}
.tile{background:var(--panel);border:0;border-radius:22px;padding:14px 8px 12px;cursor:pointer;box-shadow:0 5px 0 var(--line);transition:transform .15s, opacity .3s}
.tile:hover{transform:translateY(-4px)}
.tile .in{display:flex;flex-direction:column;align-items:center;gap:6px}
.tile .emo{font-size:58px;line-height:1.1}
.tile .nm{font:500 17px/1.2 var(--body)}
.tile.done{opacity:.35;pointer-events:none;background:#E3F6EA}
.cart-box{background:var(--panel);border-radius:26px;padding:16px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:10px}
.cart-box h3{margin:0;font:700 20px var(--display)}
.cart-load{display:flex;flex-wrap:wrap;justify-content:center;gap:4px;min-height:52px;font-size:40px;line-height:1}
.cart-load span{animation:popin .4s}
.cart-box svg{width:100%;max-width:220px}

/* bed */
.bed-wrap{display:grid;grid-template-columns:minmax(0,1.45fr) minmax(0,1fr);gap:18px;align-items:start}
.bed-scene{aspect-ratio:3/2;width:100%;min-width:0}
.layer{opacity:0;transform:translateY(-40px);transition:opacity .7s, transform .7s}
.layer.on{opacity:1;transform:none}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--panel);border:0;border-radius:22px;padding:12px 8px;cursor:pointer;box-shadow:0 5px 0 var(--line);position:relative;transition:transform .15s}
.card:hover{transform:translateY(-3px)}
.card .in{display:flex;flex-direction:column;align-items:center;gap:6px}
.card .ic{height:58px;display:flex;align-items:center;font-size:50px}
.card .ic svg{height:52px;width:auto}
.card .nm{font:600 17px/1.2 var(--body)}
.card .badge{position:absolute;top:8px;right:8px;width:32px;height:32px;border-radius:50%;background:var(--good);color:#fff;font:700 18px/32px var(--display);display:none}
.card.done{background:#E3F6EA;pointer-events:none}
.card.done .badge{display:block}

/* bath */
.spot .in{width:9cqw;display:block}
.spot svg{width:100%;height:auto;display:block}
.bub{position:absolute;width:2cqw;height:2cqw;border-radius:50%;border:.3cqw solid #8FD3F0;background:rgba(255,255,255,.7);pointer-events:none;transform:translate(-50%,-50%)}
.slot::after{content:"";position:absolute;inset:-22%;border:.4cqw dashed rgba(30,58,69,.35);border-radius:50%}
.slot .in{filter:grayscale(1) brightness(0) opacity(.22)}
.slot.glow::after{border-color:var(--accent);animation:pulse 1s ease-in-out infinite}
.slot.placed{pointer-events:none}
.slot.placed::after{display:none}
.slot.placed .in{filter:drop-shadow(0 .3cqw .2cqw rgba(0,0,0,.25));animation:popin .5s}
.tray{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.tray button{background:var(--panel);border:0;border-radius:20px;padding:10px 14px;min-width:120px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:4px;transition:transform .15s}
.tray .emo{font-size:48px;line-height:1.1;height:56px;display:flex;align-items:center}
.tray .emo svg{height:52px;width:auto}
.tray .nm{font:500 16px var(--body)}
.tray button.sel{transform:translateY(-8px);box-shadow:0 0 0 5px var(--accent),0 8px 0 var(--line)}

/* room */
.dust{position:absolute;left:0;top:62%;width:100%;height:38%;pointer-events:none;transition:opacity .8s}
.bin .in{font-size:9cqw}
.bin{cursor:default}
.bin.bump .in{animation:popin .45s}
.trash.drag .in{transform:scale(1.25)}
.vac{position:absolute;width:9cqw;transform:translate(-50%,-92%);pointer-events:none;z-index:5}
.meter{position:relative;height:42px;border-radius:21px;background:var(--panel);box-shadow:0 4px 0 var(--line);overflow:hidden;width:min(100%,560px);margin-inline:auto}
.meter-fill{position:absolute;inset:0 auto 0 0;width:0;background:linear-gradient(90deg,#9BE3B8,var(--good));transition:width .3s}
.meter span{position:relative;display:block;text-align:center;font:700 20px/42px var(--display);font-variant-numeric:tabular-nums}

/* check */
.prob .ok{position:absolute;right:-1.5cqw;top:-1.5cqw;width:4cqw;height:4cqw;border-radius:50%;background:var(--good);color:#fff;font:700 2.6cqw/4cqw var(--body);text-align:center;animation:popin .4s}
.prob{transition:left .8s, top .8s, opacity .6s}
.prob .in{transition:transform .8s}
.under{display:flex;justify-content:center;gap:14px;flex-wrap:wrap}

/* win */
[hidden]{display:none!important}
#win:not([hidden]){position:fixed;inset:0;z-index:80;background:rgba(30,58,69,.55);display:flex;align-items:center;justify-content:center;padding:16px}
.wincard{background:var(--panel);border-radius:32px;padding:30px 28px;text-align:center;max-width:460px;width:100%;animation:popin .45s}
.wincard h2{font:700 40px var(--display);margin:0 0 6px}
.wincard p{font-size:20px;color:var(--soft);margin:10px 0 22px}
.wincard .stars{justify-content:center;font-size:64px;gap:8px}
.wincard .st.on{animation:popin .5s backwards}
.wincard .st.on:nth-child(2){animation-delay:.2s}.wincard .st.on:nth-child(3){animation-delay:.4s}
.winbtns{display:flex;gap:12px;justify-content:center;flex-wrap:wrap}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:90}


/* sorting */
.sort-stage{display:flex;justify-content:center}
.sort-item{min-height:230px;min-width:260px;background:var(--panel);border-radius:30px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px 28px}
.sort-item.pop{animation:popin .45s}
.sort-item .emo{font-size:110px;line-height:1;height:140px;display:flex;align-items:center}
.sort-item .emo svg{height:140px;width:auto}
.sort-item .nm{font:700 clamp(22px,3vw,30px)/1.2 var(--display);text-align:center;max-width:22ch;text-wrap:balance}
.bins{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px}
.bin-btn{background:var(--panel);border:0;border-top:12px solid var(--c);border-radius:22px;padding:14px 10px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:8px;transition:transform .15s}
.bin-btn:hover{transform:translateY(-4px)}
.bin-btn .bi{font-size:52px;height:60px;display:flex;align-items:center}
.bin-btn .bi svg{height:54px;width:auto}
.bin-btn .bl{font:700 18px/1.25 var(--display);text-align:center}
.bin-btn.bump,.basket.bump{animation:popin .4s}
.bin-btn.hint{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 5px var(--gold),0 5px 0 var(--line)}
/* order ladder */
.ladder{list-style:none;margin:0;padding:14px;background:var(--panel);border-radius:24px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:8px}
.ladder li{display:flex;align-items:center;gap:12px;min-height:38px;border-radius:14px;background:var(--bg);padding:4px 12px 4px 4px;font:600 17px var(--body);color:var(--soft)}
.ladder li::before{content:attr(data-n);flex:none;width:38px;height:38px;border-radius:50%;background:#fff;display:grid;place-items:center;font:700 18px var(--display);color:var(--ink)}
.ladder li.done{background:#E3F6EA;color:var(--ink);animation:popin .4s}
.ladder li.done::before{background:var(--good);color:#fff}
.lic{font-size:26px;display:flex;align-items:center}.lic svg{height:30px;width:auto}
/* memory */
.mem-grid{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;width:min(100%,calc((100dvh - 220px)*1.05));margin-inline:auto}
.mcard{aspect-ratio:1.15;border:0;background:none;padding:0;cursor:pointer;perspective:800px}
.mi{position:relative;display:block;width:100%;height:100%;transition:transform .45s;transform-style:preserve-3d}
.mcard.open .mi{transform:rotateY(180deg)}
.mf{position:absolute;inset:0;border-radius:20px;backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;box-shadow:0 5px 0 var(--line)}
.mf.back{background:var(--blue)}
.mf.front{background:var(--panel);transform:rotateY(180deg)}
.mf .emo{font-size:clamp(34px,6vw,58px);line-height:1}
.mf .nm{font:600 clamp(13px,1.6vw,17px) var(--body)}
.mcard.ok .mf.front{background:#E3F6EA;box-shadow:0 0 0 4px var(--good)}
/* catch */
.catch{cursor:none}
.basket{position:absolute;bottom:3%;width:15cqw;transform:translateX(-50%);pointer-events:none}
.fall{position:absolute;transform:translate(-50%,-50%);font-size:6.5cqw;line-height:1;pointer-events:none}
.fall svg{height:1em;width:auto}
.start-ov{position:absolute;inset:0;background:rgba(30,58,69,.35);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;cursor:default}
.start-ov p{background:var(--panel);border-radius:16px;padding:10px 16px;font:600 18px var(--body);margin:0;text-align:center;max-width:90%}
.start-ov .btn{font-size:26px;padding:18px 36px}

/* part 2 */
.part{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;font:700 24px var(--display);margin:10px 0 -2px}
.part span{font:600 18px var(--body);color:var(--soft)}
.lv.p2 .door{background:#FFF0E3;color:var(--accent-deep)}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px}
.rcard{position:relative;background:var(--panel);border:0;border-radius:18px;padding:8px 8px 10px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.rcard:hover{transform:translateY(-3px)}
.rn{font:700 18px var(--display)}
.mroom{width:100%;height:auto;border-radius:10px;display:block}
.stamp{position:absolute;left:50%;top:58%;transform:translate(-50%,-50%) rotate(-10deg);font:700 19px var(--display);color:#fff;padding:6px 12px;border-radius:12px;opacity:0;pointer-events:none;white-space:nowrap}
.rcard.marked .stamp{opacity:1;animation:popin .4s}
.m-dirty .stamp{background:var(--bad)} .m-dnd .stamp{background:#7A5BC7;font-size:15px} .m-clean .stamp{background:var(--good)}
.rcard.marked{pointer-events:none}
.rcard.hint{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 5px var(--gold),0 5px 0 var(--line)}
.pool{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;background:var(--panel);border-radius:22px;padding:14px;box-shadow:0 5px 0 var(--line);min-height:96px}
.chip{display:flex;align-items:center;gap:8px;border:0;background:var(--bg);border-radius:16px;padding:8px 14px;cursor:pointer;font:700 24px var(--display);transition:transform .15s}
.chip .dm{height:44px;width:auto}
.chip.sel{transform:translateY(-6px);box-shadow:0 0 0 5px var(--accent)}
.flynum{font:700 26px var(--display);background:var(--gold);border-radius:10px;padding:4px 8px}
.maids{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.maid{background:var(--panel);border:0;border-radius:24px;padding:14px;cursor:pointer;box-shadow:0 5px 0 var(--line);display:flex;flex-direction:column;align-items:center;gap:6px;transition:transform .15s}
.maid:hover{transform:translateY(-3px)}
.maid.full{background:#E3F6EA}
.mav{font-size:64px;line-height:1}
.mnm{font:700 22px var(--display)}
.mslots{display:flex;gap:6px;flex-wrap:wrap;justify-content:center}
.ms{width:58px;height:40px;border-radius:10px;border:3px dashed var(--line);display:grid;place-items:center;font:700 18px var(--display)}
.ms.on{border:3px solid var(--good);background:#fff;animation:popin .4s}
.call{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.3fr);gap:18px;align-items:center}
.phone{background:var(--panel);border-radius:28px;padding:20px;box-shadow:0 6px 0 var(--line);display:grid;grid-template-columns:auto 1fr;grid-template-rows:auto auto;gap:10px 14px;align-items:center}
.ring{font-size:54px;grid-row:1}
.ringing{animation:ring .5s 3}
@keyframes ring{25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
.gav{font-size:76px;line-height:1;grid-row:1;justify-self:start}
.bubble{grid-column:1/-1;position:relative;background:#FFF6DA;border-radius:22px;padding:16px 18px;font:700 clamp(19px,2.2vw,24px)/1.4 var(--display)}
.bubble.pop{animation:popin .45s}
.choices{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.choices .card .ic{height:70px;font-size:60px}.choices .card .ic svg{height:60px}
.choices .card.done{background:#E3F6EA}
.count{display:flex;flex-direction:column;gap:18px;align-items:center}
.guests{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;background:var(--panel);border-radius:26px;padding:18px;box-shadow:0 6px 0 var(--line);width:100%}
.guest{display:flex;flex-direction:column;align-items:center;gap:8px;min-width:120px}
.gp{font-size:80px;line-height:1}
.gis{display:flex;gap:6px}
.gi{position:relative;font-size:46px;line-height:1;opacity:.85}
.gi svg{height:50px;width:auto}
.gi.on,.gi.peek{opacity:1}
.gi.on::after,.gi.peek::after{content:attr(data-c);position:absolute;right:-8px;top:-10px;width:28px;height:28px;border-radius:50%;background:var(--blue);color:#fff;font:700 16px/28px var(--display);text-align:center;animation:popin .3s}
.gi.on::after{background:var(--good)}
.nums{display:flex;gap:18px;justify-content:center}
.num{width:110px;height:110px;border:0;border-radius:26px;background:var(--panel);box-shadow:0 6px 0 var(--line);font:700 54px var(--display);cursor:pointer;transition:transform .15s}
.num:hover{transform:translateY(-4px)}
.num.right{background:var(--good);color:#fff}
.kp-wrap{display:grid;grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr);gap:18px;align-items:start}
.kp-door{background:var(--panel);border-radius:24px;box-shadow:0 6px 0 var(--line);overflow:hidden}
.kp-door svg{display:block;width:100%;height:auto;max-height:52dvh}
.kp-door.pop{animation:popin .45s}
.kp{background:var(--panel);border-radius:24px;padding:14px;box-shadow:0 6px 0 var(--line);display:flex;flex-direction:column;gap:12px}
.kp-disp{display:flex;gap:10px;justify-content:center}
.kp-disp span{width:64px;height:76px;border-radius:14px;border:3px solid var(--line);display:grid;place-items:center;font:700 44px var(--display)}
.kp-disp span.f{border-color:var(--blue);background:#EAF6FC}
.kp-keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{height:62px;border:0;border-radius:16px;background:var(--bg);font:700 30px var(--display);cursor:pointer;box-shadow:0 4px 0 var(--line)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--line)}
.key.kok{background:var(--good);color:#fff;box-shadow:0 4px 0 #23864F}
.key.kdel{background:#FDE3E0}
.key.hint{animation:pulse .9s ease-in-out infinite;box-shadow:0 0 0 5px var(--gold)}
.sheet{background:#FFFDF6;border-radius:18px;padding:14px 16px;box-shadow:0 6px 0 var(--line);background-image:repeating-linear-gradient(transparent 0 37px,#E6EEF2 37px 39px)}
.sheet h3{margin:0 0 8px;font:700 19px var(--display)}
.rep{margin:0;padding-left:24px;display:flex;flex-direction:column;gap:6px;font:600 19px var(--body);font-variant-numeric:tabular-nums}
.rep li{animation:popin .4s}
.rep li span{display:inline-block;min-width:80px}
.rep .ok{color:var(--good)}
.diff-wrap{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.dcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.diff-wrap .scene{width:100%;min-width:0}
.dl{align-self:flex-start;font:700 17px var(--display);color:#fff;border-radius:12px;padding:5px 12px}
.dl.good{background:var(--good)}.dl.bad{background:var(--accent)}
.dright .prob .in{transition:none}
.scene .dring{width:9cqw;height:9cqw;border:.6cqw solid var(--bad);border-radius:50%;transform:translate(-50%,-50%);pointer-events:none;animation:popin .4s;z-index:3}
.pz-wrap{display:grid;grid-template-columns:minmax(0,1fr) 240px;gap:18px;align-items:start}
.pz-grid{display:grid;gap:4px;aspect-ratio:16/10;width:min(100%,calc((100dvh - 250px)*1.6));background:var(--line);padding:4px;border-radius:20px;box-shadow:0 6px 0 var(--line)}
.pz-grid.solved{gap:0;transition:gap .5s}
.pz-tile{border:0;padding:0;cursor:pointer;overflow:hidden;border-radius:10px;background:var(--panel);position:relative}
.pz-tile svg{display:block;width:100%;height:100%}
.pz-tile.sel{outline:6px solid var(--accent);outline-offset:-6px;z-index:2}
.pz-tile.right::after{content:"✓";position:absolute;right:6px;top:6px;width:26px;height:26px;border-radius:50%;background:var(--good);color:#fff;font:700 16px/26px var(--display);text-align:center}
.pz-grid.solved .pz-tile{border-radius:0}.pz-grid.solved .pz-tile::after{display:none}
.pz-tile.swap{animation:popin .35s}
.pz-ref{display:flex;flex-direction:column;gap:6px;background:var(--panel);border-radius:20px;padding:12px;box-shadow:0 6px 0 var(--line)}
.pz-refimg{aspect-ratio:16/10;border-radius:10px;overflow:hidden}
.pz-refimg svg{display:block;width:100%;height:100%}
@media (max-width:760px){.call,.kp-wrap,.diff-wrap,.pz-wrap{grid-template-columns:1fr}.num{width:88px;height:88px}}

@media (max-width:760px){
  .cart-wrap,.bed-wrap{grid-template-columns:1fr}
  .scene{min-width:0;width:100%}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}

.lv3 small{font:500 14px/1.35 var(--body);color:var(--soft)}
.recs{display:flex;gap:10px;flex-wrap:wrap;align-items:center;background:#FFF6DA;border-radius:16px;padding:10px 14px;margin-top:10px;font-size:16px}
.recs small{color:var(--soft)}
.prepfig{position:relative;display:flex;justify-content:center;margin-bottom:8px}
.prepfig>svg{height:200px;width:auto}
.pf-badges{position:absolute;left:50%;bottom:6px;transform:translateX(30px);display:flex;gap:4px;font-size:34px}
.pf-badges span{animation:popin .4s}
.dirtyg{filter:sepia(1) saturate(3) hue-rotate(-20deg) brightness(.7)}
.gchange{display:flex;flex-direction:column;align-items:center;gap:12px}
.gchange .tiles{grid-template-columns:repeat(2,minmax(160px,220px));justify-content:center;width:100%}
.ptiles{max-width:900px;margin-inline:auto;width:100%}
.cartspot .in{opacity:.45;filter:grayscale(.6)}
.cartspot:hover .in{opacity:.8}
.cartspot.placed .in{opacity:1;filter:none}
.switch .in{font-size:3.2cqw}
.scene.dark::after{content:"";position:absolute;inset:0;background:rgba(20,30,40,.35);pointer-events:none;z-index:4;transition:opacity .4s}
.glowlamp{display:block;width:100%;height:100%;border-radius:50%;background:radial-gradient(circle,rgba(255,230,120,.9),rgba(255,230,120,0) 70%)}
.mopz .mop{display:grid;place-items:center;width:6cqw;height:6cqw;border-radius:50%;background:rgba(46,155,214,.25);border:.4cqw dashed var(--blue);font:700 2.6cqw var(--display);color:var(--ink)}
.mopz.ok .mop{background:var(--good);color:#fff;border-style:solid}
.handover{display:flex;flex-direction:column;align-items:center;gap:16px;padding:40px 16px;background:var(--panel);border-radius:26px;box-shadow:0 6px 0 var(--line)}
.hfig{font-size:110px;line-height:1;animation:swing 2s ease-in-out infinite}
.hb{font:700 24px var(--display);text-align:center}
.hbar{width:min(100%,360px);height:16px;border-radius:8px;background:var(--bg);overflow:hidden}
.hbar span{display:block;height:100%;width:100%;background:var(--good);transform-origin:left;animation:grow 2.4s linear}
@keyframes grow{from{transform:scaleX(0)}}
.report{background:#FFFDF6;border-radius:18px;padding:14px 16px;box-shadow:0 5px 0 var(--line);overflow-x:auto;max-width:100%}
.report h3{margin:0 0 8px;font:700 20px var(--display)}
.report table{border-collapse:collapse;font:500 16px var(--body);min-width:420px}
.report th,.report td{text-align:left;padding:6px 10px;border-bottom:1px solid var(--line)}
.multi{display:flex;flex-direction:column;gap:8px;margin:8px 0 12px}
.mo{border:3px solid var(--line);border-radius:14px;background:var(--panel);padding:10px 14px;font:600 17px var(--body);cursor:pointer;text-align:left}
.mo.sel{border-color:var(--accent);background:#FFF0E3}
.mo.sel::before{content:"✓ ";color:var(--accent-deep)}
.memo{font:700 24px var(--display);background:#FFF6DA;border-radius:16px;padding:12px 18px}
.memo .cd{display:inline-block;min-width:1.2em;color:var(--accent-deep)}
.num.wide2{width:auto;height:auto;padding:16px 22px;font-size:20px}
.ticket b{display:flex;align-items:center;gap:6px}.ticket em{font-style:normal;font-size:28px}
.rep{text-align:left;align-items:flex-start}
.rep span{display:block;font-size:20px}
.rep small{display:block;font-size:15px}
.cl4{display:flex;gap:2px}.cl4 svg{height:22px!important;width:auto}
.sortrow{display:flex;gap:16px;align-items:center;justify-content:center;flex-wrap:wrap}
.sortrow .sort-item{min-height:150px;min-width:180px}
.sortrow .sort-item .emo{font-size:70px;height:90px}.sortrow .sort-item .emo svg{height:84px}
.sortbins{display:flex;gap:12px;flex-wrap:wrap}
.sortbins .bin-btn{min-width:180px}
.takec{text-align:center;font:700 34px var(--display)}
.side .sm{margin:0;font:500 15px/1.4 var(--body);color:var(--soft)}
.flist{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;min-height:20px}
.flist li{background:#FDE3E0;border-radius:10px;padding:6px 10px;font:600 15px var(--body);animation:popin .3s}
.choices4{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
.choices4 .card .ic svg{height:56px}
.csteps .timer{margin-left:8px;align-self:center}
.two.wide{grid-template-columns:minmax(0,1fr) 400px}

.cs i{font-size:19px;height:21px}.cs i svg{height:21px}

/* voice */
let kkVoice=null;
function findKk(){try{kkVoice=speechSynthesis.getVoices().find(v=>v.lang&&v.lang.toLowerCase().startsWith('kk'))||null}catch(e){}}
try{speechSynthesis.addEventListener('voiceschanged',findKk);findKk()}catch(e){}
function say(t){try{
  if(!('speechSynthesis' in window))return;speechSynthesis.cancel();
  if(LANG==='kk'){if(!kkVoice)findKk();if(!kkVoice){toast('Бұл компьютерде қазақ дауысы жоқ','bad');return}
    const u=new SpeechSynthesisUtterance(t);u.lang='kk-KZ';u.voice=kkVoice;u.rate=.75;speechSynthesis.speak(u);return}
  if(!voiceObj)pickVoice();const u=new SpeechSynthesisUtterance(t);u.lang='ru-RU';u.rate=.72;u.pitch=1.15;u.volume=.9;if(voiceObj)u.voice=voiceObj;speechSynthesis.speak(u)}catch(e){}}

$('#sound').onclick=()=>{voiceOn=!voiceOn;soundLabel();$('#sound').setAttribute('aria-pressed',voiceOn);if(voiceOn){const p=document.querySelector('.ptext');say(p&&p.textContent||L('Голос включён','Дауыс қосулы'))}else try{speechSynthesis.cancel()}catch(e){}};

function bubbles(sc,x,y){for(let i=0;i<6;i++){const b=document.createElement('span');b.className='bub';placeIt(b,x+(Math.random()-.5)*6,y+(Math.random()-.5)*6);sc.append(b);b.animate([{transform:'translate(-50%,-50%) scale(.4)',opacity:1},{transform:`translate(-50%,calc(-50% - ${30+Math.random()*40}px)) scale(1.2)`,opacity:0}],{duration:RM?10:900}).onfinish=()=>b.remove()}}

function confetti(){if(RM)return;const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#FF8A3D','#2E9BD6','#2FB36A','#FFC531','#E25B4F'];const P=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.6,vx:(Math.random()-.5)*3,vy:2.5+Math.random()*3,r:Math.random()*6,vr:(Math.random()-.5)*.3,w:8+Math.random()*9,c:cols[Math.random()*5|0]}));let t=0;(function f(){x.clearRect(0,0,c.width,c.height);P.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.r+=p.vr;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.w/2,-p.w/4,p.w,p.w/2);x.restore()});if(++t<220)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})()}

/* generic: question card */
function ask(o,cb){
  const opts=o.keep?o.opts:shuffle(o.opts);
  const m=document.createElement('div');m.className='cm';
  m.innerHTML=`<div class="cm-card" role="dialog">${o.icon?`<div class="cm-ic">${o.icon}</div>`:''}${o.who?`<div class="cm-who">${o.who}</div>`:''}<p class="cm-q">${o.q}</p><div class="cm-opts ${o.row?'row':''}">${opts.map((x,i)=>`<button class="cm-o" data-i="${i}">${x.t}</button>`).join('')}</div><p class="cm-why" hidden></p></div>`;
  document.body.append(m);speak(o.q);
  m.querySelectorAll('.cm-o').forEach(b=>b.onclick=()=>{
    const x=opts[b.dataset.i],w=m.querySelector('.cm-why');
    if(x.ok){sGood();addPts(5);b.classList.add('ok');m.querySelectorAll('.cm-o').forEach(y=>y.disabled=true);if(x.why){w.hidden=false;w.className='cm-why good';w.textContent=x.why;speak(x.why)}later(()=>{m.remove();cb&&cb()},x.why?2300:900)}
    else{mistake();sBad();shake(b);b.classList.add('no');w.hidden=false;w.className='cm-why';w.textContent=x.why||L('Подумай ещё раз','Тағы ойлан');speak(w.textContent)}
  });
}
/* generic: pick tiles */
function pickStep(stage,o,done){
  setPrompt(o.prompt);let got=0;const items=shuffle(o.items),need=items.filter(i=>i.ok).length;
  stage.innerHTML=`${o.top||''}<div class="tiles ptiles">${items.map((it,i)=>`<button class="tile" data-i="${i}" aria-label="${it.n}"><span class="in"><span class="emo">${it.e}</span><span class="nm">${it.n}</span></span></button>`).join('')}</div>`;
  stage.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{const it=items[t.dataset.i];
    if(it.ok){t.classList.add('done');sGood();speak(it.n);got++;o.onOk&&o.onOk(it,t);if(got===need){addPts(10);if(o.doneMsg)setPrompt(o.doneMsg);later(done,1100)}}
    else{mistake();sBad();shake(t);const m=it.why||L('Это не подходит','Бұл келмейді');toast(m,'bad');speak(m)}});
}
/* generic: place items into scene from tray */
function placeItems(stage,sc,items,o,done){
  let sel=null,placed=0;const tray=document.createElement('div');tray.className='tray';stage.append(tray);
  const extras=(o.extras||[]).map(e=>({h:e[0],n:e[1],k:'x'}));
  tray.innerHTML=shuffle([...items,...extras]).map(it=>`<button data-k="${it.k}" data-n="${it.n}"><span class="emo">${it.h}</span><span class="nm">${it.n}</span></button>`).join('');
  const slots=items.map(it=>{const g=document.createElement('button');g.className='it slot';g.dataset.k=it.k;g.setAttribute('aria-label',it.n);g.innerHTML=`<span class="in" style="${it.st||''}">${it.h}</span>`;placeIt(g,...it.at);sc.append(g);return g});
  tray.querySelectorAll('button').forEach(b=>b.onclick=()=>{tray.querySelectorAll('button').forEach(x=>x.classList.remove('sel'));sel=b;b.classList.add('sel');sPop();speak(b.dataset.n);slots.forEach(g=>g.classList.toggle('glow',!g.classList.contains('placed')))});
  slots.forEach(g=>g.onclick=()=>{
    if(!sel){toast(L('Сначала выбери вещь внизу','Алдымен төменнен затты таңда'),'bad');return}
    if(sel.dataset.k==='x'){mistake();sBad();shake(sel);const m=o.extraMsg||L('Это здесь не нужно','Бұл мұнда керек емес');toast(m,'bad');speak(m);return}
    if(g.dataset.k===sel.dataset.k){g.classList.add('placed');g.classList.remove('glow');sel.remove();sel=null;placed++;sGood();slots.forEach(x=>x.classList.remove('glow'));
      if(placed===items.length){addPts(10);tray.remove();if(o.doneMsg)setPrompt(o.doneMsg);later(done,1100)}}
    else{mistake();sBad();shake(g.querySelector('.in'));toast(L('Здесь место для другой вещи','Мұнда басқа заттың орны'),'bad')}
  });
}

function placeWalker(){W.walker.style.transition='none';W.walker.style.left=G.x+'%';W.walker.style.top=(floorTop(G.floor)+18)+'%'}
function goFloorText(g){return L(` Ты на ${G.floor} этаже, нужно на ${g.f}.`,` Сен ${G.floor}-қабаттасың, ${g.f}-қабатқа бару керек.`)}
function navText(){const g=goal();if(!g)return '';if(g.f!==G.floor)return G.liftBroken?L(`Лифт не работает. Иди по лестнице на ${g.f} этаж.`,`Лифт істемейді. Баспалдақпен ${g.f}-қабатқа бар.`):L(`Ты на ${G.floor} этаже. Нужно на ${g.f} этаж. Иди к лифту.`,`Сен ${G.floor}-қабаттасың. ${g.f}-қабатқа бару керек. Лифтке бар.`);return phaseText()}

function wrongFloor(){const m=L(`Ты на ${G.floor} этаже. Сначала дойди до ${G.liftBroken?'лестницы':'лифта'}.`,`Сен ${G.floor}-қабаттасың. Алдымен ${G.liftBroken?'баспалдаққа':'лифтке'} бар.`);toast(m,'bad');speak(m);G.hintOn=true;showArrow(true)}
function walkTo(x,cb){

function onSpot(s){

    else if(G.phase==='prep')m=phaseText();

/* ---------- lift & stairs ---------- */
function setInd(f){W.hotel.querySelectorAll('.lind').forEach(e=>e.textContent=f)}
function moveCabin(f,cb){
  const d=Math.abs(f-G.cabin);if(!d){cb();return}
  const t=RM?50:d*850;W.cabin.style.transition=`top ${t}ms ease-in-out`;W.cabin.style.top=(floorTop(f)+2.4)+'%';
  const from=G.cabin;for(let k=1;k<=d;k++)later(()=>setInd(from+(f>from?k:-k)),k*(t/d)-100);
  const hum=setInterval(()=>tone(90,.12,'sine',.03),220);
  later(()=>{clearInterval(hum);G.cabin=f;tone(1046,.25,'sine',.15);tone(784,.35,'sine',.12,.18);cb()},t+40);
}
const doors=(open,cb)=>{W.cabin.classList.toggle('open',open);later(cb,RM?0:650)};
function onLift(f){
  if(G.busy||G.inside)return;
  if(f!==G.floor){wrongFloor();return}
  if(G.liftBroken){const m=L('Лифт не работает. Иди по лестнице 🪜 — она справа.','Лифт істемейді. Оң жақтағы баспалдақпен бар 🪜.');toast(m,'bad');speak(m);G.hintOn=true;showArrow(true);return}
  G.busy=true;
  walkTo(50,()=>{moveCabin(G.floor,()=>doors(true,()=>{W.walker.hidden=true;W.cabin.classList.add('riding');W.cabin.querySelector('.cin').innerHTML=W.walker.querySelector('.wflip').innerHTML;showPanel()}))});
}
function whyFloor(gf){
  const ts=String(G.phase==='urgent'?G.urgent.n:G.task);
  return (G.phase==='route'||G.phase==='urgent')?L(`Номер <b class="big">${ts[0]}</b>${ts.slice(1)} — значит <b>${gf}</b> этаж`,`<b class="big">${ts[0]}</b>${ts.slice(1)} нөмір — <b>${gf}</b>-қабат`)
    :(G.phase==='cart'||G.phase==='prep')?L('Комната горничных — <b>2</b> этаж','Күтушілер бөлмесі — <b>2</b>-қабат')
    :(G.phase==='admin'||G.phase==='endshift')?L('Ресепшн — <b>1</b> этаж','Ресепшн — <b>1</b>-қабат'):L('Прачечная — <b>1</b> этаж','Кір жуу бөлмесі — <b>1</b>-қабат');
}
function showPanel(){
  const g=goal(),gf=g?g.f:G.floor;
  W.panel.innerHTML=`<div class="lp-top">🛗 ${L('Лифт','Лифт')}</div><div class="lp-why">${whyFloor(gf)}</div><div class="lp-btns">${[5,4,3,2,1].map(n=>`<button class="lbtn" data-n="${n}">${n}</button>`).join('')}</div>`;
  W.panel.hidden=false;setPrompt(L(`Ты в лифте. Нажми кнопку ${gf}.`,`Сен лифттесің. ${gf} батырмасын бас.`));
  if(G.cycle===0||G.hintOn)W.panel.querySelector(`.lbtn[data-n="${gf}"]`).classList.add('hint');
  W.panel.querySelectorAll('.lbtn').forEach(b=>b.onclick=()=>{
    const n=+b.dataset.n;
    if(n!==gf){mistake();sBad();shake(b);const m=L(`Нам нужен ${gf} этаж. Нажми кнопку ${gf}.`,`Бізге ${gf}-қабат керек. ${gf} батырмасын бас.`);toast(m,'bad');speak(m);W.panel.querySelector(`.lbtn[data-n="${gf}"]`).classList.add('hint');return}
    b.classList.add('lit');tone(660,.1);W.panel.hidden=true;
    doors(false,()=>moveCabin(n,()=>doors(true,()=>{
      G.floor=n;G.x=50;placeWalker();W.walker.hidden=false;W.cabin.classList.remove('riding');G.busy=false;
      later(()=>doors(false,()=>{}),700);updateWorld();
    })));
  });
}
function showStairs(){
  const g=goal();
  if(!g||g.f===G.floor){G.busy=false;const m=L('Ты уже на нужном этаже.','Сен керекті қабаттасың.');toast(m,'good');speak(m);return}
  const draw=()=>{W.panel.innerHTML=`<div class="lp-top">🪜 ${L('Лестница','Баспалдақ')}</div><div class="lp-why">${L(`Ты на <b>${G.floor}</b> этаже`,`Сен <b>${G.floor}</b>-қабаттасың`)}<br>${whyFloor(g.f)}</div><div class="st-btns"><button class="sbtn" data-d="1">▲<small>${L('Вверх','Жоғары')}</small></button><button class="sbtn" data-d="-1">▼<small>${L('Вниз','Төмен')}</small></button></div>`;
    W.panel.querySelectorAll('.sbtn').forEach(b=>b.onclick=()=>{const d=+b.dataset.d,need=g.f>G.floor?1:-1;
      if(d!==need){mistake();sBad();shake(b);const m=need>0?L('Нам нужно наверх.','Бізге жоғары керек.'):L('Нам нужно вниз.','Бізге төмен керек.');toast(m,'bad');speak(m);return}
      W.panel.querySelectorAll('.sbtn').forEach(x=>x.disabled=true);
      for(let i=0;i<4;i++)tone(220+i*20*d,.05,'triangle',.05,i*.12);
      G.floor+=d;W.walker.style.transition='top .7s ease-in-out';W.walker.style.top=(floorTop(G.floor)+18)+'%';
      document.querySelectorAll('.fno').forEach(n=>n.classList.toggle('cur',+n.dataset.f===G.floor));
      later(()=>{if(G.floor===g.f){W.panel.hidden=true;G.busy=false;sGood();updateWorld()}else draw()},750)})};
  W.panel.hidden=false;draw();setPrompt(L(`Лестница. Нужно на ${g.f} этаж: вверх или вниз?`,`Баспалдақ. ${g.f}-қабатқа бару керек: жоғары ма, төмен бе?`));
}

/* ---------- inside ---------- */
function openInside(html){G.inside=true;W.world.hidden=true;W.inside.hidden=false;W.inside.innerHTML=html;W.arrow.hidden=true;window.scrollTo(0,0);return W.inside}
function exitInside(){G.inside=false;W.inside.hidden=true;W.inside.innerHTML='';W.world.hidden=false;placeWalker();updateWorld()}
function enter(s){
  if(s.kind==='staff')return G.phase==='prep'?prepScene():cartScene();
  if(s.kind==='admin')return adminScene();
  if(s.kind==='laundry')return laundryScene();
  if(s.kind==='room')return G.phase==='urgent'?urgentScene():G.mode==='inspect'?inspectScene():roomFlow();
}

let talk=()=>{};
function adminScene(){

  if(G.pending.length)return reportScene();

function reportScene(){
  const ui=$('#aui');
  talk(L('Здравствуйте! Как работа?','Сәлеметсіз бе! Жұмыс қалай?'));setPrompt(L('Расскажи администратору о своей работе.','Әкімшіге жұмысың туралы айт.'));
  const lines=G.pending.map(p=>p.inspect?L(`🔎 Номер ${p.n} ${gx('проверила','проверил')}: ${p.ret?`вернул${gx('а','')} на доработку (${p.flaws})`:'принят'}`,`🔎 ${p.n} нөмір тексерілді: ${p.ret?`қайта жасауға қайтарылды (${p.flaws})`:'қабылданды'}`)
    :`✓ ${L(`Номер ${p.n} убран`,`${p.n} нөмір тазаланды`)} (${typeName(p.type)})${p.issues&&p.issues.length?`<small>${L('Приёмка','Қабылдау')}: ${p.issues.map(i=>`${i.n} — ${stName(i.s).toLowerCase()}`).join(', ')}</small>`:''}`);
  ui.innerHTML=`<button class="btn big rep" id="rep">${lines.map(l=>`<span>${l}</span>`).join('')}</button>`;
  $('#rep').onclick=()=>{$('#rep').disabled=true;sGood();addPts(10);
    const iss=G.pending.some(p=>p.issues&&p.issues.length);
    talk(iss?L('Спасибо! Я позову мастера и принесу то, чего нет.','Рахмет! Шеберді шақырамын, жоқ заттарды әкелемін.'):L('Спасибо! Молодец!','Рахмет! Жарайсың!'));speak(ab().textContent);
    G.pending.forEach(p=>{if(!p.inspect){G.done++;G.total++}G.shiftLog.push(p)});try{localStorage.setItem('smena-total',G.total)}catch(e){}
    G.pending=[];G.cycle++;G.hintOn=false;G.shiftAssign++;G.liftBroken=false;ui.innerHTML='';

  function ab(){return $('#ab')}
}
function lostHandover(){
  const ui=$('#aui');talk(L('Ты '+gx('нашла','нашёл')+' забытые вещи гостя?','Қонақтың ұмытқан заттарын таптың ба?'));
  setPrompt(L('Отдай администратору забытые вещи гостя.','Қонақтың ұмытқан заттарын әкімшіге бер.'));
  ui.innerHTML=`<div class="tiles">${G.lost.map((x,i)=>`<button class="tile" data-i="${i}"><span class="in"><span class="emo">${x.e}</span><span class="nm">${x.n}</span></span></button>`).join('')}</div>`;
  let left=G.lost.length;
  ui.querySelectorAll('.tile').forEach(t=>t.onclick=()=>{t.classList.add('done');sGood();if(--left===0){addPts(10);talk(L('Спасибо! Я сохраню их и верну гостю.','Рахмет! Сақтап, қонаққа қайтарамын.'));G.lost=[];later(nextAfterReport,2000)}});
}
function nextAfterReport(){const per=3;if(G.shiftAssign>=per){G.phase='endshift';return endShiftScene()}assign()}
function newRoom(){let n;do{n=ROOMS[Math.random()*ROOMS.length|0]}while(n===G.last||G.queue.includes(n));return n}
function assign(){
  const ui=$('#aui');G.mode='clean';
  if(L3()&&G.shiftAssign%2===1){
    const n=newRoom(),maid=shuffle([L('Дана','Дана'),L('Айгуль','Айгүл'),L('Мадина','Мадина')])[0];G.inspectFor=maid;
    const req=L(`Горничная ${maid} убрала номер ${n}. Проверь его, пожалуйста.`,`${maid} ${n} нөмірді тазалады. Оны тексеріңізші.`);talk(req);speak(req);
    numQuestion([n],n,()=>{G.mode='inspect';G.task=n;G.last=n;G.queue=[];G.phase='route';exitInside()},'🔎 '+L('Проверка','Тексеру'));return;
  }
  const cnt=L3()?2:1,tasks=[];while(tasks.length<cnt){const n=newRoom();if(!tasks.some(t=>t.n===n))tasks.push({n,type:G.cycle===0&&tasks.length===0?'out':Math.random()<.5?'out':'stay'})}
  const req=tasks.length===1?L(`Уберите, пожалуйста, номер ${tasks[0].n}. Это ${typeName(tasks[0].type)}.`,`${tasks[0].n} нөмірді тазалаңызшы. Бұл — ${typeName(tasks[0].type)}.`)
    :L(`Уберите, пожалуйста, номера ${tasks[0].n} (${typeName(tasks[0].type)}) и ${tasks[1].n} (${typeName(tasks[1].type)}).`,`${tasks[0].n} (${typeName(tasks[0].type)}) және ${tasks[1].n} (${typeName(tasks[1].type)}) нөмірлерін тазалаңызшы.`);
  talk(req);speak(req);
  numQuestion(tasks.map(t=>t.n),null,()=>{
    const fin=()=>{G.types=Object.fromEntries(tasks.map(t=>[t.n,t.type]));G.task=tasks[0].n;G.type=tasks[0].type;G.queue=tasks.slice(1).map(t=>t.n);G.last=G.task;G.phase='cart';
      if(L2()&&G.cycle>0&&Math.random()<.35)G.liftBroken=true;
      talk(L('Спасибо! Удачной работы!','Рахмет! Жұмысың сәтті болсын!'));later(exitInside,1500)};
    if(tasks.length===1){
      const ui2=$('#aui');ui2.innerHTML=`<div class="aq"><p>${L(`Номер ${tasks[0].n}: гость уехал или живёт в номере?`,`${tasks[0].n} нөмір: қонақ кетті ме, әлде тұрып жатыр ма?`)}</p><div class="nums">${[['out','🧳 '+L('Выезд — гость уехал','Шығу — қонақ кетті')],['stay','🛏️ '+L('Проживание — гость живёт','Тұру — қонақ тұрып жатыр')]].map(o=>`<button class="num wide2" data-v="${o[0]}">${o[1]}</button>`).join('')}</div></div>`;
      setPrompt(L('Это выезд или проживание?','Бұл шығу ма, әлде тұру ма?'));
      ui2.querySelectorAll('.num').forEach(b=>b.onclick=()=>{if(b.dataset.v===tasks[0].type){sGood();b.classList.add('right');fin()}else{mistake();sBad();shake(b);const m=L('Послушай администратора ещё раз','Әкімшіні тағы тыңда');toast(m,'bad');speak(m);talk(req)}});
    }else fin();
  },null,tasks);
}
function numQuestion(correct,_,cb,badge,tasks){
  const ui=$('#aui');const set=new Set(correct);
  while(set.size<correct.length+(correct.length>1?2:2)){const s=String(correct[Math.random()*correct.length|0]);let v=+(s[2]+s[1]+s[0]);if(!ROOMS.includes(v)||set.has(v))v=newRoom();set.add(v)}
  const opts=shuffle([...set]);
  const ticket=`<div class="ticket">${badge?`<span>${badge}</span>`:`<span>${L('Задание','Тапсырма')}</span>`}${correct.map((n,i)=>`<b>${n}${tasks?`<em>${tasks[i].type==='out'?'🧳':'🛏️'}</em>`:''}</b>`).join('')}</div>`;
  const showQ=()=>{
    ui.innerHTML=`${L2()?'':ticket}<div class="aq"><p>${correct.length>1?L('Какие номера нужно убрать? Выбери два.','Қай нөмірлерді тазалау керек? Екеуін таңда.'):L('Какой номер?','Қай нөмір?')}</p><div class="nums">${opts.map(o=>`<button class="num wide" data-v="${o}">${o}</button>`).join('')}</div>${L2()?`<button class="link" id="again">${L('Послушать ещё раз','Тағы тыңдау')}</button>`:''}</div>`;
    setPrompt(correct.length>1?L('Выбери оба номера.','Екі нөмірді де таңда.'):L('Какой номер назвал администратор?','Әкімші қай нөмірді айтты?'));
    const again=$('#again');if(again)again.onclick=()=>{state.hints++;G.hintOn=true;ui.insertAdjacentHTML('afterbegin',ticket);again.remove();later(()=>{const t=ui.querySelector('.ticket');t&&t.remove()},2500)};
    let got=0;
    ui.querySelectorAll('.num').forEach(b=>b.onclick=()=>{const v=+b.dataset.v;if(b.classList.contains('right'))return;
      if(set.has(v)&&correct.includes(v)){sGood();b.classList.add('right');if(++got===correct.length){addPts(10);later(cb,500)}}
      else{mistake();sBad();shake(b);const m=L('Не тот номер. Вспомни, что сказал администратор.','Бұл нөмір емес. Әкімші не айтқанын еске түсір.');toast(m,'bad');speak(m)}});
  };
  if(L2()){ui.innerHTML=ticket+`<div class="memo">👀 ${L('Запомни!','Есте сақта!')} <span class="cd">4</span></div>`;setPrompt(L('Запомни номер. Скоро задание исчезнет.','Нөмірді есте сақта. Тапсырма жақында жоғалады.'));let c=4;const iv=setInterval(()=>{c--;const e=ui.querySelector('.cd');if(e)e.textContent=c;if(c<=0){clearInterval(iv);showQ()}},1000);state.timers.push(iv)}
  else showQ();
}

  const ui=$('#aui');talk(L('Смена закончилась. Давай подведём итоги.','Ауысым аяқталды. Қорытынды жасайық.'));
  const rooms=G.shiftLog.filter(p=>!p.inspect),issues=[...new Set(G.shiftLog.flatMap(p=>(p.issues||[]).map(i=>`${i.n} — ${stName(i.s).toLowerCase()}`)))];
  const keys=()=>{
    setPrompt(L('Сдай ключ-карту и рацию.','Кілт-карта мен рацияны тапсыр.'));talk(L('Сдай, пожалуйста, ключ-карту и рацию.','Кілт-карта мен рацияны тапсырыңызшы.'));
    ui.innerHTML=`<div class="tiles">${shuffle([['💳',L('Ключ-карта','Кілт-карта'),1],['📻',L('Рация','Рация'),1],['🧽',L('Губка','Губка'),0]]).map(x=>`<button class="tile" data-ok="${x[2]}"><span class="in"><span class="emo">${x[0]}</span><span class="nm">${x[1]}</span></span></button>`).join('')}</div>`;

  };
  setPrompt(L('Отчёт за смену.','Ауысым есебі.'));
  const table=`<div class="report"><h3>📝 ${L('Отчёт за смену','Ауысым есебі')}</h3><table><tr><th>${L('Номер','Нөмір')}</th><th>${L('Работа','Жұмыс')}</th><th>${L('Замечания','Ескертулер')}</th></tr>${G.shiftLog.map(p=>`<tr><td>${p.n}</td><td>${p.inspect?'🔎 '+L('проверка','тексеру'):(p.type==='out'?'🧳 ':'🛏️ ')+typeName(p.type)}</td><td>${p.inspect?(p.ret?L('на доработку','қайта жасауға'):L('принят','қабылданды')):(p.issues||[]).map(i=>`${i.n} — ${stName(i.s).toLowerCase()}`).join(', ')||'—'}</td></tr>`).join('')}</table></div>`;

  const pool=[{k:'trash',h:'🍌',at:[30,84],n:L('Мусор на полу','Еденде қоқыс')},{k:'dust',h:DUST,at:[45,47],n:L('Пыль на тумбочке','Тумбочкада шаң')},{k:'towel',h:TOWEL,at:[72,88],n:L('Полотенце на полу','Еденде сүлгі')},{k:'sock',h:'🧦',at:[56,92],n:L('Носок гостя','Қонақтың шұлығы')},{k:'cup',h:'☕',at:[20,47],n:L('Грязная чашка','Лас кесе')},{k:'pillow',h:PILLOW,at:[83.8,52],n:L('Подушка лежит криво','Жастық қисық жатыр'),st:'width:17.5cqw;display:block;transform:rotate(-22deg)'}];
  const flaws=Math.random()<.2?[]:shuffle(pool).slice(0,2+Math.random()*3|0);
  if(flaws.some(f=>f.k==='pillow'))RS.inv.pillow='missing';
  const stg=openInside('<div class="stage"></div>').querySelector('.stage');
  const sc=roomStage(stg,{clean:true,wrap:'two',reserve:330,side:`<div class="side"><h3>🔎 ${L('Проверка номера','Нөмірді тексеру')} ${G.task}</h3><p class="sm">${L(`Убирала: ${G.inspectFor}. Найди все ошибки горничной.`,`Тазалаған: ${G.inspectFor}. Күтушінің барлық қатесін тап.`)}</p><ul class="flist"></ul><button class="btn" id="accept">✓ ${L('Принять номер','Нөмірді қабылдау')}</button><button class="btn ghost" id="ret">↩ ${L('Вернуть на доработку','Қайта жасауға қайтару')}</button></div>`});
  let found=0;const fl=W.inside.querySelector('.flist');
  flaws.forEach(f=>{const b=addItem(sc,f.h,f.at[0],f.at[1],'prob',()=>{if(b.dataset.done)return;b.dataset.done=1;found++;sGood();addPts(10);const ok=document.createElement('span');ok.className='ok';ok.textContent='✓';b.append(ok);fl.insertAdjacentHTML('beforeend',`<li>⚠ ${f.n}</li>`)});if(f.st)b.querySelector('.in').style.cssText=f.st});
  setPrompt(L('Ты — '+gx('старшая горничная','старший по этажу')+'. Проверь номер. Нажми на каждую ошибку, потом реши: принять или вернуть.','Сен — аға күтушісің. Нөмірді тексер. Әр қатені бас, сосын шеш: қабылдау ма, қайтару ма.'));
  setPill(L('Проверка','Тексеру'));
  const decide=ret=>{
    if(found<flaws.length){mistake();sBad();const m=L('Ты '+gx('нашла','нашёл')+' не все ошибки. Посмотри внимательнее.','Сен барлық қатені таппадың. Мұқият қара.');toast(m,'bad');speak(m);return}
    if(ret!==(flaws.length>0)){mistake();sBad();const m=flaws.length?L('Есть ошибки — номер нужно вернуть на доработку.','Қателер бар — нөмірді қайта жасауға қайтару керек.'):L('Ошибок нет — номер можно принять.','Қате жоқ — нөмірді қабылдауға болады.');toast(m,'bad');speak(m);return}
    sGood();addPts(20);setPrompt(ret?L('Номер возвращён на доработку. Горничная всё исправит.','Нөмір қайта жасауға қайтарылды. Күтуші бәрін түзетеді.'):L('Номер принят! Можно заселять гостя.','Нөмір қабылданды! Қонақты орналастыруға болады.'));
    G.pending.push({n:G.task,inspect:true,ret,flaws:flaws.length});G.mode='clean';G.phase='admin';later(exitInside,2200)};
  $('#accept').onclick=()=>decide(false);$('#ret').onclick=()=>decide(true);
}

/* ---------- laundry ---------- */
const LAUNDRY=()=>`<svg class="bg" viewBox="0 0 800 500" preserveAspectRatio="none" aria-hidden="true"><defs><pattern id="lt" width="50" height="50" patternUnits="userSpaceOnUse"><rect width="50" height="50" fill="#DDF0F6"/><path d="M50 0V50H0" fill="none" stroke="#C3E1EA" stroke-width="3"/></pattern></defs><rect width="800" height="420" fill="url(#lt)"/><rect y="420" width="800" height="80" fill="#A8CCD8"/>
${[90,280].map(x=>`<rect x="${x}" y="200" width="160" height="220" rx="12" fill="#fff" stroke="#C9DDE5" stroke-width="4"/><rect x="${x}" y="200" width="160" height="40" rx="12" fill="#EEF4F7"/><circle cx="${x+30}" cy="220" r="8" fill="#9AAEB5"/><rect x="${x+90}" y="214" width="50" height="12" rx="4" fill="#2FB36A"/><circle cx="${x+80}" cy="325" r="62" fill="#9AAEB5"/><circle cx="${x+80}" cy="325" r="50" fill="#CFE9F4"/>`).join('')}
<rect x="520" y="70" width="250" height="14" fill="#A8703F"/><rect x="520" y="190" width="250" height="14" fill="#A8703F"/><rect x="520" y="310" width="250" height="14" fill="#A8703F"/><rect x="520" y="70" width="12" height="350" fill="#A8703F"/><rect x="758" y="70" width="12" height="350" fill="#A8703F"/>
<g class="shelfstock">${[140,260].map(y=>[545,620,695].map(x=>`<rect x="${x}" y="${y-38}" width="62" height="12" rx="3" fill="#fff" stroke="#9CB8C4" stroke-width="2"/><rect x="${x}" y="${y-26}" width="62" height="12" rx="3" fill="#fff" stroke="#9CB8C4" stroke-width="2"/><rect x="${x}" y="${y-14}" width="62" height="12" rx="3" fill="#fff" stroke="#9CB8C4" stroke-width="2"/>`).join('')).join('')}</g>
<rect x="40" y="40" width="340" height="64" rx="12" fill="#2E9BD6"/><text x="210" y="84" text-anchor="middle" font-family="Comfortaa,Rubik,sans-serif" font-weight="700" font-size="${LANG==='kk'?28:32}" fill="#fff">${L('ПРАЧЕЧНАЯ','КІР ЖУУ')}</text>
<rect x="110" y="150" width="120" height="34" rx="8" fill="#2F8F8B"/><text x="170" y="173" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="700" font-size="14" fill="#fff">${L('ПОСТЕЛЬНОЕ','ТӨСЕК')}</text><rect x="300" y="150" width="120" height="34" rx="8" fill="#FF8A3D"/><text x="360" y="173" text-anchor="middle" font-family="Rubik,sans-serif" font-weight="700" font-size="14" fill="#fff">${L('ПОЛОТЕНЦА','СҮЛГІЛЕР')}</text></svg>`;
function laundryScene(){
  const LN={sheet:[ICONS.sheet,L('Простыня','Ақжайма'),'bed'],duvet:[ICONS.duvet,L('Пододеяльник','Көрпе тысы'),'bed'],pillowcase:[ICONS.pillows,L('Наволочки','Жастық тыстары'),'bed'],towel:[TOWEL,L('Большое полотенце','Үлкен сүлгі'),'tw'],handtowel:[TOWEL,L('Полотенце для рук','Қол сүлгісі'),'tw']};
  const items=(G.laundry.length?G.laundry:['towel']).slice(0,8).map((k,i)=>({k,i,e:LN[k][0],n:LN[k][1],m:LN[k][2]}));
  const root=openInside(`<div class="scene" style="--reserve:470px">${LAUNDRY()}<span class="drum" style="left:21.25%;top:65%"></span><span class="drum" style="left:45%;top:65%"></span></div><div class="lui"></div>`);
  const sc=root.querySelector('.scene'),ui=root.querySelector('.lui'),drums=root.querySelectorAll('.drum');setPill(L('Прачечная','Кір жуу'));
  const cart=addItem(sc,`<span style="display:block;width:12cqw">${CART}</span>`,62,82);
  let i=0;
  const sortNext=()=>{
    if(i===items.length){drums.forEach(d=>d.classList.add('spin'));tone(200,.4,'sine',.06);G.dirty=false;return later(countQ,900)}
    const it=items[i];
    setPrompt(L('Разложи грязное бельё по машинам: постельное отдельно, полотенца отдельно.','Лас жабдықты машиналарға сұрыпта: төсек жабдығы бөлек, сүлгілер бөлек.'));
    ui.innerHTML=`<div class="sortrow"><div class="sort-item pop"><span class="emo">${it.e}</span><span class="nm">${it.n}</span></div><div class="sortbins"><button class="bin-btn" data-m="bed" style="--c:#2F8F8B"><span class="bi">${ICONS.sheet}</span><span class="bl">${L('Машина 1: постельное','1-машина: төсек')}</span></button><button class="bin-btn" data-m="tw" style="--c:#FF8A3D"><span class="bi">${TOWEL}</span><span class="bl">${L('Машина 2: полотенца','2-машина: сүлгілер')}</span></button></div><span class="pill">${i+1} / ${items.length}</span></div>`;
    ui.querySelectorAll('.bin-btn').forEach(b=>b.onclick=()=>{if(b.dataset.m===it.m){sGood();fly(ui.querySelector('.sort-item .emo'),drums[it.m==='bed'?0:1],`<span style="font-size:50px">${it.e}</span>`);i++;later(sortNext,500)}else{mistake();sBad();shake(b);const m=L('Не сюда. Постельное и полотенца стираем отдельно.','Мұнда емес. Төсек жабдығы мен сүлгіні бөлек жуамыз.');toast(m,'bad');speak(m)}});
  };
  const countQ=()=>{ui.innerHTML='';const n=items.length;
    ask({icon:'🔢',q:L(`Сколько вещей ты ${gx('сдала','сдал')} в стирку?`,'Жууға неше зат тапсырдың?'),row:true,keep:true,opts:[...new Set([n-1,n,n+1,n+2].filter(v=>v>0))].map(v=>({t:String(v),ok:v===n,why:v===n?'':L('Посчитай ещё раз','Тағы сана')}))},()=>take(n))};
  const take=n=>{
    const wait=L2()&&Math.random()<.35;
    const getStack=()=>{let got=0;setPrompt(L(`Возьми столько же чистого: ${n}. Нажимай на стопку.`,`Сонша таза жабдық ал: ${n}. Буманы бас.`));
      ui.innerHTML=`<div class="takec"><b id="tk">0</b> / ${n}</div>`;
      const st=addItem(sc,STACK,80,40,'glowit big-it',()=>{got++;sPop();$('#tk').textContent=got;fly(st,cart,`<span style="font-size:40px">${STACK}</span>`);
        if(got===n){st.remove();G.clean=true;G.laundry=[];sGood();addPts(15);setPrompt(L('Чистое бельё на тележке! Иди к администратору.','Таза жабдық арбада! Әкімшіге бар.'));G.phase='admin';later(exitInside,2000)}})};
    if(!wait)return getStack();
    sc.querySelector('.shelfstock').style.opacity=0;
    setPrompt(L('Ой! Чистое бельё закончилось. Подожди, пока машина достирает.','Ой! Таза жабдық бітті. Машина жуып болғанша күт.'));
    ui.innerHTML=`<div class="meter"><div class="meter-fill" id="wf"></div><span>🫧 ${L('Стирка','Жуу')}…</span></div>`;
    let p=0;const iv=setInterval(()=>{p+=4;const e=$('#wf');if(e)e.style.width=p+'%';if(p>=100){clearInterval(iv);sc.querySelector('.shelfstock').style.opacity=1;sGood();getStack()}},200);state.timers.push(iv);
  };
  sortNext();
}

/* ---------- start ---------- */
function applyLang(){
  INV=INVDEF.filter(i=>!i.lv||LEVEL>=i.lv).map(i=>({...i,n:L(i.ru,i.kk)}));
  document.documentElement.lang=LANG==='kk'?'kk':'ru';
  $('.brand span').textContent=L('Смена горничной','Бөлме күтушісінің ауысымы');
  soundLabel();
}
function startScreen(){
  applyLang();clearTimers();
  const LV=[[1,'🌱',L('Ученик','Оқушы'),L('Вся смена шаг за шагом, с подсказками','Бүкіл ауысым қадам-қадаммен, көмекпен')],[2,'⭐',L('Горничная','Күтуші'),L('Память, цветные тряпки, минибар, события, очки и время','Есте сақтау, түсті шүберек, минибар, оқиғалар, ұпай мен уақыт')],[3,'👑',L('Старшая горничная','Аға күтуші'),L('Два номера сразу и проверка работы других горничных','Бір мезгілде екі нөмір және басқа күтушілердің жұмысын тексеру')]];
  let recs='';try{const R=JSON.parse(localStorage.getItem('smena-rec'+LEVEL)||'[]');if(R.length&&LEVEL>=2)recs=`<div class="recs"><b>🏆 ${L('Рекорды','Рекордтар')}</b>${R.map((r,i)=>`<span>${i+1}. ⭐ ${r.p} <small>${r.d}</small></span>`).join('')}</div>`}catch(e){}
  view.innerHTML=`<section class="hero setup"><div class="setup-main"><h1>${L('Смена горничной','Бөлме күтушісінің ауысымы')}</h1>
   <p>${L('Ты работаешь в отеле. Подготовься к смене, узнай номер у администратора, собери тележку, доедь до номера, прими и убери его, отвези бельё в прачечную. И снова!','Сен қонақүйде жұмыс істейсің. Ауысымға дайындал, әкімшіден нөмірді біл, арбаны жина, нөмірге жет, оны қабылдап тазала, жабдықты кір жууға апар. Және қайтадан!')}</p>
   <h2 class="pick-h">1. ${L('Язык','Тіл')}</h2>
   <div class="picks"><button class="pick lang ${LANG==='ru'?'on':''}" data-l="ru"><b>Русский</b></button><button class="pick lang ${LANG==='kk'?'on':''}" data-l="kk"><b>Қазақша</b></button></div>
   <h2 class="pick-h">2. ${L('Выбери персонажа','Кейіпкерді таңда')}</h2>
   <div class="picks"><button class="pick sex ${SEX==='f'?'on':''}" data-s="f">${MAID}<b>${L('Девушка','Қыз')}</b></button><button class="pick sex ${SEX==='m'?'on':''}" data-s="m">${MAN}<b>${L('Парень','Жігіт')}</b></button></div>
   <h2 class="pick-h">3. ${L('Уровень','Деңгей')}</h2>
   <div class="picks lvls">${LV.map(l=>`<button class="pick lv3 ${LEVEL===l[0]?'on':''}" data-v="${l[0]}"><i>${l[1]}</i><b>${l[2]}</b><small>${l[3]}</small></button>`).join('')}</div>${recs}
   <button class="btn big" id="go">▶ ${L('Начать смену','Ауысымды бастау')}</button>${G.total?`<p class="foot">${L('Всего убрано номеров на этом компьютере','Осы компьютерде барлығы тазаланған нөмірлер')}: ${G.total}</p>`:''}</div></section>`;
  view.querySelectorAll('.pick.lang').forEach(b=>b.onclick=()=>{LANG=b.dataset.l;try{localStorage.setItem('smena-lang',LANG)}catch(e){}sPop();startScreen()});
  view.querySelectorAll('.pick.sex').forEach(b=>b.onclick=()=>{SEX=b.dataset.s;try{localStorage.setItem('smena-sex',SEX)}catch(e){}sPop();view.querySelectorAll('.pick.sex').forEach(x=>x.classList.toggle('on',x===b))});
  view.querySelectorAll('.pick.lv3').forEach(b=>b.onclick=()=>{LEVEL=+b.dataset.v;try{localStorage.setItem('smena-level',LEVEL)}catch(e){}sPop();startScreen()});
  $('#go').onclick=()=>{ac();applyLang();const t=G.total;resetGame();G.total=t;buildGame()};
}
startScreen();

</script>
</body></html>
