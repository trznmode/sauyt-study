<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Учебная шахматка</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Golos+Text:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600;700&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: стойка ресепшн — тёмная консоль сверху, шахматка как главная доска слева, бланки отчётов справа */
:root{
  --bg:#EBF0F2; --surface:#FFFFFF; --surface-2:#F4F7F8; --ink:#132430; --ink-2:#536470; --ink-3:#7D8C96;
  --line:#D2DBE0; --line-2:#E3E9EC;
  --accent:#0A6C8B; --accent-ink:#FFFFFF; --accent-soft:#D3E9F1; --accent-ink-soft:#074E66;
  --gold:#C28E22; --gold-ink:#1E1505; --gold-soft:#F7EACB; --gold-ink-soft:#6E4A06;
  --ok:#1B7A4B; --ok-soft:#D9EFE2; --bad:#B3291F; --bad-soft:#F8DDD9; --warn:#8F5600; --warn-soft:#F6E5CB;
  --bar-out:#CAD3D8; --bar-out-ink:#43535D; --ooo:#3A4650; --ooo-2:#4A5762; --ooo-ink:#F1F4F6; --weekend:#F1EEE4;
  --console:#10202A; --console-2:#1A2F3B; --console-line:#284351; --console-ink:#E5EEF2; --console-ink-2:#97ABB6;
  --m-in:#2E9BC0; --m-out:#3B4F5B; --m-ns:#E0675C; --m-ooo:#5D6C77; --live-on:#4CC38A; --live-off:#F07A6E;
  --shadow:0 1px 2px rgba(16,32,42,.05),0 6px 20px rgba(16,32,42,.06);
  --f-display:"Unbounded","Golos Text",system-ui,sans-serif;
  --f-body:"Golos Text",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"Cascadia Mono",Consolas,monospace;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0C151A; --surface:#132028; --surface-2:#182832; --ink:#E1E9ED; --ink-2:#9BAEB9; --ink-3:#6F838E;
    --line:#29404C; --line-2:#1F323C;
    --accent:#3CA6C8; --accent-ink:#04202A; --accent-soft:#123A4A; --accent-ink-soft:#A5DAEC;
    --gold:#E1B14A; --gold-ink:#1E1505; --gold-soft:#33290F; --gold-ink-soft:#EBCB86;
    --ok:#52C78F; --ok-soft:#133426; --bad:#F27D72; --bad-soft:#3C1915; --warn:#E8A74A; --warn-soft:#38270F;
    --bar-out:#33454F; --bar-out-ink:#B9C6CD; --ooo:#5B6974; --ooo-2:#4B5862; --ooo-ink:#0C151A; --weekend:#16232B;
    --console:#081117; --console-2:#13232D; --console-line:#1F3542;
    --shadow:none;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0C151A; --surface:#132028; --surface-2:#182832; --ink:#E1E9ED; --ink-2:#9BAEB9; --ink-3:#6F838E;
  --line:#29404C; --line-2:#1F323C;
  --accent:#3CA6C8; --accent-ink:#04202A; --accent-soft:#123A4A; --accent-ink-soft:#A5DAEC;
  --gold:#E1B14A; --gold-ink:#1E1505; --gold-soft:#33290F; --gold-ink-soft:#EBCB86;
  --ok:#52C78F; --ok-soft:#133426; --bad:#F27D72; --bad-soft:#3C1915; --warn:#E8A74A; --warn-soft:#38270F;
  --bar-out:#33454F; --bar-out-ink:#B9C6CD; --ooo:#5B6974; --ooo-2:#4B5862; --ooo-ink:#0C151A; --weekend:#16232B;
  --console:#081117; --console-2:#13232D; --console-line:#1F3542;
  --shadow:none;
  color-scheme:dark;
}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:14px;line-height:1.45;-webkit-font-smoothing:antialiased}
#app{height:100%}
h1,h2,h3{margin:0;text-wrap:balance}
p{margin:0}
button,input,textarea,select{font:inherit;color:inherit}
button{cursor:pointer}
.mono{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.muted{color:var(--ink-2)}
.small{font-size:12px}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ---------- кнопки ---------- */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:36px;padding:0 14px;border-radius:8px;border:1px solid var(--line);background:var(--surface);color:var(--ink);font-weight:600;font-size:14px;white-space:nowrap;transition:filter .15s,border-color .15s}
.btn:hover:not([disabled]){border-color:var(--ink-3)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn svg{width:18px;height:18px;flex:none}
.btn-primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn-primary:hover:not([disabled]){filter:brightness(1.08);border-color:var(--accent)}
.btn-gen{background:var(--gold);border-color:var(--gold);color:var(--gold-ink)}
.btn-gen:hover:not([disabled]){filter:brightness(1.07);border-color:var(--gold)}
.btn-light{background:var(--console-ink);border-color:var(--console-ink);color:var(--console)}
.btn-light:hover:not([disabled]){filter:brightness(.94);border-color:var(--console-ink)}
.btn-ghost{background:transparent;border-color:var(--console-line);color:var(--console-ink-2)}
.btn-ghost:hover:not([disabled]){border-color:var(--console-ink-2);color:var(--console-ink)}
.btn-danger{color:var(--bad);border-color:var(--bad);background:var(--surface)}
.btn-lg{min-height:46px;font-size:15px;padding:0 22px}
.linkbtn{background:none;border:0;padding:0;color:var(--accent);font-weight:600;text-decoration:underline;text-underline-offset:3px;text-align:left}

/* ---------- стартовый экран ---------- */
.start{min-height:100%;display:grid;grid-template-columns:minmax(0,7fr) minmax(0,5fr)}
.start-intro{background:var(--console);color:var(--console-ink);padding-block:clamp(28px,5vw,64px);padding-inline:clamp(16px,5vw,64px);display:flex;flex-direction:column;gap:28px;justify-content:center}
.brand{display:flex;align-items:center;gap:10px;font-size:13px;color:var(--console-ink-2);letter-spacing:.02em}
.brand-key{width:32px;height:32px;border-radius:8px;background:var(--gold);color:var(--gold-ink);display:grid;place-items:center;flex:none}
.brand-key svg{width:18px;height:18px}
.display{font-family:var(--f-display);font-weight:700;font-size:clamp(32px,4.6vw,56px);line-height:1.04;letter-spacing:-.01em}
.lead{font-size:16px;line-height:1.6;max-width:60ch;color:var(--console-ink-2)}
.lead b{color:var(--console-ink);font-weight:600}
.mini{border:1px solid var(--console-line);border-radius:10px;overflow:hidden;background:var(--console-2);max-width:620px}
.mini-row{display:grid;grid-template-columns:48px minmax(0,1fr);height:26px;border-top:1px solid var(--console-line)}
.mini-row.mini-head{border-top:0;height:24px}
.mini-no{font-family:var(--f-mono);font-size:11px;color:var(--console-ink-2);display:flex;align-items:center;padding-left:10px}
.mini-days{display:grid;grid-template-columns:repeat(10,1fr);font-family:var(--f-mono);font-size:10px;color:var(--console-ink-2);align-items:center;text-align:center}
.mini-days .is-today{color:var(--gold);font-weight:700}
.mini-track{position:relative;background:repeating-linear-gradient(90deg,transparent 0 calc(10% - 1px),var(--console-line) calc(10% - 1px) 10%)}
.mini-today{position:absolute;left:30%;width:10%;top:0;bottom:0;background:color-mix(in srgb,var(--gold) 16%,transparent)}
.mb{position:absolute;top:5px;bottom:5px;border-radius:4px}
.m-in{background:var(--m-in)}
.m-res{background:color-mix(in srgb,var(--m-in) 22%,transparent);border:1px solid var(--m-in)}
.m-out{background:var(--m-out)}
.m-ns{background:repeating-linear-gradient(135deg,color-mix(in srgb,var(--m-ns) 45%,transparent) 0 4px,transparent 4px 8px);border:1px solid var(--m-ns)}
.m-ooo{background:repeating-linear-gradient(135deg,var(--m-ooo) 0 5px,var(--m-out) 5px 10px)}
.m-arr{box-shadow:inset 4px 0 0 var(--gold)}
.mini-cap{font-size:12px;color:var(--console-ink-2);margin-top:8px}
.steps{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 28px;counter-reset:s;max-width:640px}
.steps li{counter-increment:s;display:grid;grid-template-columns:28px minmax(0,1fr);gap:2px 10px}
.steps li::before{content:counter(s);grid-row:span 2;width:26px;height:26px;border-radius:50%;border:1px solid var(--console-line);display:grid;place-items:center;font-family:var(--f-mono);font-size:12px;color:var(--gold)}
.steps b{font-weight:600}
.steps span{color:var(--console-ink-2);font-size:13px}
.start-side{display:flex;flex-direction:column;justify-content:center;align-items:center;gap:18px;padding-block:clamp(24px,5vw,56px);padding-inline:clamp(16px,4vw,56px)}
.card{background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow)}
.start-card{padding:24px;display:flex;flex-direction:column;gap:16px;max-width:460px;width:100%}
.start-card h2{font-family:var(--f-display);font-weight:500;font-size:20px}
.start-foot{max-width:460px;width:100%}
.field{display:flex;flex-direction:column;gap:6px}
.field label{font-weight:600;font-size:13px}
.field input,textarea.inp,.search{border:1px solid var(--line);background:var(--surface-2);border-radius:8px;padding:9px 12px;min-height:40px;width:100%}
.field input:focus,textarea.inp:focus,.search:focus{border-color:var(--accent);outline:none;box-shadow:0 0 0 3px var(--accent-soft)}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.mods{border:1px solid var(--line);border-radius:10px;padding:8px 12px 12px;margin:0;display:flex;flex-direction:column;gap:9px}
.mods legend{font-weight:600;font-size:13px;padding:0 4px}
.mod{display:grid;grid-template-columns:18px minmax(0,1fr);gap:10px;align-items:start;font-size:13px;cursor:pointer}
.mod input{margin:2px 0 0;accent-color:var(--accent);width:16px;height:16px}
.mod small{display:block;color:var(--ink-2);font-size:12px}
.form-err{color:var(--bad);font-weight:600;font-size:13px}
.resume{border:1px solid var(--gold);background:var(--gold-soft);color:var(--gold-ink-soft);border-radius:10px;padding:12px;display:flex;flex-direction:column;gap:8px;font-size:13px}
.resume b{color:var(--ink)}
@media (max-width:900px){.start{grid-template-columns:minmax(0,1fr)}.steps{grid-template-columns:minmax(0,1fr)}}

/* ---------- рабочее место ---------- */
.work{height:100%;display:flex;flex-direction:column}
.tb{background:var(--console);color:var(--console-ink);display:flex;align-items:center;gap:10px 28px;flex-wrap:wrap;padding:10px 16px;border-bottom:1px solid var(--console-line)}
.tb-block{display:flex;align-items:center;gap:10px;min-width:0}
.tb-name{font-weight:600;font-size:14px}
.tb-sub{font-size:12px;color:var(--console-ink-2)}
.tb-sub .mono{color:var(--console-ink)}
.tb-actions{margin-left:auto;display:flex;gap:8px;flex-wrap:wrap}
.langsw{display:inline-flex;border:1px solid var(--console-line);border-radius:8px;overflow:hidden;flex:none}
.langsw button{background:transparent;border:0;color:var(--console-ink-2);padding:0 11px;min-height:34px;font-weight:600;font-size:12.5px}
.langsw button:hover{color:var(--console-ink)}
.langsw button[aria-pressed="true"]{background:var(--console-ink);color:var(--console)}
.brand .langsw{margin-left:auto}
.live{display:inline-flex;align-items:center;gap:5px;color:var(--console-ink-2)}
.live::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--live-on)}
.live.off::before{background:var(--live-off)}
.live-note{font-size:12.5px;color:var(--ok);font-weight:600}
.tb-done{display:inline-flex;align-items:center;gap:6px;background:var(--console-2);border-radius:999px;padding:2px 10px;font-size:12px;color:var(--console-ink)}
.panes{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(350px,430px)}
.pane{min-width:0;min-height:0;display:flex;flex-direction:column}
.pane-rep{border-left:1px solid var(--line);background:var(--surface)}
.pane-head{background:var(--surface);border-bottom:1px solid var(--line);padding:0 12px}
.tabs{display:flex;gap:2px;overflow-x:auto;scrollbar-width:thin}
.tab{border:0;background:none;padding:11px 10px 9px;font-weight:600;font-size:13.5px;color:var(--ink-2);border-bottom:2px solid transparent;white-space:nowrap;display:inline-flex;align-items:center;gap:6px}
.tab:hover{color:var(--ink)}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
.tab .cnt{font-family:var(--f-mono);font-size:11px;color:var(--ink-3);font-weight:500}
.tab.done .cnt{color:var(--ok)}
.pane-body{flex:1;min-height:0;overflow:auto;padding:16px}
.pane-body.is-rack{overflow:hidden;display:flex;flex-direction:column;gap:10px;padding:12px 16px 16px}
@media (max-width:1100px){
  .work{height:auto;min-height:100%}
  .panes{grid-template-columns:minmax(0,1fr)}
  .pane-rep{border-left:0;border-top:1px solid var(--line)}
  .pane-body,.pane-body.is-rack{overflow:visible}
  .rk-wrap{max-height:72vh}
}

/* пустое состояние */
.empty{max-width:520px;margin:48px auto;text-align:center;display:flex;flex-direction:column;align-items:center;gap:12px}
.empty-ic{width:56px;height:56px;border-radius:14px;background:var(--gold-soft);color:var(--gold-ink-soft);display:grid;place-items:center}
.empty-ic svg{width:28px;height:28px}
.empty h3{font-family:var(--f-display);font-weight:500;font-size:18px}
.empty p{color:var(--ink-2)}

/* ---------- шахматка ---------- */
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);align-items:center}
.lg{display:inline-flex;align-items:center;gap:6px}
.lg i{width:22px;height:12px;border-radius:3px;display:inline-block;position:relative;overflow:hidden}
.lg .hint{margin-left:auto}
.rk-wrap{flex:1;min-height:0;overflow:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.rk{position:relative;width:max-content;min-width:100%}
.rk-head{position:sticky;top:0;z-index:6;display:flex;background:var(--surface);border-bottom:1px solid var(--line)}
.rk-corner{position:sticky;left:0;z-index:7;width:var(--lbl);flex:none;background:var(--surface);border-right:1px solid var(--line);font-size:11px;color:var(--ink-2);padding:6px 10px;display:flex;align-items:flex-end}
.rk-day{flex:none;width:var(--cw);text-align:center;padding:5px 0 4px;border-left:1px solid var(--line-2);font-size:11px;line-height:1.2}
.rk-day .wd{display:block;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;font-size:10px}
.rk-day .dm{font-family:var(--f-mono);font-weight:500}
.rk-day.is-we .wd{color:var(--bad)}
.rk-day.is-today{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold)}
.rk-day.is-today .wd{color:var(--gold-ink-soft);font-weight:700}
.rk-body{position:relative}
.rk-cols{position:absolute;top:0;bottom:0;left:var(--lbl);display:flex;pointer-events:none}
.rk-col{width:var(--cw);flex:none;border-left:1px solid var(--line-2)}
.rk-col.is-we{background:var(--weekend)}
.rk-col.is-today{background:var(--gold-soft);border-left-color:var(--gold);border-right:1px solid var(--gold)}
.rk-floor{position:relative;z-index:2;height:22px;display:flex;align-items:center;font-size:10.5px;font-weight:700;color:var(--ink-2);text-transform:uppercase;letter-spacing:.1em;background:var(--surface-2);border-bottom:1px solid var(--line)}
.rk-floor span{position:sticky;left:0;padding:0 10px}
.rk-row{position:relative;display:flex;height:var(--rh);border-bottom:1px solid var(--line-2)}
.rk-room{position:sticky;left:0;z-index:4;width:var(--lbl);flex:none;background:var(--surface);border-right:1px solid var(--line);display:flex;align-items:center;gap:8px;padding:0 10px}
.rk-room b{font-family:var(--f-mono);font-weight:600;font-size:13px}
.rk-room span{font-size:10px;color:var(--ink-2);letter-spacing:.06em}
.rk-track{position:relative;flex:none}
.bar{position:absolute;top:4px;height:calc(var(--rh) - 8px);border-radius:6px;font-size:11.5px;line-height:1;padding:0 7px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;border:1px solid transparent;text-align:left;font-weight:500;z-index:1;display:block}
.bar:hover{filter:brightness(1.07);z-index:3}
.st-in{background:var(--accent);color:var(--accent-ink)}
.st-res{background:var(--accent-soft);color:var(--accent-ink-soft);border-color:color-mix(in srgb,var(--accent) 50%,transparent)!important}
.st-out{background:var(--bar-out);color:var(--bar-out-ink)}
.st-ns{background:repeating-linear-gradient(135deg,var(--bad-soft) 0 5px,var(--surface) 5px 10px);color:var(--bad);border-color:var(--bad)!important;font-weight:600}
.st-ooo{background:repeating-linear-gradient(135deg,var(--ooo) 0 6px,var(--ooo-2) 6px 12px);color:var(--ooo-ink);font-weight:600}
.arr{box-shadow:inset 4px 0 0 var(--gold);padding-left:10px}
.bar.cl{border-top-left-radius:0;border-bottom-left-radius:0}
.bar.cr{border-top-right-radius:0;border-bottom-right-radius:0}
.lg .today-sw{background:var(--gold-soft);box-shadow:inset 0 -3px 0 var(--gold)}

/* ---------- таблицы ---------- */
.toolbar{display:flex;flex-wrap:wrap;gap:10px 16px;align-items:center;margin-bottom:12px}
.toolbar .search{max-width:300px;min-height:36px}
.tbl-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table.t{border-collapse:collapse;width:100%;font-size:13px}
.t th{text-align:left;font-size:10.5px;text-transform:uppercase;letter-spacing:.07em;color:var(--ink-2);font-weight:600;padding:8px 10px;border-bottom:1px solid var(--line);background:var(--surface-2);white-space:nowrap}
.t td{padding:7px 10px;border-bottom:1px solid var(--line-2);vertical-align:top}
.t tr:last-child td{border-bottom:0}
.t .num{text-align:right;font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.t .nw{white-space:nowrap}
.t tbody tr[data-act]{cursor:pointer}
.t tbody tr[data-act]:hover td{background:var(--surface-2)}
.chip{display:inline-flex;align-items:center;height:20px;padding:0 8px;border-radius:999px;font-size:11.5px;font-weight:600;white-space:nowrap;background:var(--surface-2);color:var(--ink-2)}
.c-in{background:var(--accent);color:var(--accent-ink)}
.c-res,.c-checkin{background:var(--accent-soft);color:var(--accent-ink-soft)}
.c-out{background:var(--bar-out);color:var(--bar-out-ink)}
.c-bad{background:var(--bad-soft);color:var(--bad)}
.c-charge{background:var(--gold-soft);color:var(--gold-ink-soft)}
.c-pay{background:var(--ok-soft);color:var(--ok)}
.c-warn{background:var(--warn-soft);color:var(--warn)}
.h-dirty{background:var(--bad-soft);color:var(--bad)}
.h-clean{background:var(--accent-soft);color:var(--accent-ink-soft)}
.h-insp{background:var(--ok-soft);color:var(--ok)}
.h-ooo{background:var(--ooo);color:var(--ooo-ink)}
.filters{display:flex;flex-wrap:wrap;gap:6px}
.fbtn{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:5px 12px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.fbtn[aria-pressed="true"]{background:var(--ink);border-color:var(--ink);color:var(--surface)}
.jr-meta{font-size:13px;color:var(--ink-2)}
.jr-meta b{color:var(--ink)}

/* ---------- статусы номеров ---------- */
.floors{display:flex;flex-direction:column;gap:18px}
.floor h3{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--ink-2);margin-bottom:8px}
.tiles{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{border:1px solid var(--line);border-radius:10px;background:var(--surface);padding:10px 11px;display:flex;flex-direction:column;gap:6px}
.tile-top{display:flex;justify-content:space-between;align-items:baseline;gap:6px}
.tile-no{font-family:var(--f-mono);font-weight:600;font-size:16px}

<script>
(() => {
'use strict';

/* ================= утилиты ================= */
const LS_SHIFT = 'sapar.shift.v1', LS_JOURNAL = 'sapar.journal.v1', LS_LAST = 'sapar.last.v1', LS_LANG = 'sapar.lang.v1';

const pad = n => String(n).padStart(2, '0');

const fmtMoney = n => Math.round(n).toLocaleString('ru-RU') + ' ₸';

let LANG = lsGet(LS_LANG) === 'kz' ? 'kz' : 'ru';

/* ================= генератор дня ================= */
function mulberry32(a) { return function () { a |= 0; a = a + 0x6D2B79F5 | 0; let t = Math.imul(a ^ a >>> 15, 1 | a); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }

function buildScenario(seed, dISO) {
  const R = mulberry32(seed);
  const ri = (a, b) => a + Math.floor(R() * (b - a + 1));
  const pick = a => a[Math.floor(R() * a.length)];
  const chance = p => R() < p;
  const wpick = ps => { let t = 0; for (const p of ps) t += p[1]; let r = R() * t; for (const [v, w] of ps) { r -= w; if (r < 0) return v; } return ps[ps.length - 1][0]; };
  const shuffle = a => { a = a.slice(); for (let i = a.length - 1; i > 0; i--) { const j = Math.floor(R() * (i + 1)); [a[i], a[j]] = [a[j], a[i]]; } return a; };
  const tm = (a, b) => ri(Math.ceil(a / 5), Math.floor(b / 5)) * 5;
  const m100 = (a, b) => ri(a / 100, b / 100) * 100;
  const method = () => wpick([['Наличные', .25], ['Карта', .45], ['Kaspi QR', .3]]);
  const d0 = dOf(dISO);

  // номера вне продажи
  const order = shuffle(ROOMS.map(r => r.no));
  const ooo = [];
  const nO = wpick([[1, .45], [2, .4], [3, .15]]);
  for (let i = 0; i < nO; i++) ooo.push({ room: order[i], a: -ri(0, 4), d: ri(1, 4), reason: pick(OOO_REASONS) });
  if (chance(.5)) { const a = ri(1, 3); ooo.push({ room: order[nO], a, d: a + ri(2, 4), reason: pick(OOO_REASONS) }); }

  // проживания по номерам
  const p0 = .38 + R() * .42;
  const stays = [];
  for (const room of ROOMS) {
    const blocks = ooo.filter(o => o.room === room.no);
    let t = -14 + ri(0, 4);
    while (t < 17) {
      if (!chance(p0)) t += ri(1, 3);
      const n = wpick([[1, .2], [2, .3], [3, .2], [4, .13], [5, .08], [6, .05], [7, .04]]);
      const a = t, d = t + n;
      const blk = blocks.find(o => a < o.d && o.a < d);
      if (blk) { t = blk.d; continue; }
      t = d;
      if (a > 3 && chance(.15 + (a - 3) * .04)) continue;
      if (d < -3) continue;
      stays.push({ room: room.no, cat: room.cat, a, d });
    }
  }
  stays.sort((x, y) => x.a - y.a || x.room - y.room);

  let bn = ri(41000, 46000);
  const guest = () => {
    const kind = wpick([['kz', .55], ['ru', .27], ['in', .18]]), g = chance(.5) ? 'm' : 'f', N = NAMES[kind];
    let last = pick(N.s);
    if (g === 'f' && kind !== 'in' && /(ов|ев|ёв|ин)$/.test(last)) last += 'а';
    const first = pick(N[g]);
    return { last, first, guest: last + ' ' + first, short: last + ' ' + first[0] + '.' };
  };
  const fill = (s, ch) => {
    bn += ri(1, 7); s.id = 'B' + bn; s.ch = ch; s.rate = CATS[s.cat][CH[ch].rate];
    if (ch === 'CORP') { s.ad = chance(.8) ? 1 : 2; s.chd = 0; }
    else if (s.cat === 'STD') { s.ad = chance(.5) ? 1 : 2; s.chd = 0; }
    else if (s.cat === 'SUP') { s.ad = chance(.25) ? 1 : 2; s.chd = chance(.3) ? 1 : 0; }
    else if (s.cat === 'DLX') { s.ad = 2; s.chd = chance(.4) ? 1 : 0; }
    else { s.ad = 2; s.chd = wpick([[0, .5], [1, .3], [2, .2]]); }
    s.meal = chance(ch === 'CORP' ? .85 : ch === 'TA' ? .7 : ch === 'WALK' ? .35 : .55) ? 'BB' : 'RO';
    Object.assign(s, guest());
    if (ch === 'CORP') s.payer = pick(COMPANIES); else if (ch === 'TA') s.payer = pick(AGENCIES);
  };
  for (const s of stays) fill(s, wpick([['DIR', .25], ['OTA', .36], ['CORP', .21], ['TA', .18]]));

  // статусы
  for (const s of stays) {
    if (s.d <= 0) s.st = 'out';
    else if (s.a < 0) s.st = 'in';
    else if (s.a === 0) { const r = R(); s.st = r < .1 ? 'ns' : r < .17 ? 'cx' : 'in'; }
    else s.st = 'res';
    if (s.st === 'ns' && s.d - s.a > 2) s.d = s.a + 2;
  }
  let fc = 0;
  for (const s of shuffle(stays.filter(s => s.st === 'res' && s.a <= 10))) { if (fc >= 2) break; if (chance(.06)) { s.st = 'cx'; fc++; } }

  // walk-in
  const live = s => s.st === 'in' || s.st === 'res';
  const oooAt = (no, k) => ooo.some(o => o.room === no && o.a <= k && k < o.d);
  const nW = wpick([[0, .3], [1, .45], [2, .25]]);
  let made = 0;
  for (const r of shuffle(ROOMS)) {
    if (made >= nW) break;
    if (oooAt(r.no, 0)) continue;
    const mine = stays.filter(s => s.room === r.no);
    if (mine.some(s => (live(s) && s.a <= 0 && 0 < s.d) || s.st === 'ns')) continue;
    const next = Math.min(99, ...mine.filter(s => live(s) && s.a > 0).map(s => s.a), ...ooo.filter(o => o.room === r.no && o.a > 0).map(o => o.a));
    const n = Math.min(ri(1, 2), next);
    if (n < 1) continue;
    const s = { room: r.no, cat: r.cat, a: 0, d: n, st: 'in', walk: true };
    fill(s, 'WALK'); stays.push(s); made++;
  }

  // события смены; tx — шаблон текста и его аргументы (переводится при показе)
  const ev = []; let seq = 0;
  const push = o => { o.q = seq++; ev.push(o); return o; };
  const chg = (t, s, cat, amount, tx) => push({ t, k: 'charge', room: s.room, guest: s.guest, sid: s.id, cat, amount, tx });
  const pay = (t, s, m, amount, tx, who) => push({ t, k: 'pay', room: s ? s.room : '', guest: s ? s.guest : (who || ''), sid: s ? s.id : null, method: m, amount, tx });
  const sumCh = (s, t) => sum(ev.filter(e => e.k === 'charge' && e.sid === s.id && e.t <= t).map(e => e.amount));

  const deps = stays.filter(s => s.st === 'out' && s.d === 0);
  const arrs = stays.filter(s => s.st === 'in' && s.a === 0);
  const arrRooms = new Set(stays.filter(s => s.a === 0).map(s => s.room));
  const depRooms = new Set(deps.map(s => s.room));
  const stayovers = stays.filter(s => s.st === 'in' && s.a < 0 && s.d > 0);
  const inhouse = stays.filter(s => s.st === 'in' && s.a <= 0 && 0 < s.d);

  for (const s of deps) { if (!arrRooms.has(s.room) && chance(.18)) { s.late = true; s.co = tm(13 * 60, 18 * 60); } else s.co = tm(7 * 60 + 30, 11 * 60 + 55); }
  for (const s of arrs) { if (!s.walk && !depRooms.has(s.room) && chance(.12)) { s.early = true; s.ci = tm(8 * 60, 12 * 60); } else s.ci = s.walk ? tm(15 * 60, 20 * 60 + 30) : tm(14 * 60, 20 * 60 + 30); }

  const dnd = new Set();
  for (const s of shuffle(stayovers)) { if (dnd.size >= 4) break; if (chance(.15)) dnd.add(s.room); }

  for (const s of arrs) push({ t: s.ci, k: 'checkin', room: s.room, guest: s.guest, sid: s.id, tx: s.walk ? ['Заселение без брони (walk-in)'] : [s.early ? 'Ранний заезд по брони {0}' : 'Заселение по брони {0}', s.id] });
  for (const s of deps) push({ t: s.co, k: 'checkout', room: s.room, guest: s.guest, sid: s.id, tx: [s.late ? 'Поздний выезд' : 'Выезд'] });

  for (const s of stays) {
    if (!((s.st === 'in' || s.st === 'out') && s.a < 0 && s.d >= 0 && s.meal === 'BB')) continue;
    const p = s.ad + s.chd, hi = s.d === 0 ? Math.min(10 * 60 + 30, s.co - 15) : 10 * 60 + 30;
    chg(tm(7 * 60, Math.max(7 * 60, hi)), s, 'Завтрак', p * PRICES.breakfast, ['Завтрак, {0} чел.', p]);
  }
  for (const s of deps) {
    if (s.late) chg(s.co - 1, s, 'Поздний выезд', s.rate / 2, ['Поздний выезд до {0} — 50% тарифа', hhmm(s.co)]);
    if (chance(.3)) chg(s.co - 5, s, 'Мини-бар', m100(1500, 7800), ['Мини-бар — проверка при выезде']);
    if (chance(.14)) { const air = chance(.65); chg(s.co - 5, s, 'Трансфер', air ? PRICES.trAir : PRICES.trRail, [air ? 'Трансфер в аэропорт' : 'Трансфер на ж/д вокзал']); }
  }
  for (const s of arrs) {
    if (s.early) chg(s.ci, s, 'Ранний заезд', s.rate / 2, ['Ранний заезд в {0} — 50% тарифа', hhmm(s.ci)]);
    if (!s.walk && chance(.15)) { const air = chance(.65); chg(s.ci, s, 'Трансфер', air ? PRICES.trAir : PRICES.trRail, [air ? 'Трансфер из аэропорта' : 'Трансфер с ж/д вокзала']); }
  }
  const after = (s, from) => s.a === 0 ? Math.max(from, s.ci + 20) : from;
  for (const s of shuffle(inhouse).slice(0, ri(2, 4))) {
    const from = after(s, 12 * 60), to = 22 * 60 + 30;
    if (from > to) continue;
    const t = tm(from, to), amt = m100(5500, 26000), spot = chance(.45);
    chg(t, s, 'Ресторан', amt, [spot ? '{0} — оплачено на месте' : '{0} — на счёт номера', pick(REST)]);
    if (spot) pay(t, s, method(), amt, ['Оплата счёта ресторана']);
  }
  for (const s of shuffle(stayovers.filter(s => !dnd.has(s.room))).slice(0, ri(1, 3))) chg(tm(10 * 60, 16 * 60), s, 'Мини-бар', m100(1200, 6500), ['Мини-бар — пополнение при уборке']);
  for (const s of shuffle(inhouse).slice(0, ri(0, 2))) { const from = after(s, 9 * 60), to = 19 * 60; if (from > to) continue; chg(tm(from, to), s, 'Прачечная', m100(2500, 9000), [pick(LAUNDRY)]); }

  for (const s of arrs) {
    if (s.ch === 'CORP' || s.ch === 'TA') continue;
    const n = s.d - s.a, ex = sumCh(s, s.ci);
    pay(s.ci, s, method(), n * s.rate + ex, [ex ? 'Оплата проживания, {0} ноч. + доп. услуги' : 'Оплата проживания, {0} ноч.', n]);
  }
  for (const s of deps) {
    if (s.ch === 'CORP') continue;
    const tot = sumCh(s, s.co);
    if (tot > 0) pay(s.co, s, method(), tot, ['Оплата доп. услуг при выезде']);
  }
  for (let i = 0, n = ri(0, 2); i < n; i++) pay(tm(10 * 60, 17 * 60), null, 'Безнал', ri(2, 6) * pick([22000, 29000, 39000]), ['Поступление на р/с по счёту № {0}', ri(118, 460)], pick(COMPANIES));
  const rc = deps.filter(s => s.ch !== 'CORP' && s.ch !== 'TA');
  if (rc.length && chance(.35)) { const s = pick(rc); push({ t: s.co + 2, k: 'refund', room: s.room, guest: s.guest, sid: s.id, method: 'Наличные', amount: s.rate, tx: ['Возврат за неиспользованную ночь (выезд на день раньше)'] }); }
  for (const s of stays.filter(s => s.st === 'cx')) push({ t: tm(8 * 60, 20 * 60), k: 'cancel', room: s.room, guest: s.guest, sid: s.id, tx: ['Отмена брони {0}: заезд {1}, {2} ноч., {3}', s.id, ddmm(addD(d0, s.a)), s.d - s.a, CH[s.ch].short] });
  stays.filter(s => s.st === 'ns').forEach((s, i) => push({ t: Math.min(23 * 60 + 59, 23 * 60 + 40 + i * 5), k: 'noshow', room: s.room, guest: s.guest, sid: s.id, tx: ['Гость не прибыл. Бронь {0} аннулирована', s.id] }));
  const T = 18 * 60 + 30;
  const cashBefore = PRICES.openingCash + sum(ev.filter(e => e.k === 'pay' && e.method === 'Наличные' && e.t < T).map(e => e.amount)) - sum(ev.filter(e => e.k === 'refund' && e.t < T).map(e => e.amount));
  if (chance(.8)) { const amt = Math.floor((cashBefore - 40000) / 10000) * 10000; if (amt >= 10000) push({ t: T, k: 'inkass', room: '', guest: 'Бухгалтерия', method: 'Наличные', amount: amt, tx: ['Инкассация: наличные сданы в бухгалтерию'] }); }
  ev.sort((x, y) => x.t - y.t || x.q - y.q);

  // статусы службы горничных и вечерний обход
  const occRooms = new Set(inhouse.map(s => s.room));
  const ooo0 = new Map(ooo.filter(o => o.a <= 0 && 0 < o.d).map(o => [o.room, o]));
  const hk = {};
  for (const r of ROOMS) {
    const no = r.no;
    if (ooo0.has(no)) hk[no] = { st: 'ooo', obh: 'Ремонт', note: ooo0.get(no).reason };
    else if (occRooms.has(no)) hk[no] = { st: dnd.has(no) ? 'dirty' : 'clean', dnd: dnd.has(no), obh: 'Занят' };
    else if (depRooms.has(no)) hk[no] = { st: wpick([['dirty', .25], ['clean', .3], ['insp', .45]]), obh: 'Свободен' };
    else hk[no] = { st: wpick([['insp', .8], ['clean', .2]]), obh: 'Свободен' };
  }
  const disc = [];
  const nD = ri(1, 3);
  const skipC = shuffle(stayovers.filter(s => !dnd.has(s.room)).map(s => s.room));
  const sleepC = shuffle(ROOMS.map(r => r.no).filter(no => !ooo0.has(no) && !occRooms.has(no)));
  for (let i = 0; i < nD; i++) {
    if (chance(.5) && skipC.length) { const no = skipC.pop(); Object.assign(hk[no], { obh: 'Свободен', note: 'Вещей нет, постель не тронута' }); disc.push(no); }
    else if (sleepC.length) { const no = sleepC.pop(); Object.assign(hk[no], { obh: 'Занят', st: 'dirty', note: 'В номере вещи гостя' }); disc.push(no); }
  }
  return { seed, dISO, ooo, stays, events: ev, hk, disc, dnd: [...dnd] };
}

const AB_ALIAS = { 'no-show': 'No-show', 'walk-in': 'Walk-in' };
let abRe = null;
function abRegex() {
  if (abRe) return abRe;
  const keys = Object.keys(pick2(GLOSS)).concat(Object.keys(AB_ALIAS)).sort((a, b) => b.length - a.length)
    .map(k => k.replace(/[.*+?^${}()|[\]\\/]/g, '\\$&'));
  abRe = new RegExp('(?<![\\p{L}\\d-])(' + keys.join('|') + ')(?![\\p{L}\\d-])', 'gu');
  return abRe;
}
const ab = (t, label) => '<span class="ab" data-ab="' + esc(AB_ALIAS[t] || t) + '">' + esc(label || t) + '</span>';
function abbrify(text) {
  text = String(text); let out = '', last = 0;
  for (const m of text.matchAll(abRegex())) { out += esc(text.slice(last, m.index)) + ab(m[0]); last = m.index + m[0].length; }
  return out + esc(text.slice(last));
}

    'NA.arr': { what: 'Сколько номеров заселилось сегодня, включая walk-in — гостей без брони.', where: 'Журнал смены: операции «Заезд». В шахматке — синие полосы с золотой меткой слева, которые начинаются в золотом столбце.', note: 'No-show и отменённые брони — не заезды.' },
    'NA.dep': { what: 'Сколько номеров выехало сегодня.', where: 'Журнал смены: операции «Выезд». В шахматке — серые полосы, которые заканчиваются в золотом столбце. В «Бронированиях» — статус «Выехал» и выезд сегодня.' },
    'NA.ns': { what: 'No-show — гость с бронью на сегодня не приехал, бронь аннулирована.', where: 'Журнал смены: операции «No-show». В шахматке — красные штрихованные полосы.' },
    'NA.cx': { what: 'Сколько броней отменили во время вашей смены — на любую дату заезда, не только на сегодня.', where: 'Журнал смены: операции «Отмена» (фильтр «Отмены и no-show»). В «Бронированиях» — статус «Отменена».', note: 'В шахматке отменённых броней нет.' },
    'NA.rev': { what: 'Выручка от проживания (Room Revenue) за ночь. Её начисляет ночной аудит: каждому занятому номеру — его тариф за ночь.', where: 'Тариф — в «Бронированиях» (столбец «Тариф/ночь») или в фолио гостя. Берите только брони «Проживает».', f: 'Выручка от проживания = сумма тарифов за ночь всех занятых номеров', note: 'Доп. услуги и оплаты сюда не входят. Предоплата за несколько ночей — тоже не выручка этой ночи.', ex: '26 000 + 34 000 + 22 000 + … = 588 000 ₸' },
    'NA.adr': { what: 'ADR (Average Daily Rate) — средний тариф: сколько в среднем принёс один занятый номер за ночь.', f: 'ADR = Выручка от проживания ÷ Занятые номера', ex: '588 000 ÷ 21 = 28 000 ₸. Округляйте до целого тенге.' },
    'NA.revpar': { what: 'RevPAR (Revenue Per Available Room) — выручка на один номер к продаже. Показывает, сколько отель заработал с каждого номера, который мог продать.', f: 'RevPAR = Выручка от проживания ÷ Номера к продаже<br>Проверка: RevPAR = ADR × Загрузка', ex: '588 000 ÷ 28 = 21 000 ₸ (28 000 × 0,75 = 21 000)' },
    'HK.depc': { what: 'Выездная уборка (departure clean) — полная уборка после выезда гостя: смена белья и полотенец, проверка мини-бара.', where: 'Номера, из которых сегодня выехали гости: журнал смены — операции «Выезд». Это то же число, что строка 08 отчёта ФО-1.' },
    'HK.stay': { what: 'Текущая уборка (stayover) — гость жил прошлую ночь и остаётся ещё на ночь.', where: '«Бронирования»: статус «Проживает» и дата заезда раньше сегодняшней. В шахматке — синие полосы, которые начались до золотого столбца и идут дальше пунктира.', note: 'Номера, заселённые сегодня, не считаются: их подготовили к заезду.' },
    'HK.todo': { what: 'Сколько текущих уборок горничные выполнят на самом деле.', where: 'Номера с DND (Do Not Disturb — «Не беспокоить») — во вкладке «Статусы номеров», чёрная метка DND.', f: 'К выполнению = Текущие уборки всего − номера с DND', ex: '16 − 2 = 14' },
    'HK.min': { what: 'Сколько минут работы нужно на все уборки. Нормы — в «Справочнике».', f: 'Трудозатраты = Выездные × 45 + Текущие к выполнению × 25', ex: '6 × 45 + 14 × 25 = 270 + 350 = 620 мин' },
    'HK.maids': { what: 'Сколько горничных вывести на смену. У одной горничной 420 минут на уборку.', f: 'Горничные = Трудозатраты ÷ 420, округлить ВВЕРХ до целого', ex: '620 ÷ 420 = 1,48 → 2 горничные' },
    'HK.ready': { what: 'Номера, которые можно сразу продать гостю без брони: свободны на ночь и проверены супервайзером.', where: 'Сначала по шахматке найдите номера, свободные на ночь (без ремонта). Затем во вкладке «Статусы номеров» отберите среди них статус «Проверен» (зелёный).', note: 'Номер, где по шахматке живёт гость, не считается, даже если он «Проверен».' },
    'HK.disc': { what: 'Расхождение — шахматка и горничная видят номер по-разному. Скиппер (skipper): по шахматке номер занят, а на обходе «Свободен» — гость мог уехать, не оформив выезд. Слипер (sleeper): по шахматке свободен, а на обходе «Занят» — выезд не оформлен или гость живёт без регистрации.', where: 'Для каждого номера сравните: занят ли он на ночь в шахматке и что написано в строке «Обход 21:00» во вкладке «Статусы номеров». Номера в ремонте не сверяются.', note: 'Ответ — номера через запятую. 2 балла за полный ответ, 1 балл — если ошибка в одном номере.', ex: '305, 412' },
    'SL.fnb': { what: 'F&B (Food & Beverage, «еда и напитки») — выручка питания за сутки.', where: 'Журнал смены, фильтр «Начисления»: строки со статьёй «Завтрак», «Ресторан», «Мини-бар». То же видно в фолио каждого гостя.', f: 'F&B = Завтраки + Ресторан + Мини-бар', note: 'Считайте начисления, а не оплаты. Ресторан «оплачено на месте» входит один раз.' },
    'SL.oth': { what: 'Выручка от остальных услуг отеля.', where: 'Журнал смены, фильтр «Начисления»: статьи «Прачечная», «Трансфер», «Ранний заезд», «Поздний выезд».', f: 'Прочие = Прачечная + Трансфер + Ранний заезд + Поздний выезд' },
    'SL.tot': { what: 'Вся выручка отеля за сутки.', f: 'Общая выручка = Выручка от проживания (ФО-1, строка 11) + F&B + Прочие', ex: '588 000 + 96 500 + 31 000 = 715 500 ₸' },
    'SL.rshare': { what: 'Какую часть выручки дало проживание.', f: 'Доля проживания, % = Выручка от проживания ÷ Общая выручка × 100', ex: '588 000 ÷ 715 500 × 100 = 82,2 %' },
    'SL.otan': { what: 'OTA (Online Travel Agency) — онлайн-агентство, здесь Booking.com. Сколько занятых на ночь номеров продано через него.', where: '«Бронирования»: статус «Проживает» и канал «OTA».' },
    'SL.otarev': { what: 'Выручка от проживания только по броням OTA.', where: 'Те же брони, что в строке 05.', f: 'Выручка OTA = сумма тарифов за ночь занятых номеров с каналом OTA', ex: '26 000 + 34 000 + 26 000 + 46 000 = 132 000 ₸' },
    'SL.otacom': { what: 'Сколько отель должен заплатить OTA за проданные ночи. Ставка — 15% (см. «Справочник»).', f: 'Комиссия = Выручка OTA × 0,15', ex: '132 000 × 0,15 = 19 800 ₸' },
    'SL.otashare': { what: 'Насколько отель зависит от OTA.', f: 'Доля OTA, % = Выручка OTA ÷ Выручка от проживания × 100', ex: '132 000 ÷ 588 000 × 100 = 22,4 %' },
    'CS.cash': { what: 'Все оплаты наличными за смену.', where: 'Журнал смены, фильтр «Оплаты и касса»: операции «Оплата» со способом «Наличные».', note: 'Возвраты и инкассацию здесь не вычитайте — для них отдельные строки.' },
    'CS.card': { what: 'Оплаты банковскими картами через терминал.', where: 'Журнал смены: операции «Оплата» со способом «Карта».' },
    'CS.kaspi': { what: 'Kaspi QR — оплата через приложение банка по QR-коду. Это безнал: деньги идут на счёт, а не в кассу.', where: 'Журнал смены: операции «Оплата» со способом «Kaspi QR».' },
    'CS.bank': { what: 'Переводы от компаний на р/с (расчётный счёт) отеля по выставленным счетам.', where: 'Журнал смены: операции «Оплата» со способом «Безнал».' },
    'CS.total': { what: 'Все деньги, полученные за смену любым способом.', f: 'Итого оплат = Наличные + Карта + Kaspi QR + Безнал', note: 'Возвраты не вычитаются.' },
    'CS.refund': { what: 'Деньги, которые вернули гостям из кассы.', where: 'Журнал смены: операции «Возврат».' },
    'CS.inkass': { what: 'Инкассация — администратор сдаёт часть наличных из кассы в бухгалтерию.', where: 'Журнал смены: операции «Инкассация».' },
    'CS.endcash': { what: 'Сколько наличных должно лежать в кассе при сдаче смены.', f: 'Остаток = Размен (50 000) + Оплаты наличными − Возвраты наличными − Инкассация', note: 'Карта, Kaspi QR и безнал в кассу наличными не попадают.', ex: '50 000 + 132 000 − 26 000 − 100 000 = 56 000 ₸' }
  },
  kz: {
    'NA.ooo': { what: 'Бизнес-күннен ертеңге қараған түні жөндеудегі нөмірлер (OOO — Out of Order, «істен шыққан»). Оларды сатуға болмайды.', where: 'Шахматка: түнгі алтын пунктирді қиып өтетін қараңғы штрихталған «Жөндеу» жолақтары. Немесе «Нөмірлер мәртебесі» қойындысы — «Жөндеу» мәртебесі.', ex: 'Пунктирді 2 «Жөндеу» жолағы қиып өтеді → 2.' },
    'NA.avail': { what: 'Қонақүй осы түнге нақты сата алатын нөмірлер саны.', f: 'Сатуға арналған нөмірлер = Нөмір қоры (30) − OOO', ex: '30 − 2 = 28' },
    'NA.occ': { what: 'Қонақтар бизнес-күннен ертеңге қараған түні түнейтін нөмірлер (сатылған нөмірлер).', where: 'Шахматка: алтын пунктирді қиып өтетін көк тұтас жолақтар (соның ішінде «бүгін келді» алтын белгісі барлары). Тексеру: «Брондаулар» қойындысында бұл — «Тұрып жатыр» мәртебесіндегі барлық брондар.', note: 'Есептелмейді: No-show, «Кетті», «Бронь» (ашық түсті жолақтар), «Жөндеу».', ex: 'Пунктирді 21 көк жолақ қиып өтеді → 21.' },
    'NA.vac': { what: 'Осы түні ешкім тұрмайтын сатуға арналған нөмірлер.', f: 'Бос нөмірлер = Сатуға арналған нөмірлер − Бос емес нөмірлер', ex: '28 − 21 = 7' },
    'NA.pct': { what: 'Толымдылық (Occupancy) — сатуға арналған нөмірлердің ішіндегі сатылған нөмірлердің үлесі.', f: 'Толымдылық, % = Бос емес нөмірлер ÷ Сатуға арналған нөмірлер × 100', ex: '21 ÷ 28 × 100 = 75,0 %. 0,1-ге дейін дөңгелектеңіз.' },
    'NA.pax': { what: 'Қонақүйде қанша адам түнейді: ересектер мен балалар.', where: '«Брондаулар», «Тұрып жатыр» брондарының «Қонақтар» бағаны. 2+1 жазбасы — 2 ересек және 1 бала = 3 адам.', f: 'Қонақтар = барлық бос емес нөмірлер бойынша (ересектер + балалар) сомасы', ex: '2 + 3 + 1 + 2 + … = 38' },
    'NA.arr': { what: 'Бүгін қанша нөмір орналасты, walk-in — брондаусыз қонақтарды қоса алғанда.', where: 'Ауысым журналы: «Келу» операциялары. Шахматкада — алтын бағаннан басталатын, сол жағында алтын белгісі бар көк жолақтар.', note: 'No-show және жойылған брондар келуге жатпайды.' },
    'NA.dep': { what: 'Бүгін қанша нөмір кетті.', where: 'Ауысым журналы: «Кету» операциялары. Шахматкада — алтын бағанда аяқталатын сұр жолақтар. «Брондауларда» — «Кетті» мәртебесі және кету күні бүгін.' },
    'NA.ns': { what: 'No-show — бүгінге броны бар қонақ келмеді, брондау жойылды.', where: 'Ауысым журналы: «No-show» операциялары. Шахматкада — қызыл штрихталған жолақтар.' },
    'NA.cx': { what: 'Сіздің ауысымыңыз кезінде қанша брондаудан бас тартылды — тек бүгінгі емес, кез келген келу күніне.', where: 'Ауысым журналы: «Бас тарту» операциялары («Бас тартулар және no-show» сүзгісі). «Брондауларда» — «Жойылды» мәртебесі.', note: 'Шахматкада жойылған брондар көрсетілмейді.' },
    'NA.rev': { what: 'Түнгі тұрудан түсім (Room Revenue). Оны түнгі аудит есептейді: әр бос емес нөмірге — оның түнгі тарифі.', where: 'Тариф — «Брондауларда» («Тариф/түн» бағаны) немесе қонақтың фолиосында. Тек «Тұрып жатыр» брондарын алыңыз.', f: 'Тұрудан түсім = барлық бос емес нөмірлердің түнгі тарифтерінің сомасы', note: 'Қосымша қызметтер мен төлемдер бұған кірмейді. Бірнеше түнге алдын ала төлем де осы түннің түсімі емес.', ex: '26 000 + 34 000 + 22 000 + … = 588 000 ₸' },
    'NA.adr': { what: 'ADR (Average Daily Rate) — орташа тариф: бір бос емес нөмір бір түнде орта есеппен қанша түсім әкелді.', f: 'ADR = Тұрудан түсім ÷ Бос емес нөмірлер', ex: '588 000 ÷ 21 = 28 000 ₸. Бүтін теңгеге дейін дөңгелектеңіз.' },
    'NA.revpar': { what: 'RevPAR (Revenue Per Available Room) — сатуға арналған бір нөмірге шаққандағы түсім. Қонақүй сата алатын әр нөмірден қанша тапқанын көрсетеді.', f: 'RevPAR = Тұрудан түсім ÷ Сатуға арналған нөмірлер<br>Тексеру: RevPAR = ADR × Толымдылық', ex: '588 000 ÷ 28 = 21 000 ₸ (28 000 × 0,75 = 21 000)' },
    'HK.depc': { what: 'Кетуден кейінгі жинау (departure clean) — қонақ кеткеннен кейінгі толық жинау: төсек жабдықтары мен сүлгілерді ауыстыру, мини-барды тексеру.', where: 'Бүгін қонақтар кеткен нөмірлер: ауысым журналы — «Кету» операциялары. Бұл ФО-1 есебінің 08-жолындағы сан.' },
    'HK.stay': { what: 'Ағымдағы жинау (stayover) — қонақ өткен түні тұрды және тағы бір түнге қалады.', where: '«Брондаулар»: «Тұрып жатыр» мәртебесі және келу күні бүгіннен ерте. Шахматкада — алтын бағанға дейін басталып, пунктирден әрі өтетін көк жолақтар.', note: 'Бүгін орналасқан нөмірлер есептелмейді: олар келуге дайындалған.' },
    'HK.todo': { what: 'Бөлме күтушілері нақты қанша ағымдағы жинау орындайды.', where: 'DND (Do Not Disturb — «Мазаламаңыз») белгісі бар нөмірлер — «Нөмірлер мәртебесі» қойындысында, қара DND белгісі.', f: 'Орындалатын жинаулар = Ағымдағы жинаулар барлығы − DND нөмірлері', ex: '16 − 2 = 14' },
    'HK.min': { what: 'Барлық жинауға қанша минут жұмыс керек. Нормалар — «Анықтамалықта».', f: 'Еңбек шығыны = Кетуден кейінгі жинаулар × 45 + Орындалатын ағымдағы жинаулар × 25', ex: '6 × 45 + 14 × 25 = 270 + 350 = 620 мин' },

/* ================= проверка ответов ================= */
function computeAnswers(sc) {
  const S = sc.stays, cov = (s, k) => s.a <= k && k < s.d;
  const oooN = k => sc.ooo.filter(o => o.a <= k && k < o.d).length;
  const occ0 = S.filter(s => s.st === 'in' && cov(s, 0));
  const ooo0 = oooN(0), avail = ROOMS.length - ooo0, occ = occ0.length, rev = sum(occ0.map(s => s.rate));
  const ev = sc.events, ch = ev.filter(e => e.k === 'charge');
  const fnb = sum(ch.filter(e => FNB.includes(e.cat)).map(e => e.amount));
  const oth = sum(ch.filter(e => !FNB.includes(e.cat)).map(e => e.amount));
  const tot = rev + fnb + oth;
  const ota = occ0.filter(s => s.ch === 'OTA'), otarev = sum(ota.map(s => s.rate));
  const pays = ev.filter(e => e.k === 'pay'), by = m => sum(pays.filter(e => e.method === m).map(e => e.amount));
  const cash = by('Наличные'), card = by('Карта'), kaspi = by('Kaspi QR'), bank = by('Безнал');
  const refund = sum(ev.filter(e => e.k === 'refund').map(e => e.amount));
  const inkass = sum(ev.filter(e => e.k === 'inkass').map(e => e.amount));
  const stay = S.filter(s => s.st === 'in' && s.a < 0 && s.d > 0).length;
  const depc = S.filter(s => s.st === 'out' && s.d === 0).length;
  const todo = stay - sc.dnd.length, min = depc * PRICES.cleanDep + todo * PRICES.cleanStay;
  const occRooms = new Set(occ0.map(s => s.room));
  const oooRooms = new Set(sc.ooo.filter(o => o.a <= 0 && 0 < o.d).map(o => o.room));
  const ready = ROOMS.filter(r => !occRooms.has(r.no) && !oooRooms.has(r.no) && sc.hk[r.no].st === 'insp').length;
  return {
    'NA.ooo': ooo0, 'NA.avail': avail, 'NA.occ': occ, 'NA.vac': avail - occ, 'NA.pct': occ / avail * 100,
    'NA.pax': sum(occ0.map(s => s.ad + s.chd)), 'NA.arr': S.filter(s => s.st === 'in' && s.a === 0).length,
    'NA.dep': depc, 'NA.ns': S.filter(s => s.st === 'ns').length, 'NA.cx': S.filter(s => s.st === 'cx').length,
    'NA.rev': rev, 'NA.adr': occ ? rev / occ : 0, 'NA.revpar': rev / avail,
    'HK.depc': depc, 'HK.stay': stay, 'HK.todo': todo, 'HK.min': min, 'HK.maids': Math.ceil(min / PRICES.maidMin), 'HK.ready': ready, 'HK.disc': sc.disc.slice().sort(),
    'SL.fnb': fnb, 'SL.oth': oth, 'SL.tot': tot, 'SL.rshare': tot ? rev / tot * 100 : 0, 'SL.otan': ota.length, 'SL.otarev': otarev,
    'SL.otacom': otarev * PRICES.otaComm, 'SL.otashare': rev ? otarev / rev * 100 : 0,
    'CS.cash': cash, 'CS.card': card, 'CS.kaspi': kaspi, 'CS.bank': bank, 'CS.total': cash + card + kaspi + bank,
    'CS.refund': refund, 'CS.inkass': inkass, 'CS.endcash': PRICES.openingCash + cash - refund - inkass
  };
}
function parseNum(s) {
  const t = String(s || '').toLowerCase().replace(/[\s  ]/g, '').replace(/₸|тенге|теңге|тг\.?|%|мин\.?|чел\.?|адам|ном\.?|нөм\.?|брон\.?/g, '').replace(',', '.');
  if (!/^-?\d+(\.\d+)?$/.test(t)) return NaN;
  return parseFloat(t);
}
const parseList = s => [...new Set(String(s || '').match(/\d{3}/g) || [])];
function checkField(f, given, exp) {
  const max = f.pts || 1;
  if (f.type === 'list') {
    const G = parseList(given), E = exp.map(String);
    if (!G.length) return 0;
    const hit = G.filter(x => E.includes(x)).length, wrong = G.length - hit, miss = E.length - hit;
    if (!wrong && !miss) return max;
    return hit > 0 && wrong + miss <= 1 ? 1 : 0;
  }
  const g = parseNum(given);
  if (isNaN(g)) return 0;
  const tol = f.type === 'money' ? 1.0001 : f.type === 'pct' ? 0.0601 : 0.0001;
  return Math.abs(g - exp) <= tol ? max : 0;
}
const fmtExp = (f, e) => f.type === 'money' ? fmtMoney(e) : f.type === 'pct' ? fmtPct(e) : f.type === 'list' ? (e.length ? e.join(', ') : L('нет')) : String(e);
const markOf = p => p >= 90 ? [5, 'отлично'] : p >= 75 ? [4, 'хорошо'] : p >= 50 ? [3, 'удовлетворительно'] : [2, 'неудовлетворительно'];

function gradeAll(sc, answers, mods) {
  const E = computeAnswers(sc);
  const reps = []; let score = 0, max = 0;
  for (const r of REPORTS) {
    if (!mods.includes(r.key)) continue;
    const items = r.fields.map((f, i) => {
      const id = r.key + '.' + f.id;
      return { id, code: pad(i + 1), label: L(f.label), given: answers[id] || '', exp: fmtExp(f, E[id]), pts: checkField(f, answers[id], E[id]), max: f.pts || 1 };
    });
    const s = sum(items.map(x => x.pts)), m = sum(items.map(x => x.max));
    reps.push({ key: r.key, name: L(r.name), score: s, max: m, items });
    score += s; max += m;
  }
  const pct = max ? Math.round(score / max * 1000) / 10 : 0;
  const [mark, word] = markOf(pct);
  return { reps, score, max, pct, mark, word: L(word) };
}

/* ================= код результата ================= */
const SALT = 'sapar-fo-v1';
function fnv(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); } return (h >>> 0).toString(36); }
function b64e(str) { const b = new TextEncoder().encode(str); let s = ''; for (const x of b) s += String.fromCharCode(x); return btoa(s).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, ''); }
function b64d(s) { s = s.replace(/-/g, '+').replace(/_/g, '/'); while (s.length % 4) s += '='; const bin = atob(s); return new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0))); }
function makeCode(st) {
  const p = [1, st.student.last, st.student.first, st.student.group, st.seed, st.dISO, st.mods, st.genAt, st.submitAt, st.regen, fieldIds(st.mods).map(id => st.answers[id] || '')];
  const body = b64e(JSON.stringify(p));
  return 'SPR1.' + body + '.' + fnv(SALT + body);
}
function decodeCode(code) {
  const m = /^SPR1\.([A-Za-z0-9_-]+)\.([0-9a-z]+)$/.exec(code);
  if (!m) return { err: L('неверный формат кода') };
  if (fnv(SALT + m[1]) !== m[2]) return { err: L('код изменён или скопирован не полностью') };
  let p; try { p = JSON.parse(b64d(m[1])); } catch (e) { return { err: L('код повреждён') }; }
  const [, last, first, group, seed, dISO, mods, genAt, subAt, regen, arr] = p;
  const answers = {}; fieldIds(mods).forEach((id, i) => { answers[id] = arr[i] || ''; });
  const g = gradeAll(buildScenario(seed, dISO), answers, mods);
  return { code, last, first, group, seed, dISO, mods, genAt, subAt, regen, g };
}

function rackHTML(o) {
  const small = isSmall();
  const CW = small ? 46 : 58, RH = small ? 30 : 32, LBL = small ? 70 : 90, S = o.S, N = o.N, W = N * CW, d0 = o.d0, tag = o.live ? 'button' : 'span';
  let head = '', cols = '';
  for (let i = 0; i < N; i++) {
    const k = S + i, dt = addD(d0, k), wd = dt.getDay(), cls = (k === 0 ? ' is-today' : '') + ((wd === 0 || wd === 6) ? ' is-we' : '');
    head += '<div class="rk-day' + cls + '"><span class="wd">' + WD(wd) + '</span><span class="dm">' + ddmm(dt) + '</span></div>';
    cols += '<div class="rk-col' + cls + '"></div>';
  }
  const place = (a, d) => { let x0 = (a - S + .5) * CW, x1 = (d - S + .5) * CW; const cl = x0 < 0, cr = x1 > W; x0 = Math.max(0, x0); x1 = Math.min(W, x1); return x1 - x0 < 6 ? null : { x0, x1, cl, cr }; };
  const style = p => ' style="left:' + (p.x0 + 1) + 'px;width:' + (p.x1 - p.x0 - 3) + 'px"';
  const cut = p => (p.cl ? ' cl' : '') + (p.cr ? ' cr' : '');
  const bars = no => {
    let out = '';
    o.ooo.forEach((x, i) => { if (x.room !== no) return; const p = place(x.a, x.d); if (p) out += '<' + tag + ' class="bar st-ooo' + cut(p) + '"' + style(p) + (o.live ? ' data-act="ooo" data-i="' + i + '" title="' + esc(L('Ремонт') + ': ' + L(x.reason)) + '"' : '') + '>' + L('Ремонт') + '</' + tag + '>'; });
    for (const s of o.stays) {
      if (s.room !== no || s.st === 'cx') continue;
      const p = place(s.a, s.d); if (!p) continue;
      const arr = s.a === 0 && s.st === 'in';
      const tip = (s.guest || s.short) + ' · ' + ddmm(addD(d0, s.a)) + '–' + ddmm(addD(d0, s.d)) + ' · ' + L(ST[s.st][0]) + ' · ' + L('нажмите: бронь и фолио');
      out += '<' + tag + ' class="bar st-' + s.st + (arr ? ' arr' : '') + cut(p) + '"' + style(p) + (o.live ? ' data-act="bk" data-sid="' + s.id + '" title="' + esc(tip) + '"' : '') + '>' + (s.st === 'ns' ? 'No-show · ' : '') + esc(s.short) + '</' + tag + '>';
    }
    return out;
  };
  const row = r => '<div class="rk-row"><div class="rk-room"><b>' + r.no + '</b>' + ab(r.cat) + '</div><div class="rk-track" style="width:' + W + 'px">' + bars(r.no) + '</div></div>';
  let rows = '';
  if (o.floors) for (const f of [2, 3, 4, 5]) { rows += '<div class="rk-floor"><span>' + L('{0} этаж', f) + '</span></div>'; rows += o.rooms.filter(r => r.floor === f).map(row).join(''); }
  else rows = o.rooms.map(row).join('');
  return '<div class="rk-wrap"><div class="rk" style="--cw:' + CW + 'px;--rh:' + RH + 'px;--lbl:' + LBL + 'px"><div class="rk-head"><div class="rk-corner">' + L('Номер') + '</div>' + head + '</div><div class="rk-body"><div class="rk-cols">' + cols + '</div>' + rows +
    '<div class="rk-night" style="left:' + (LBL + (1 - S) * CW - 1) + 'px" title="' + L('Ночь аудита: с бизнес-даты на завтра') + '"></div></div></div></div>';
}

/* ---------- правая панель: отчёты ---------- */
function progress() {
  const by = {}; let f = 0, t = 0;
  for (const k of state.mods) {
    const r = REP[k];
    const ff = r.fields.filter(x => String(state.answers[k + '.' + x.id] || '').trim() !== '').length;
    by[k] = { f: ff, t: r.fields.length }; f += ff; t += r.fields.length;
  }
  return { by, filled: f, total: t };
}
function viewRight() {
  if (state.submitted && sc) return '<div class="pane-body">' + viewResult() + '</div>';
  const p = progress();
  if (!state.mods.includes(state.tabR)) state.tabR = state.mods[0];
  const head = '<div class="rp-head"><div class="rp-title"><h2>' + L('Отчёты смены') + '</h2><span class="prog" id="progAll">' + (sc ? L('Заполнено {0} из {1}', p.filled, p.total) : '') + '</span></div>' +
    '<div class="tabs rtabs" role="tablist" aria-label="' + L('Отчёты') + '">' + state.mods.map(k => '<button class="tab' + (p.by[k].f === p.by[k].t ? ' done' : '') + '" role="tab" aria-selected="' + (k === state.tabR) + '" data-act="tabR" data-tab="' + k + '">' + L(REP[k].tab) + '<span class="cnt" data-cnt="' + k + '">' + p.by[k].f + '/' + p.by[k].t + '</span></button>').join('') + '</div></div>';
  if (!sc) return head + '<div class="pane-body"><div class="rp-wait"><p class="small muted">' + L('Бланки откроются после генерации дня. В задании:') + '</p>' + state.mods.map(k => '<div class="wi"><b>' + L(REP[k].form) + ' · ' + L(REP[k].title) + '</b><span>' + L('{0} показателей — {1}', REP[k].fields.length, esc(L(REP[k].about))) + '</span></div>').join('') + '</div></div>';
  return head + '<div class="pane-body">' + viewForm(state.tabR) +
    '<div class="rp-foot"><p>' + L('Ответы сохраняются автоматически. Пустое поле при сдаче считается ошибкой.') + '</p><button class="btn btn-primary" data-act="submit">' + L('Сдать смену') + '</button></div></div>';
}
function viewForm(key) {
  const r = REP[key], d = dOf(sc.dISO);
  const hd = '<div class="form-hd"><span class="form-code">' + L(r.form) + ' · ' + L('за {0}', ddmmyyyy(d)) + '</span><h3>' + L(r.title) + '</h3><p>' + abbrify(r.desc(d)) + '</p></div>';
  const inp = (id, f, extra) => '<input id="f-' + id.replace('.', '-') + '" data-ans="' + id + '" inputmode="' + (f.type === 'list' ? 'numeric' : 'decimal') + '" autocomplete="off" spellcheck="false" value="' + esc(state.answers[id] || '') + '"' + (extra || '') + '>';
  return '<div class="form">' + hd + '<div class="form-body">' + r.fields.map((f, i) => {
    const id = key + '.' + f.id, wide = f.type === 'list', label = L(f.label);
    return '<div class="fr' + (wide ? ' wide' : '') + '"><span class="fr-code">' + pad(i + 1) + '</span><label class="fr-label" for="f-' + key + '-' + f.id + '">' + abbrify(label) +
      '<button type="button" class="qh" data-help="' + id + '" aria-expanded="false" aria-label="' + esc(L('Как считать: {0}', label)) + '">?</button>' +
      (f.pts ? '<span class="pts2">' + L('{0} балла', f.pts) + '</span>' : '') + (f.hint ? '<small>' + abbrify(L(f.hint)) + '</small>' : '') + '</label>' +
      '<div class="fr-in">' + inp(id, f, wide ? ' placeholder="' + L('например, 204, 312') + '"' : '') + (wide ? '' : '<span class="unit">' + L(f.unit) + '</span>') + '</div></div>';
  }).join('') + '</div></div><p class="form-tip">' + L('Наведите на {0} или нажмите на него — формула, где взять данные и пример. Подробнее — во вкладке «Обучение».', '<span class="qh qh-static">?</span>') + '</p>';
}
function updateProgress() {
  const p = progress(), a = $('#progAll');
  if (a) a.textContent = L('Заполнено {0} из {1}', p.filled, p.total);
  const mc = $('#mnavCnt'); if (mc) mc.textContent = p.filled + '/' + p.total;
  for (const k of state.mods) { const el = document.querySelector('[data-cnt="' + k + '"]'); if (el) { el.textContent = p.by[k].f + '/' + p.by[k].t; el.closest('.tab').classList.toggle('done', p.by[k].f === p.by[k].t); } }
}

/* ---------- результат ---------- */
function resultMessage(g, code) {
  const s = state.student;
  return L('Учебная шахматка — результат смены') + '\n' +
    L('Студент: {0}, группа {1}', s.last + ' ' + s.first, s.group) + '\n' +
    L('Вариант {0}, бизнес-дата {1}', state.seed, ddmmyyyy(dOf(state.dISO))) + '\n' +
    L('Результат: {0} из {1} баллов ({2} %), оценка {3}', g.score, g.max, String(g.pct).replace('.', ','), g.mark) + '\n' +
    g.reps.map(r => r.name + ' ' + r.score + '/' + r.max).join('; ') + '\n' +
    L('Код проверки') + ': ' + code;
}
function reviewTables(g, openAll) {
  return g.reps.map(r => '<details class="rv"' + (openAll ? ' open' : '') + '><summary><span>' + esc(r.name) + '</span><span class="mono">' + L('{0} из {1}', r.score, r.max) + '</span></summary><table>' +
    r.items.map(x => { const ok = x.pts === x.max, part = x.pts > 0 && !ok;
      return '<tr><td class="mono muted" style="width:30px">' + x.code + '</td><td>' + esc(x.label) + '</td><td class="ans"><span class="' + (ok ? 'ok' : part ? '' : 'bad') + '">' + (x.given.trim() ? esc(x.given) : '—') + '</span>' + (ok ? '' : '<br><span class="exp">' + L('верно') + ': ' + esc(x.exp) + '</span>') + '</td><td class="mk ' + (ok ? 'ok' : 'bad') + '">' + (ok ? '✓' : part ? '½' : '✗') + '</td></tr>'; }).join('') +
    '</table></details>').join('');
}
function viewResult() {
  const g = gradeAll(sc, state.answers, state.mods), code = makeCode(state), s = state.student;
  return '<div class="res">' +
    '<div class="res-hero"><span class="eyebrow">' + L('Смена сдана') + ' · ' + stamp(state.submitAt) + '</span>' +
      '<div class="res-score"><span class="big">' + g.score + '</span><span class="of">' + L('из {0} баллов', g.max) + ' · ' + String(g.pct).replace('.', ',') + ' %</span></div>' +
      '<span class="mark mk-' + g.mark + '">' + L('Оценка {0} — {1}', g.mark, g.word) + '</span>' +
      '<span class="res-who">' + esc(s.last + ' ' + s.first) + ' · ' + L('группа') + ' ' + esc(s.group) + ' · ' + L('вариант') + ' ' + state.seed + ' · ' + L('время работы') + ' ' + dur(state.submitAt - state.genAt) + '</span></div>' +
    '<div class="reps">' + g.reps.map(r => '<div class="rep-row"><b>' + esc(r.name) + '</b><span class="mono">' + r.score + '/' + r.max + '</span><span class="meter"><i style="width:' + (r.max ? r.score / r.max * 100 : 0) + '%"></i></span></div>').join('') + '</div>' +
    '<div class="res-code">' + (LIVE ? '<h3>' + L('Результат уже у преподавателя') + '</h3><p>' + L('Он передан автоматически. Сообщение с кодом ниже — запасной вариант, если связь пропала.') + '</p>'
      : '<h3>' + L('Отправьте результат преподавателю') + '</h3><p>' + L('Скопируйте сообщение целиком и отправьте преподавателю. Код внутри позволяет перепроверить вашу работу.') + '</p>') +
      '<textarea class="cpy" id="resMsg" readonly aria-label="' + L('Сообщение с результатом') + '">' + esc(resultMessage(g, code)) + '</textarea>' +
      '<button class="btn btn-primary" data-act="copyres">' + ICON.copy + L('Скопировать сообщение') + '</button></div>' +
    '<h3>' + L('Разбор ответов') + '</h3><p class="small muted">' + L('Слева данные смены остаются открытыми — сверяйтесь с шахматкой и журналом, чтобы найти ошибку.') + '</p>' + reviewTables(g, false) +

function teacherCheck() {
  const txt = $('#tIn').value, codes = [...new Set(txt.match(/SPR1\.[A-Za-z0-9_-]+\.[0-9a-z]+/g) || [])];
  if (!codes.length) { tMsg = { cls: 'badc', text: L('Код не найден. Вставьте сообщение студента целиком, вместе со строкой «Код проверки».') }; return render(); }
  let added = 0, dup = 0; const errs = [];
  for (const c of codes) {
    const r = decodeCode(c);
    if (r.err) { errs.push(r.err); continue; }
    const chk = c.slice(c.lastIndexOf('.') + 1) + ':' + c.length;
    if (journal.some(e => e.chk === chk)) { dup++; continue; }
    journal.push({ chk, code: c, last: r.last, first: r.first, group: r.group, seed: r.seed, dISO: r.dISO, subAt: r.subAt, regen: r.regen, min: Math.round((r.subAt - r.genAt) / 60000),
      score: r.g.score, max: r.g.max, pct: r.g.pct, mark: r.g.mark, reps: r.g.reps.map(x => ({ key: x.key, score: x.score, max: x.max })) });
    added++;
  }
  lsSet(LS_JOURNAL, journal);
  const parts = [];
  if (added) parts.push(L('Добавлено: {0}', added));
  if (dup) parts.push(L('уже в журнале: {0}', dup));
  if (errs.length) parts.push(L('не прошли проверку: {0} ({1})', errs.length, errs[0]));
  tMsg = { cls: errs.length && !added ? 'badc' : 'okc', text: parts.join(', ') + '.' };
  render();
  if (added && !errs.length) { const t = $('#tIn'); if (t) t.value = ''; }
}
function teacherTSV() {
  const head = [L('Фамилия'), L('Имя'), L('Группа'), L('Сдано'), L('Вариант'), ...REPORTS.map(r => L(r.name)), L('Баллы'), L('Максимум'), '%', L('Оценка'), L('Минут'), L('Перегенераций')];
  const lines = journal.map(e => [e.last, e.first, e.group, stamp(e.subAt), e.seed, ...REPORTS.map(r => { const x = e.reps.find(y => y.key === r.key); return x ? x.score + '/' + x.max : ''; }), e.score, e.max, String(e.pct).replace('.', ','), e.mark, e.min, e.regen].join('\t'));
  return [head.join('\t'), ...lines].join('\n');
}

const tip = document.getElementById('tip');
let tipPin = null;
function tipContent(el) {
  if (el.dataset.help) return helpHTML(el.dataset.help);
  const g = pick2(GLOSS)[el.dataset.ab] || GLOSS.ru[el.dataset.ab]; if (!g) return '';
  return '<h4>' + esc(el.dataset.ab) + (g[0] !== el.dataset.ab ? ' — ' + esc(g[0]) : '') + '</h4><p>' + esc(g[1]) + '</p>';
}
function showTip(el) {
  const html = tipContent(el); if (!html) return;
  tip.innerHTML = html; tip.hidden = false;
  const r = el.getBoundingClientRect(), tw = tip.offsetWidth, th = tip.offsetHeight, vw = window.innerWidth, vh = window.innerHeight;
  const x = Math.max(8, Math.min(r.left + r.width / 2 - tw / 2, vw - tw - 8));
  let y = r.bottom + 8;
  if (y + th > vh - 8) y = r.top - th - 8 >= 8 ? r.top - th - 8 : Math.max(8, vh - th - 8);
  tip.style.left = x + 'px'; tip.style.top = y + 'px';
}
function hideTip() {
  tip.hidden = true; tip.classList.remove('pinned');
  if (tipPin && tipPin.dataset.help) tipPin.setAttribute('aria-expanded', 'false');
  tipPin = null;
}
const tipTarget = e => e.target && e.target.closest ? e.target.closest('[data-help],[data-ab]') : null;
document.addEventListener('mouseover', e => { if (tipPin) return; const el = tipTarget(e); if (el) showTip(el); });
document.addEventListener('mouseout', e => { if (tipPin) return; const el = tipTarget(e); if (el && !el.contains(e.relatedTarget)) tip.hidden = true; });
document.addEventListener('focusin', e => { if (tipPin) return; const el = tipTarget(e); if (el) showTip(el); else tip.hidden = true; });
document.addEventListener('scroll', e => { if (e.target !== tip && !tip.hidden) hideTip(); }, true);
document.addEventListener('click', e => {
  const el = tipTarget(e);
  if (el) {
    e.preventDefault(); e.stopImmediatePropagation();
    if (tipPin === el) { hideTip(); return; }
    hideTip(); tipPin = el; showTip(el); tip.classList.add('pinned');
    if (el.dataset.help) el.setAttribute('aria-expanded', 'true');
    return;
  }
  if (tipPin && !tip.contains(e.target)) hideTip();
}, true);

document.addEventListener('click', e => {
  if (e.target.id === 'modal') { closeModal(); return; }
  const b = e.target.closest('[data-act]'); if (!b) return;
  const act = b.dataset.act;
  switch (act) {
    case 'mclose': closeModal(); break;
    case 'mok': { const f = modalOk; closeModal(); if (f) f(); break; }
    case 'lang': {
      // сохранить введённое в форме входа, чтобы смена языка его не стёрла
      if (screen === 'start' && $('#st-last')) prefill = { last: $('#st-last').value, first: $('#st-first').value, group: $('#st-group').value, mods: [...document.querySelectorAll('input[name="mod"]:checked')].map(x => x.value) };
      setLang(b.dataset.l); render(); liveSoon(); break;
    }
    case 'teacher': screen = 'teacher'; tMsg = null; render(); break;
    case 'home': screen = 'start'; render(); break;
    case 'resume': screen = 'work'; render(); liveSend(); break;
    case 'exit': screen = 'start'; prefill = null; render(); liveSend(); break;

      if (sc && Object.values(state.answers).some(v => String(v).trim())) confirmBox(L('Сгенерировать новый день?'), L('Появится другой вариант, а введённые ответы будут удалены. Преподаватель увидит, сколько раз день генерировался заново.'), L('Сгенерировать'), generate, true);

      break;

/* ================= запуск ================= */
function boot(data) {
  document.documentElement.lang = LANG === 'kz' ? 'kk' : 'ru';
  journal = lsGet(LS_JOURNAL) || [];
  state = (data && data.state) || lsGet(LS_SHIFT);
  if (state && state.mods) {
    state.mods = state.mods.filter(k => REP[k]);
    if (!state.mods.length) state.mods = REPORTS.map(r => r.key);
    if (!state.sid) state.sid = newSid();
  }
  if (state && state.seed) sc = buildScenario(state.seed, state.dISO);
  screen = (data && data.screen) || (state && state.student && !state.submitted ? 'work' : 'start');
  render();
  setInterval(tick, 1000);
}
const hot = window.claude && window.claude.hot;
try { if (hot && typeof hot.snapshot === 'function') hot.snapshot(() => ({ state, screen })); } catch (e) {}
if (hot && typeof hot.ready === 'function') { try { hot.ready(boot); } catch (e) { boot({}); } }
else boot((hot && hot.data) || {});
})();
