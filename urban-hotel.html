<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>URBAN HOTEL Симулятор</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: lobby-board — sticky front-desk bar on top, role tabs as a key rack on the left, working desk in the middle */
:root{
  --bg:#E9EEEF; --paper:#FFFFFF; --sunk:#F3F6F6; --ink:#13262A; --muted:#5A6D71; --line:#D2DBDC;
  --accent:#1D5A61; --accent-ink:#FFFFFF; --accent-soft:#DCEBEC; --brass:#9C6F1F; --brass-soft:#F3E7CF;
  --good:#2D7A4C; --good-soft:#DCF0E3; --warn:#A8650F; --warn-soft:#F8EAD3; --bad:#B03535; --bad-soft:#F7DEDE;
  --f-display:"Unbounded","Manrope",system-ui,sans-serif;
  --f-body:"Manrope",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-mono:"JetBrains Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  --r:10px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E181B; --paper:#152428; --sunk:#112024; --ink:#E4EDEE; --muted:#93A7AB; --line:#26393D;
  --accent:#5DB0B6; --accent-ink:#0B1A1D; --accent-soft:#1C3A3E; --brass:#D6A84E; --brass-soft:#3A2F1B;
  --good:#5CC287; --good-soft:#18392A; --warn:#E3A54A; --warn-soft:#3B2E17; --bad:#EE7A7A; --bad-soft:#402020;
  color-scheme:dark;}}
:root[data-theme="dark"]{
  --bg:#0E181B; --paper:#152428; --sunk:#112024; --ink:#E4EDEE; --muted:#93A7AB; --line:#26393D;
  --accent:#5DB0B6; --accent-ink:#0B1A1D; --accent-soft:#1C3A3E; --brass:#D6A84E; --brass-soft:#3A2F1B;
  --good:#5CC287; --good-soft:#18392A; --warn:#E3A54A; --warn-soft:#3B2E17; --bad:#EE7A7A; --bad-soft:#402020;
  color-scheme:dark;}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
h1,h2,h3{font-family:var(--f-display);font-weight:700;text-wrap:balance;margin:0;letter-spacing:-.01em}
h1{font-size:clamp(30px,6vw,52px);line-height:1.05}
h2{font-size:19px;line-height:1.25}
h3{font-size:15px;line-height:1.3;font-family:var(--f-body);font-weight:800}
p{margin:0}
.muted{color:var(--muted)}
.mono,.num{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
.eyebrow{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:700}
.wrap{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:24px 64px;display:grid;gap:20px}
.card{background:var(--paper);border:1px solid var(--line);border-radius:var(--r);padding:20px;display:grid;gap:14px;min-width:0}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,340px),1fr));gap:20px}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr));gap:12px}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.between{justify-content:space-between}
button,.btn{font:inherit;font-weight:700;border-radius:8px;border:1px solid var(--line);background:var(--paper);color:var(--ink);padding:9px 14px;cursor:pointer;line-height:1.2}
button:hover{border-color:var(--accent)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
button.primary{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
button.primary:hover{filter:brightness(1.08)}
button.ghost{background:transparent}
button.danger{color:var(--bad)}
button.small{padding:6px 10px;font-size:13px}
button:disabled{opacity:.45;cursor:not-allowed}
input[type=text],input[type=number],select,textarea{font:inherit;color:var(--ink);background:var(--sunk);border:1px solid var(--line);border-radius:8px;padding:9px 11px;width:100%}
textarea{min-height:80px;font-family:var(--f-mono);font-size:12px}
label{display:grid;gap:6px;font-weight:600;font-size:13px}
input[type=range]{width:100%;accent-color:var(--accent)}
.opt{display:grid;gap:4px;text-align:left;padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-weight:500}
.opt b{font-weight:800}
.opt small{color:var(--muted);font-size:12.5px}
.opt[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-soft);box-shadow:inset 0 0 0 1px var(--accent)}
.chips{display:flex;gap:8px;flex-wrap:wrap}
.chip{display:inline-flex;align-items:center;gap:6px;padding:3px 10px;border-radius:999px;font-size:12px;font-weight:700;background:var(--sunk);border:1px solid var(--line);white-space:nowrap}
.chip.good{background:var(--good-soft);color:var(--good);border-color:transparent}
.chip.warn{background:var(--warn-soft);color:var(--warn);border-color:transparent}
.chip.bad{background:var(--bad-soft);color:var(--bad);border-color:transparent}
.chip.brass{background:var(--brass-soft);color:var(--brass);border-color:transparent}
.err{color:var(--bad);font-weight:700;font-size:13px}

/* key tag motif */
.keytag{position:relative;display:inline-grid;place-items:center;min-width:92px;padding:10px 14px 10px 30px;background:var(--brass-soft);color:var(--brass);border:1.5px solid var(--brass);border-radius:6px 18px 18px 6px;font-family:var(--f-mono);font-weight:600;font-size:12px;line-height:1.15;text-align:center}
.keytag::before{content:"";position:absolute;left:10px;top:50%;width:10px;height:10px;margin-top:-5px;border-radius:50%;border:1.5px solid var(--brass);background:var(--bg)}
.keytag b{font-family:var(--f-display);font-size:18px;display:block}

/* home */
.hero{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:start;padding-block:24px 8px}
.hero .lead{max-width:62ch;font-size:17px;margin-top:12px;color:var(--muted)}
.hero h1{margin-top:6px}
@media (max-width:600px){.hero{grid-template-columns:1fr}}
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px;counter-reset:st}
.stage{padding:16px;border-radius:var(--r);background:var(--sunk);border:1px solid var(--line);display:grid;gap:6px}
.stage .n{font-family:var(--f-mono);color:var(--brass);font-weight:600;font-size:12px}
.save{display:flex;justify-content:space-between;gap:12px;align-items:center;padding:12px 0;border-top:1px solid var(--line);flex-wrap:wrap}
.save:first-of-type{border-top:0}

/* setup stepper */
.stepper{display:flex;gap:6px;flex-wrap:wrap}
.step{display:flex;align-items:center;gap:8px;padding:7px 12px;border-radius:999px;font-weight:700;font-size:13px;color:var(--muted);background:var(--paper);border:1px solid var(--line)}
.step i{font-style:normal;font-family:var(--f-mono);font-size:11px;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;background:var(--sunk)}
.step.on{color:var(--ink);border-color:var(--accent)}
.step.on i{background:var(--accent);color:var(--accent-ink)}
.step.done i{background:var(--good);color:#fff}
.setup{display:grid;grid-template-columns:minmax(0,1fr) 340px;gap:20px;align-items:start}
@media (max-width:900px){.setup{grid-template-columns:1fr}}
.summary{position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
.ledger{display:grid;gap:6px;font-size:14px}
.ledger div{display:flex;justify-content:space-between;gap:12px}
.ledger div span:last-child{font-family:var(--f-mono);font-variant-numeric:tabular-nums;white-space:nowrap}
.ledger .tot{border-top:1px solid var(--line);padding-top:8px;font-weight:800}
.check{display:flex;gap:8px;align-items:flex-start;font-size:13.5px}
.check .dot{flex:none;width:18px;height:18px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;margin-top:1px}
.check.ok .dot{background:var(--good-soft);color:var(--good)}
.check.no .dot{background:var(--bad-soft);color:var(--bad)}

/* staff rows */
.staff{display:grid;gap:10px}
.srow{display:grid;grid-template-columns:minmax(0,1.6fr) auto minmax(0,1.2fr) auto;gap:12px;align-items:center;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
@media (max-width:720px){.srow{grid-template-columns:1fr 1fr}}
.stepbox{display:inline-flex;align-items:center;border:1px solid var(--line);border-radius:8px;background:var(--paper);overflow:hidden}
.stepbox button{border:0;border-radius:0;padding:7px 12px}
.stepbox span{min-width:36px;text-align:center;font-family:var(--f-mono);font-weight:600}
.bar{height:6px;border-radius:3px;background:var(--line);overflow:hidden}
.bar i{display:block;height:100%;background:var(--accent);border-radius:3px}
.bar.m i{background:var(--brass)}

/* play */
.topbar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:1px solid var(--line)}
.topbar .in{max-width:1200px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.topbar .name{display:grid;gap:0;min-width:0;flex:1 1 180px}
.topbar .name b{font-family:var(--f-display);font-size:16px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.topbar .name small{color:var(--muted);font-size:12px}
.stat{display:grid;gap:0}
.stat small{font-size:11px;color:var(--muted);text-transform:uppercase;letter-spacing:.08em;font-weight:700}
.stat b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:15px}
.stars{color:var(--brass);letter-spacing:1px}
.play{display:grid;grid-template-columns:210px minmax(0,1fr);gap:20px;align-items:start}
.rack{display:grid;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 84px)}
.rack button{display:flex;justify-content:space-between;align-items:center;text-align:left;background:transparent;border-color:transparent;padding:10px 12px;font-weight:700}
.rack button[aria-current="true"]{background:var(--paper);border-color:var(--line);box-shadow:inset 3px 0 0 var(--brass)}
.rack .badge{background:var(--bad);color:#fff;border-radius:999px;font-size:11px;padding:1px 7px;font-family:var(--f-mono)}
@media (max-width:860px){.play{grid-template-columns:1fr}.rack{position:static;display:flex;overflow-x:auto;gap:4px;padding-bottom:4px}.rack button{white-space:nowrap;flex:none}.rack button[aria-current="true"]{box-shadow:inset 0 -3px 0 var(--brass)}}
.desk{display:grid;gap:20px;min-width:0}
.tiles{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,150px),1fr));gap:10px}
.tile{padding:14px;border-radius:10px;background:var(--sunk);border:1px solid var(--line);display:grid;gap:2px}
.tile small{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);font-weight:700}
.tile b{font-family:var(--f-mono);font-variant-numeric:tabular-nums;font-size:19px}
.tile em{font-style:normal;font-size:12px;color:var(--muted)}
.event{border:1px solid var(--line);border-left:4px solid var(--brass);border-radius:10px;padding:16px;display:grid;gap:12px;background:var(--paper)}
.event.done{border-left-color:var(--good)}
.choices{display:grid;gap:8px}
.choices button{text-align:left;font-weight:600;background:var(--sunk)}
.result{padding:10px 12px;border-radius:8px;background:var(--good-soft);color:var(--ink);font-size:14px}
.alerts{display:grid;gap:8px}
.alert{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border-radius:8px;font-size:14px;background:var(--warn-soft)}
.alert.bad{background:var(--bad-soft)}
.alert.good{background:var(--good-soft)}
.tbl-wrap{overflow-x:auto}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:right;white-space:nowrap}
th:first-child,td:first-child{text-align:left}
th{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
td{font-family:var(--f-mono);font-variant-numeric:tabular-nums}
td:first-child{font-family:var(--f-body)}
.chan{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px;padding:14px;border:1px solid var(--line);border-radius:10px;background:var(--sunk)}
.chan.on{border-color:var(--accent);background:var(--accent-soft)}
.quiz{grid-column:1/-1;display:grid;gap:8px;padding:12px;border-radius:8px;background:var(--paper);border:1px dashed var(--brass)}
.quiz .ans{display:grid;gap:6px}
.quiz .ans button{text-align:left;font-weight:500}
.quiz .ans button.right{border-color:var(--good);background:var(--good-soft)}
.quiz .ans button.wrong{border-color:var(--bad);background:var(--bad-soft)}
.toggle{display:inline-flex;align-items:center;gap:8px;font-weight:700;font-size:13px}
.sw{width:42px;height:24px;border-radius:12px;background:var(--line);position:relative;flex:none;transition:background .15s}
.sw::after{content:"";position:absolute;top:3px;left:3px;width:18px;height:18px;border-radius:50%;background:var(--paper);transition:left .15s;box-shadow:0 1px 2px rgba(0,0,0,.25)}
[aria-pressed="true"] .sw{background:var(--accent)}
[aria-pressed="true"] .sw::after{left:21px}
.toggle-btn{background:transparent;border:0;padding:4px}
.chart svg{width:100%;height:auto;display:block}
.chart text{fill:var(--muted);font-family:var(--f-mono);font-size:10px}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);flex-wrap:wrap}
.legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:6px;vertical-align:-1px}
.sticky-close{display:flex;gap:8px;align-items:center}

/* modal */
#modal[hidden]{display:none}
#modal{position:fixed;inset:0;z-index:20;background:rgba(8,18,20,.55);display:grid;place-items:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));overflow-y:auto}
.sheet{background:var(--paper);border-radius:14px;max-width:760px;width:100%;padding:24px;display:grid;gap:18px;border:1px solid var(--line);max-height:calc(100vh - 32px);overflow-y:auto}
.sheet .head{display:flex;gap:16px;align-items:center;flex-wrap:wrap}
.grade{font-family:var(--f-display);font-size:44px;color:var(--brass);line-height:1}
.tips{display:grid;gap:8px;padding:0;margin:0;list-style:none}
.tips li{padding:10px 12px;border-radius:8px;background:var(--sunk);font-size:14px;border-left:3px solid var(--accent)}
/* splash */
.hero-logo{width:150px;height:auto;aspect-ratio:530/359}
@media (max-width:600px){.hero-logo{width:120px}}
.splash{position:fixed;inset:0;z-index:100;display:flex;flex-direction:column;align-items:center;overflow:hidden;cursor:pointer;color:#EEF3F6;
  padding:max(5vh,calc(20px + env(safe-area-inset-top,0px))) max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));}
.sp-bg{position:absolute;inset:0;background:linear-gradient(180deg,#070E16 0%,#0E1B2B 45%,#1C2440 78%,#3A1F3A 100%);transition:opacity .7s ease}
.sp-sky{position:absolute;inset:0;pointer-events:none;transition:opacity .5s;background:radial-gradient(80% 45% at 50% 100%,rgba(219,27,80,.28),transparent 70%),radial-gradient(60% 40% at 50% 0%,rgba(61,183,190,.12),transparent 70%)}
.sp-inner{position:relative;z-index:2;display:flex;flex-direction:column;align-items:center;gap:14px;text-align:center}
.sp-logo{width:min(34vw,170px);aspect-ratio:530/359;transform-origin:0 0;animation:splogo 1.1s cubic-bezier(.2,.8,.2,1) both;filter:drop-shadow(0 0 22px rgba(219,27,80,.55))}
@keyframes splogo{0%{opacity:0;transform:translateY(18px) scale(.86)}60%{opacity:1;transform:translateY(-3px) scale(1.02)}100%{opacity:1;transform:none}}
.sp-text{display:flex;flex-direction:column;align-items:center;gap:6px;transition:opacity .4s,transform .4s}
.sp-eyebrow{font-size:11.5px;letter-spacing:.32em;text-transform:uppercase;color:#9FB0BC;font-weight:700;animation:spfade .7s .45s both}
.sp-title{margin:0;font-family:var(--f-display);font-weight:700;font-size:clamp(24px,4.6vw,42px);line-height:1.05;letter-spacing:-.01em;color:#fff;text-wrap:balance;animation:sptitle .9s .6s both}
.sp-title span{color:#FF3D73;display:inline-block;animation:sppulse 1.6s 1.4s ease-in-out infinite}
@keyframes sptitle{from{opacity:0;transform:translateY(12px);letter-spacing:.06em}to{opacity:1;transform:none;letter-spacing:-.01em}}
@keyframes sppulse{0%,100%{transform:scale(1)}50%{transform:scale(1.35)}}
.sp-sub{color:#9FB0BC;font-size:13.5px;max-width:46ch;animation:spfade .7s .85s both}
.sp-load{width:min(300px,76vw);display:flex;flex-direction:column;gap:7px;align-items:center;animation:spfade .6s .9s both}
.sp-track{width:100%;height:3px;border-radius:3px;background:rgba(255,255,255,.12);overflow:hidden}
.sp-track b{display:block;height:100%;width:100%;background:linear-gradient(90deg,#DB1B50,#FF7AA0);box-shadow:0 0 10px #DB1B50;transform:scaleX(0);transform-origin:left;animation:spload 6s .8s cubic-bezier(.45,.05,.35,1) forwards}
.sp-dots{display:flex;gap:8px}
.sp-dots i{width:6px;height:6px;border-radius:50%;background:rgba(255,255,255,.18);animation:spdot .4s var(--d) both}
@keyframes spdot{to{background:#FF3D73;box-shadow:0 0 8px #FF3D73}}
.sp-status{font-size:12px;color:#E4ECF1;min-height:1.4em;font-weight:600}
.sp-status.flip{animation:spflip .45s ease both}
@keyframes spflip{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.sp-sky::after{content:"";position:absolute;inset:0}
.sp-stage{position:relative;z-index:1;margin-top:auto;width:min(560px,92vw);max-height:56vh;aspect-ratio:1/1;transition:opacity .6s,transform .7s}
.u-svg{display:block;width:100%;height:100%}
.u-star{fill:#fff;opacity:0;animation:uTw 2.4s var(--d) ease-in-out infinite}
@keyframes uTw{0%,100%{opacity:.15}50%{opacity:.9}}
.u-city{opacity:0;animation:spfade 1.2s .3s both}
.u-cw{opacity:0;animation:uOn .4s var(--d) both}
@keyframes uOn{to{opacity:1}}
.u-halo{opacity:0;animation:uOn 1s 5.2s both}
.u-wingL,.u-wingR{opacity:0;transform-box:fill-box;transform-origin:50% 100%;animation:uRise .8s .7s cubic-bezier(.2,.8,.2,1) both}
.u-wingR{animation-delay:.9s}
@keyframes uRise{from{opacity:0;transform:scaleY(0)}to{opacity:1;transform:none}}
.u-wl{opacity:.35}
.u-wl[fill="#F2C774"]{opacity:0;animation:uOn .5s var(--d) both}
.u-tower{clip-path:inset(100% 0 0 0);animation:uBuild 2.2s 1.1s cubic-bezier(.55,0,.3,1) forwards}
@keyframes uBuild{to{clip-path:inset(-20% 0 0 0)}}
.u-buildline{opacity:0;filter:drop-shadow(0 0 4px #FFCF73);animation:uLine 2.2s 1.1s cubic-bezier(.55,0,.3,1) both}
@keyframes uLine{0%{opacity:1;transform:translateY(0)}95%{opacity:1;transform:translateY(-280px)}100%{opacity:0;transform:translateY(-280px)}}
.u-win{opacity:0;animation:uWin .6s var(--d) ease both}
@keyframes uWin{0%{opacity:0}40%{opacity:1;filter:brightness(1.4)}100%{opacity:1}}
.u-sweep{animation:uSweep 1.6s 3.1s ease-in-out both}
@keyframes uSweep{from{transform:skewX(-18deg) translateX(0)}to{transform:skewX(-18deg) translateX(420px)}}
.u-neon{font:800 21px var(--f-display);letter-spacing:.14em;fill:#FF3D73}
.u-sign{opacity:0;animation:uNeon 1.1s 4.8s both}

function refADR(s){const h=s.hotel;return STARS[h.star].adr*TYPES[h.type].adr*CITIES[h.city].adr*(h.fac.spa?1.06:1)*(h.fac.rest?1.02:1);}
function wage(s,k){return DEPTS[k].sal*STARS[s.hotel.star].wage*(s.hotel.type==='host'?.75:1);}
function capexCalc(h){
  const rooms=h.rooms*STARS[h.star].capex*TYPES[h.type].capex;
  let fac=0;for(const k in FAC)if(h.fac[k])fac+=FAC[k].capex*(0.6+0.15*h.star);
  return {rooms,fac,total:rooms+fac};
}
function recMaint(s){return Math.round(s.capex*0.0035/10000)*10000;}
function stdReq(h){

  const r=[],st=h.star;
  if(st===3)r.push({ok:h.fac.rest||h.type==='apart',t:T("Завтраки: ресторан или кафе (апарт-отелю хватит кухонь в номерах)")});
  if(st>=4){r.push({ok:h.fac.rest,t:T("Ресторан")});r.push({ok:h.fac.fit,t:T("Фитнес-зал")});r.push({ok:h.rooms>=30,t:T("Не менее 30 номеров")});}
  if(st>=5){r.push({ok:h.fac.spa,t:T("SPA и бассейн")});r.push({ok:h.fac.conf,t:T("Конференц-зал")});r.push({ok:h.fac.park,t:T("Парковка")});r.push({ok:h.rooms>=50,t:T("Не менее 50 номеров")});}
  if(st<=2)r.push({ok:true,t:T("Базовый набор: ресепшн, уборка, безопасность")});
  return r;
}
function contentScore(s){return Object.keys(CONTENT).filter(k=>s.content[k]).length/Object.keys(CONTENT).length;}
function qualityCalc(s){
  let sw=0,sq=0;const per={};
  for(const k in DEPTS){const n=DEPTS[k].norm(s.hotel);if(!n)continue;const d=s.depts[k]||{count:0,skill:0,morale:0};const ratio=d.count/n;
    const q=(d.skill/100)*Math.pow(Math.min(1,ratio),1.3)*(0.75+0.25*d.morale/100);per[k]={ratio,q,n};sw+=DEPTS[k].w;sq+=DEPTS[k].w*q;}
  let Q=(sw?sq/sw:0)+HKSTD[s.dec.hk].q;Q*=(0.85+0.15*s.cond/100);
  return {Q:clamp(Q,0,1),per};
}
function channelParts(s){
  const cs=contentScore(s);const parts={direct:.2};
  for(const k in CH){if(!s.channels[k])continue;let vis=(0.45+0.55*cs)*(s.quiz[k]===true?1.1:0.95);
    if(k==='booking'){if(s.flags.parity>0)vis*=0.7;vis*=s.mod.booking;}
    if(k==='ostrovok'&&s.flags.ostroPromo>0)vis*=1.5;
    if(k==='trip'&&!s.content.desc)vis*=0.5;
    if(k==='site')vis*=0.4+1.2*(1-Math.exp(-s.dec.mk/(s.hotel.rooms*15000)));
    parts[k]=CH[k].reach*vis;}
  return parts;
}
function demandCalc(s,price,Q){
  const h=s.hotel,m=s.month%12,ref=refADR(s);
  const priceF=clamp(Math.pow(ref/price,1.7),0.12,2);
  const season=CITIES[h.city].season[m];
  const ratingF=clamp(0.55+(s.rating-6)*0.12,0.4,1.2);
  const parts=channelParts(s);const R=Object.values(parts).reduce((a,b)=>a+b,0);
  const reachF=Math.min(1.25,R);
  const mkF=1+0.15*(1-Math.exp(-s.dec.mk/(h.rooms*12000)));
  let d=0.6*season*priceF*ratingF*reachF*mkF*s.mod.demand*(h.type==='host'?1.2:1);
  if(s.flags.comp>0)d*=Q>0.65?0.96:0.9;
  if(s.flags.blog>0)d*=1.06;
  return {d,parts,R,ref,season};
}
function forecast(s){
  const h=s.hotel,m=s.month%12,days=DAYS[m],cap=h.rooms*days;
  const {Q}=qualityCalc(s);const price=s.dec.price*(s.mod.priceMul||1);
  const D=demandCalc(s,price,Q);const avail=Math.max(0,cap-s.mod.ooo);
  let res=s.contracts.reduce((a,c)=>a+c.nights*days/30,0)+s.mod.groupNights;res=Math.min(res,avail*.85);
  const tr=Math.max(0,Math.min((avail-res)*.98,D.d*cap));const sold=tr+res;
  const corpRev=s.contracts.reduce((a,c)=>a+c.nights*days/30*c.rate,0);
  const rev=tr*price+corpRev+s.mod.groupNights*(s.mod.groupRate||0);
  return {occ:sold/cap,sold,rev,adr:sold?rev/sold:0,revpar:rev/cap,Q,ref:D.ref,season:D.season};
}
function estFixed(){
  const h=S.hotel;let pay=0;for(const k in DEPTS)pay+=DEPTS[k].norm(h)*wage(S,k);
  const cx=capexCalc(h).total;return pay*1.11+h.rooms*28000+cx*0.007+cx*0.0035;
}
function corpShare(s){return s.contracts.reduce((a,c)=>a+c.nights,0)/(s.hotel.rooms*30);}
function staffTotal(s){return Object.values(s.depts).reduce((a,d)=>a+d.count,0);}

function autoTasks(s,q){for(const k in s.tasks||{}){const t=s.tasks[k];if(t.done||t.noStaff)continue;const good=()=>Math.random()<q;
  if(k==='fo'){const used=new Set();t.guests.forEach(g=>{if(good()){t.assign[g.id]=g.target;}else{const r=t.rooms.find(x=>!used.has(x.id)&&x.st!=='repair')||t.rooms.find(x=>x.id===g.target);t.assign[g.id]=r.id;}used.add(t.assign[g.id]);const r=t.rooms.find(x=>x.id===t.assign[g.id]);if(r.ti>g.ti)t.upsell[g.id]=!g.vip;});

  const s=S,h=s.hotel,m=s.month%12,days=DAYS[m],cap=h.rooms*days;
  const {Q,per}=qualityCalc(s);

  const D=demandCalc(s,price,Q);
  const avail=Math.max(0,cap-s.mod.ooo);
  const corpRows=s.contracts.map(c=>({c,n:c.nights*days/30*(0.9+0.1*D.season)}));
  let corpN=corpRows.reduce((a,r)=>a+r.n,0),grpN=s.mod.groupNights;
  const resCap=avail*.85;let scale=1;if(corpN+grpN>resCap)scale=resCap/(corpN+grpN);
  corpN*=scale;grpN*=scale;

  const upsell=s.flags.upsell>0?1.03:1;
  for(const k in D.parts){const n=transient*D.parts[k]/D.R;let rate=price*upsell;if(k==='ostrovok'&&s.flags.ostroPromo>0)rate*=.85;
    const rev=n*rate*s.mod.revMul;const com=k==='direct'?0:rev*CH[k].com;roomRev+=rev;commission+=com;chRows.push({k,n,rev,com});}
  let corpRev=0;corpRows.forEach(r=>{corpRev+=r.n*scale*r.c.rate;});
  const grpRev=grpN*(s.mod.groupRate||0);

  const parkRev=h.fac.park?sold*.25*2000:0;
  const transRev=h.fac.trans?sold*.08*9000:0;

  const revenue=roomRev+otherRev;

  const taxes=payroll*.11;
  const hkCost=sold*HKSTD[s.dec.hk].cost*(0.7+0.15*h.star)*(s.flags.linenMul||1);
  const util=h.rooms*28000+sold*1600;
  const cogs=fbRev*(s.mod.fbCogs||.62)+spaRev*.4+confRev*.35+transRev*.6;
  const lease=s.capex*.007;
  const siteFee=s.channels.site?60000:0;
  const oneoffSum=s.mod.oneoff.reduce((a,b)=>a+b.amt,0);
  const costRows=[[T("Фонд оплаты труда"),payroll],[T("Налоги и взносы с ФОТ (11%)"),taxes],[T("Комиссии каналов продаж"),commission],[T("Хаускипинг: расходники, бельё, косметика"),hkCost],[T("Коммунальные услуги"),util],[T("Себестоимость ресторана, SPA, трансфера, конференций"),cogs],[T("Техническое обслуживание"),s.dec.maint],[T("Маркетинг и сайт"),s.dec.mk+siteFee],[T("Аренда и обслуживание инвестиций"),lease],[T("Разовые расходы: найм, обучение, ситуации"),oneoffSum]];
  const costs=costRows.reduce((a,r)=>a+r[1],0);
  const gop=revenue-(costs-lease);
  const profit=revenue-costs;
  s.cash+=profit;
  // состояние здания
  const rec=recMaint(s);const condBefore=s.cond;
  s.cond=clamp(s.cond+(s.dec.maint/Math.max(rec,1)-1)*6-1.5-(occ>.85?.5:0),20,100);
  // рейтинг
  const ratio=price/D.ref;let target=3.2+Q*7.5;
  if(ratio>1.1)target-=(ratio-1.1)*4;if(ratio<.9)target+=Math.min(.3,.9-ratio);

    const rt=n?d.count/n:1;let tgt=62+(d.pay-1)*120+s.mod.morale;
    if(n&&rt<.95)tgt-=(.95-rt)*120;if(s.cash<0)tgt-=10;if(d.pay<1)tgt-=5;

  s.contracts.forEach(c=>c.months--);const ended=s.contracts.filter(c=>c.months<=0).map(c=>c.name);s.contracts=s.contracts.filter(c=>c.months>0);
  s.offers.forEach(o=>o.age=(o.age||0)+1);s.offers=s.offers.filter(o=>o.age<3);

  if(occ<.45)tips.push(T("Загрузка ниже 45%. Подключите больше каналов, доработайте контент, усилите маркетинг или пересмотрите цену."));
  if(occ>.92)tips.push(T("Отель почти полностью продан. Можно поднять BAR: RevPAR вырастет, даже если загрузка немного снизится."));
  const under=Object.keys(per).filter(k=>per[k].ratio<.9);
  if(under.length)tips.push(T("Недоукомплектованы: ")+under.map(k=>DEPTS[k].sh).join(', ')+T(". Переработки снижают мотивацию и качество."));
  const low=Object.keys(s.depts).filter(k=>s.depts[k].count&&s.depts[k].morale<45);
  if(low.length)tips.push(T("Низкая мотивация: ")+low.map(k=>DEPTS[k].sh).join(', ')+T(". Без мер начнутся увольнения."));
  if(roomRev&&commission/roomRev>.12)tips.push(`${T("Комиссии съедают")} ${pct(commission/roomRev)} ${T("выручки от номеров. Развивайте прямые продажи и корпоративных клиентов.")}`);
  if(s.cond<55)tips.push(T("Здание изнашивается: увеличьте бюджет на техобслуживание, иначе вырастет риск аварий и штрафов."));
  if(s.cash<0)tips.push(T("Касса ушла в минус. Два месяца подряд в минусе означают банкротство."));
  if(!tips.length)tips.push(T("Месяц прошёл ровно. Попробуйте тонкую настройку цены под сезон."));
  const totalStaff=staffTotal(s);
  const diag=makeDiag(monthFactors(s,D,price,cap,corpN,oneoffSum,revenue,per),profit);
  const rep={diag,m:s.month,occ,adr,revpar,revenue,roomRev,otherRev,costs,gop,profit,rating:s.rating,oldR,Q,quits:quits.reduce((a,b)=>a+b.q,0),quitList:quits,cash:s.cash,staff:totalStaff,costRows,chRows,tips,ended,cond:s.cond,condBefore,sold:Math.round(sold),cap,price};
  s.history.push({m:s.month,occ,adr,revpar,revenue,costs,gop,profit,rating:s.rating,Q,quits:rep.quits,cash:s.cash,staff:totalStaff});
  s.log.unshift({m:s.month,items:s.events.map(e=>{const ev=EVENTS.find(x=>x.id===e.id);return ev.t+': '+e.res;})});
  s.lastQ=Q;s.lastOcc=occ;
  s.negMonths=s.cash<0?(s.negMonths||0)+1:0;
  s.month++;
  const yearEnd=s.month%12===0;
  genMonth();save();
  ui.modal={type:'report',r:rep,yearEnd,bankrupt:s.negMonths>=2};
}

function goalsFor(h){const t=h.type,st=h.star;
  return {occ:t==='res'?.52:t==='host'?.6:.65,rating:t==='host'?7.8:st>=5?8.4:st===4?8.2:st===3?8.0:7.8,gopm:t==='host'?.18:t==='res'?.25:.30,turn:.30};}
function yearSlice(s){const H=s.history;if(!H.length)return {y:0,h:[]};const y=Math.floor((H.length-1)/12);return {y,h:H.slice(y*12,y*12+12)};}
function kpis(s){
  const g=s.goals||goalsFor(s.hotel),{y,h}=yearSlice(s),n=h.length;
  const rev=h.reduce((a,x)=>a+x.revenue,0),gop=h.reduce((a,x)=>a+x.gop,0),profit=h.reduce((a,x)=>a+x.profit,0);
  const occ=n?h.reduce((a,x)=>a+x.occ,0)/n:0,quits=h.reduce((a,x)=>a+x.quits,0),avgSt=n?h.reduce((a,x)=>a+x.staff,0)/n:staffTotal(s);
  const turn=avgSt?quits/avgSt*(n?12/n:0):0,gopm=rev?gop/rev:0,cashOk=h.every(x=>x.cash>=0)&&!(s.bailouts>(s.bailYear0||0));
  const rows=[
    {k:'profit',w:25,n:T("Чистая прибыль за год"),d:T("Отель зарабатывает больше, чем тратит, включая аренду и обслуживание инвестиций"),tgt:T("больше 0 ₸"),fact:money(profit),ok:profit>0,p:profit>0?1:clamp(1+profit/(s.capex*.1),0,1)},
    {k:'gopm',w:20,n:T("Рентабельность GOP"),d:T("Валовая операционная прибыль, делённая на выручку. Главный показатель качества управления"),tgt:T("не ниже ")+pct(g.gopm),fact:pct(gopm),ok:gopm>=g.gopm,p:clamp(gopm/g.gopm,0,1)},
    {k:'occ',w:15,n:T("Средняя загрузка"),d:T("Доля проданных номероночей за год"),tgt:T("не ниже ")+pct(g.occ),fact:pct(occ),ok:occ>=g.occ,p:clamp(occ/g.occ,0,1)},
    {k:'rating',w:20,n:T("Рейтинг гостей"),d:T("Оценка на площадках на конец года. Чем выше категория, тем выше ожидания"),tgt:T("не ниже ")+r1(g.rating),fact:r1(s.rating),ok:s.rating>=g.rating,p:clamp((s.rating-5)/(g.rating-5),0,1)},
    {k:'turn',w:10,n:T("Текучесть персонала"),d:T("Сколько сотрудников ушло за год от среднего штата"),tgt:T("не выше ")+pct(g.turn),fact:pct(turn),ok:turn<=g.turn,p:turn<=g.turn?1:clamp(1-(turn-g.turn)/g.turn,0,1)},
    {k:'cash',w:10,n:T("Без кассовых разрывов"),d:T("Касса ни разу не ушла в минус, транши инвестора не понадобились"),tgt:T("ни одного"),fact:cashOk?T("не было"):T("были"),ok:cashOk,p:cashOk?1:0}

  const score=Math.round(clamp(rows.reduce((a,r)=>a+r.w*(r.ok?1:r.p*r.p*.5),0)-Math.max(0,s.bailouts-(s.bailYear0||0))*15,0,100));

}

function stepIdx(){const i=STEPS.findIndex(s=>s.id===ui.step);return i<0?0:i;}
function setupCosts(){
  const h=S.hotel,cx=capexCalc(h);let hire=0,intro=0,pay=0;
  const staffOn=stepIdx()>=STEPS.findIndex(s=>s.id==='staff');
  for(const k in DEPTS){const st=S.setup.staff[k];const n=st&&staffOn?st:{count:DEPTS[k].norm(h),tier:1,intro:true};
    hire+=n.count*TIERS[n.tier].fee;if(n.intro)intro+=n.count*30000;pay+=n.count*wage(S,k);}
  let content=0;for(const k in CONTENT)if(S.content[k])content+=CONTENT[k].cost;
  const site=S.channels.site?CH.site.setup:0;
  const total=cx.total+hire+intro+content+site;
  return {cx,hire,intro,content,site,total,left:S.budget-total,pay};
}
function setupDepts(){const d={};const staffOn=stepIdx()>=STEPS.findIndex(s=>s.id==='staff');
  for(const k in DEPTS){const st=staffOn&&S.setup.staff[k]?S.setup.staff[k]:{count:DEPTS[k].norm(S.hotel),tier:1,intro:true};d[k]={count:st.count,skill:TIERS[st.tier].skill+(st.intro?8:0),morale:74,pay:1};}return d;}
function econ(){
  const h=S.hotel,ref=refADR(S),saved=S.depts;S.depts=setupDepts();
  let pay=0;for(const k in DEPTS)pay+=S.depts[k].count*wage(S,k);
  const cx=capexCalc(h).total,fixed=pay*1.11+h.rooms*28000+cx*.007+cx*.0035+(S.dec.mk||0);
  const varPer=HKSTD.std.cost*(.7+.15*h.star)+1600+ref*.12;
  const be=fixed/Math.max(1,h.rooms*30*(ref-varPer));
  const f=S.phase==='setup'&&S.dec.price?forecast(S):null;
  S.depts=saved;
  return {ref,pay,fixed,be,rev65:h.rooms*30*.65*ref,f};
}

function dots(n,max){return `<span class="dots">${Array.from({length:max},(_,i)=>`<i class="${i<n?'on':''}"></i>`).join('')}</span>`;}

function stepCheck(){
  const h=S.hotel,c=setupCosts(),id=STEPS[stepIdx()].id;
  if(id==='budget'&&!h.name.trim())return T("Введите название отеля");
  if(['category','facilities','passport','staff','content','ota','corp','price'].includes(id)&&c.left<0)return T("Бюджет превышен на ")+money(-c.left)+T(". Уменьшите номера, категорию или инфраструктуру");
  if(['facilities','passport'].includes(id)&&!stdReq(h).every(r=>r.ok))return T("Не выполнены требования категории: ")+stdReq(h).filter(r=>!r.ok).map(r=>r.t).join(', ');
  if(id==='staff'&&!S.setup.staff.gm.count)return T("Отелю нужен управляющий");
  if(id==='staff'&&S.setup.staff.fo.count<3)return T("Ресепшн не сможет работать круглосуточно: нужно минимум 3 человека");
  return '';
}

/* ===================== ГРАФИКИ ===================== */
function mshort(v){const a=Math.abs(v);return (v<0?'−':'')+(a>=1e6?Math.round(a/1e6)+T(" млн"):Math.round(a/1e3)+T(" т"));}
function chartRevProfit(H){
  if(!H.length)return T("<p class=\"muted\">График появится после закрытия первого месяца.</p>");
  const W=640,Ht=230,pl=54,pr=10,pt=12,pb=26,n=Math.max(H.length,6);
  const maxV=Math.max(...H.map(x=>x.revenue),1),minV=Math.min(0,...H.map(x=>x.profit));
  const y=v=>pt+(maxV-v)/(maxV-minV)*(Ht-pt-pb);const bw=(W-pl-pr)/n;
  const ticks=[maxV,maxV/2,0];if(minV<0)ticks.push(minV);
  let g=ticks.map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)" stroke-width="${t===0?1.5:1}"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${mshort(t)}</text>`).join('');
  g+=H.map((x,i)=>`<rect x="${pl+i*bw+bw*.18}" y="${y(x.revenue)}" width="${bw*.64}" height="${Math.max(0,y(0)-y(x.revenue))}" rx="2" fill="var(--accent-soft)" stroke="var(--accent)" stroke-width="1"/><text x="${pl+i*bw+bw/2}" y="${Ht-8}" text-anchor="middle">${MONTHS[x.m%12].slice(0,3)}</text>`).join('');
  const pts=H.map((x,i)=>`${pl+i*bw+bw/2},${y(x.profit)}`).join(' ');
  g+=`<polyline points="${pts}" fill="none" stroke="var(--brass)" stroke-width="2.5"/>`+H.map((x,i)=>`<circle cx="${pl+i*bw+bw/2}" cy="${y(x.profit)}" r="${i===H.length-1?4.5:3}" fill="${x.profit<0?'var(--bad)':'var(--brass)'}"/>`).join('');
  return `<div class="chart tbl-wrap"><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${T("Выручка и прибыль по месяцам")}">${g}</svg></div><div class="legend"><span><i style="background:var(--accent-soft);border:1px solid var(--accent)"></i>${T("Выручка")}</span><span><i style="background:var(--brass)"></i>${T("Чистая прибыль")}</span></div>`;
}
function chartOcc(H){
  if(!H.length)return T("<p class=\"muted\">График появится после закрытия первого месяца.</p>");
  const W=640,Ht=200,pl=40,pr=40,pt=12,pb=26,n=Math.max(H.length,6),bw=(W-pl-pr)/n;
  const y=v=>pt+(1-v)*(Ht-pt-pb),yr=r=>pt+(10-r)/5*(Ht-pt-pb);
  let g=[0,.25,.5,.75,1].map(t=>`<line x1="${pl}" x2="${W-pr}" y1="${y(t)}" y2="${y(t)}" stroke="var(--line)"/><text x="${pl-6}" y="${y(t)+3}" text-anchor="end">${t*100}%</text><text x="${W-pr+6}" y="${y(t)+3}">${(5+t*5).toFixed(0)}</text>`).join('');
  const area=`${pl+bw/2},${y(0)} `+H.map((x,i)=>`${pl+i*bw+bw/2},${y(x.occ)}`).join(' ')+` ${pl+(H.length-1)*bw+bw/2},${y(0)}`;
  g+=`<polygon points="${area}" fill="var(--accent-soft)"/><polyline points="${H.map((x,i)=>`${pl+i*bw+bw/2},${y(x.occ)}`).join(' ')}" fill="none" stroke="var(--accent)" stroke-width="2.5"/>`;
  g+=`<polyline points="${H.map((x,i)=>`${pl+i*bw+bw/2},${yr(clamp(x.rating,5,10))}`).join(' ')}" fill="none" stroke="var(--brass)" stroke-width="2" stroke-dasharray="5 4"/>`;
  g+=H.map((x,i)=>`<text x="${pl+i*bw+bw/2}" y="${Ht-8}" text-anchor="middle">${MONTHS[x.m%12].slice(0,3)}</text>`).join('');
  return `<div class="chart tbl-wrap"><svg viewBox="0 0 ${W} ${Ht}" role="img" aria-label="${T("Загрузка и рейтинг по месяцам")}">${g}</svg></div><div class="legend"><span><i style="background:var(--accent)"></i>${T("Загрузка, левая шкала")}</span><span><i style="background:var(--brass)"></i>${T("Рейтинг, правая шкала (5–10)")}</span></div>`;
}

}

function vBankrupt(){

function renderModal(){
  const el=document.getElementById('modal');const md=ui.modal;
  if(!md){el.hidden=true;el.innerHTML='';return;}
  el.hidden=false;
  el.innerHTML=md.type==='report'?vReport(md):md.type==='bankrupt'?vBankrupt():md.type==='final'?vFinal():md.type==='mission'?vMission():vExport();

}

/* ===================== ДЕЙСТВИЯ ===================== */
const A={
  newGame(){const fio=(document.getElementById('new-fio').value||'').trim().replace(/\s+/g,' '),gr=(document.getElementById('new-group').value||'').trim().toUpperCase();
    if(fio.split(' ').length<2){ui.err=T("Введите фамилию и имя.");return;}if(!gr){ui.err=T("Введите группу.");return;}
    const key=fio+' · '+gr;if(loadAll()[key]){ui.err=T("Такой участник уже есть. Нажмите «Продолжить» справа.");return;}
    ui.err='';S=newState(key);S.fio=fio;S.group=gr;S.team=fio;S.key=key;ui.step='budget';const ref=refADR(S);S.dec.price=Math.round(ref/500)*500;S.dec.mk=S.hotel.rooms*10000;save();},
  load(d){const g=loadAll()[d.t];if(g){S=g;restoreUI(g);}},
  askDel(d){ui.confirmDel=d.t;},cancelDel(){ui.confirmDel=null;},
  delSave(d){const all=loadAll();delete all[d.t];saveAll(all);ui.confirmDel=null;},
  import(){const t=document.getElementById('imp').value;try{const g=decode(t);if(!g||!g.team||!g.hotel)throw 0;const all=loadAll();all[g.key||g.team]=g;saveAll(all);S=g;ui.tab='gm';ui.step=(g.setup&&g.setup.lastStep)||'budget';ui.err='';}catch(e){ui.err=T("Код не распознан. Скопируйте его целиком.");}},
  home(){save();S=null;ui.modal=null;ui.err='';try{localStorage.removeItem(LASTKEY);}catch(e){}},
  set(d){setPath(S,d.k,d.num!==undefined?Number(d.v):d.v);if(d.k.startsWith('hotel')){normalize();if(S.phase==='setup'){S.dec.price=Math.round(refADR(S)/500)*500;S.dec.mk=S.hotel.rooms*10000;}}},
  toggle(d){setPath(S,d.k,!getPath(S,d.k));if(d.k.startsWith('hotel')&&S.phase==='setup')S.dec.price=Math.round(refADR(S)/500)*500;},
  step(d){if(d.v==='staff')syncStaff();ui.step=d.v;S.setup.lastStep=d.v;window.scrollTo(0,0);},
  next(){if(stepCheck())return;const i=stepIdx();const nx=STEPS[i+1].id;if(nx==='staff')syncStaff();ui.step=nx;S.setup.lastStep=nx;window.scrollTo(0,0);},
  tierAll(d){for(const k in S.setup.staff)S.setup.staff[k].tier=Number(d.v);},
  stCount(d){const st=S.setup.staff[d.k];st.count=Math.max(d.k==='gm'?1:0,st.count+Number(d.d));},
  chan(d){const k=d.ch,on=!S.channels[k];
    if(on&&k==='site'&&S.phase==='play'&&!S.paid.site){oneoff(S,T("Запуск сайта"),CH.site.setup);S.paid.site=true;}
    S.channels[k]=on;},
  quiz(d){S.quizAns[d.ch]=Number(d.i);S.quiz[d.ch]=Number(d.i)===CH[d.ch].c;},
  content(d){const k=d.k,on=!S.content[k];if(on&&S.phase==='play'&&CONTENT[k].cost&&!S.paid[k]){oneoff(S,CONTENT[k].n,CONTENT[k].cost);S.paid[k]=true;}S.content[k]=on;},
  acceptOffer(d){const o=S.offers.find(x=>x.id===d.id);if(!o)return;if(corpShare(S)+o.nights/(S.hotel.rooms*30)>.35){ui.toast=T("Договор не подписан: корпоративные клиенты займут больше 35% номерного фонда. Откажитесь от одного из договоров или отклоните запрос.");return;}S.contracts.push({id:o.id,name:o.name,nights:o.nights,rate:Math.round(S.dec.price*(1-o.disc/100)),months:o.months,disc:o.disc});S.offers=S.offers.filter(x=>x.id!==d.id);},
  declineOffer(d){S.offers=S.offers.filter(x=>x.id!==d.id);},
  endContract(d){const c=S.contracts.find(x=>x.id===d.id);if(!c)return;oneoff(S,T("Неустойка: ")+c.name,c.nights*c.rate);S.contracts=S.contracts.filter(x=>x.id!==d.id);},
  open(){openHotel();window.scrollTo(0,0);},
  tab(d){ui.tab=d.v;window.scrollTo(0,0);},
  choose(d){const e=S.events[Number(d.i)];if(!e||e.done)return;const ev=EVENTS.find(x=>x.id===e.id);e.res=ev.ch[Number(d.j)].fx(S,e.p);e.done=true;(S.decLog=S.decLog||[]).push({m:S.month,id:e.id,q:(EVQ[e.id]||[])[Number(d.j)]??1});},
  diag(d){const g=ui.modal&&ui.modal.r&&ui.modal.r.diag;if(!g||g.picked!=null)return;g.picked=Number(d.i);},
  reportDone(d){const md=ui.modal;if(!md||!reportReady(md))return;const g=md.r.diag;if(g)(S.journal=S.journal||[]).push({m:md.r.m,profit:md.r.profit,pick:g.opts[g.picked].t,ok:g.picked===g.correct,main:g.main,plan:(S.journalDraft||'').trim()});S.journalDraft='';ui.modal=d.next==='final'?{type:'final'}:d.next==='bankrupt'?{type:'bankrupt'}:null;},
  copyPortfolio(){const t=portfolioText(),out=document.getElementById('pcopied');try{navigator.clipboard.writeText(t).then(()=>{out.textContent=T("Скопировано");},()=>{out.textContent=T("Не удалось скопировать");});}catch(e){out.textContent=T("Не удалось скопировать");}return 'norender';},
  tier(d){ui.hireTier=Number(d.v);},
  hire(d){if(S.tasks&&S.tasks[d.k]&&S.tasks[d.k].noStaff&&!S.tasks[d.k].done)S.tasks[d.k].noStaff=false;const dep=S.depts[d.k],t=TIERS[ui.hireTier];dep.skill=(dep.skill*dep.count+t.skill)/(dep.count+1);dep.morale=(dep.morale*dep.count+75)/(dep.count+1);dep.count++;if(t.fee)oneoff(S,T("Найм: ")+DEPTS[d.k].sh,t.fee);},
  fire(d){const dep=S.depts[d.k];if(!dep.count)return;dep.count--;oneoff(S,T("Компенсация при увольнении: ")+DEPTS[d.k].sh,wage(S,d.k)*dep.pay);dep.morale=clamp(dep.morale-4,0,100);},
  train(d){const sel=document.getElementById('tr-'+d.k)||(S.demo?{value:'complaint'}:null);if(!sel)return;const t=TRAIN[sel.value],dep=S.depts[d.k];
    oneoff(S,T("Тренинг: ")+t.n,t.cost*Math.max(1,dep.count));dep.skill=Math.min(98,dep.skill+t.skill);dep.morale=clamp(dep.morale+t.morale,0,100);
    if(t.safety)S.flags.safety=6;if(t.upsell)S.flags.upsell=Math.max(S.flags.upsell||0,t.upsell);if(t.rating)S.mod.rating+=t.rating;S.trained[d.k]=sel.value;},
  close(){if(S.events.some(e=>!e.done)||openTasks(S))return;closeMonth();},
  taskDone(d){taskFinish(d.k);},
  secPick(d){const t=S.tasks.sec;if(!t||t.done)return;t.sits[Number(d.i)].pick=Number(d.j);},
  closeModal(){ui.modal=null;},
  final(){ui.modal={type:'final'};},
  bankrupt(){ui.modal={type:'bankrupt'};},
  lang(d){if(S)save();try{localStorage.setItem('hotelsim.lang',d.v);}catch(e){}location.reload();return 'norender';},
  dlPDF(){downloadPDF();return 'norender';},
  dlPNG(){downloadPNG();return 'norender';},
  demoFinal(){
    S=newState(T("Ахметова Дана"));S.fio=T("Ахметова Дана");S.group=T("ГД-31");S.demo=true;Object.assign(S.hotel,{name:'Esil Garden',city:'ast',type:'biz',star:3,rooms:60});S.budget=1.4e9;normalize();
    ui.step='staff';syncStaff();for(const k in CONTENT)S.content[k]=true;['booking','ostrovok','bronevik'].forEach(k=>{S.channels[k]=true;S.quizAns[k]=CH[k].c;S.quiz[k]=true;});
    S.quizAns.trip=1;S.quiz.trip=false;S.dec.price=Math.round(refADR(S)/500)*500;S.dec.mk=600000;ui.step='price';openHotel();
    const PLANS={season:T("Низкий сезон: снизим BAR на 5–8%, усилим корпоративные продажи и акцию на Ostrovok, чтобы удержать загрузку."),price:T("Вернём цену к рыночному ориентиру и будем менять её по сезону, следя за RevPAR, а не только за загрузкой."),rating:T("Проведём тренинг по работе с жалобами, будем отвечать на каждый отзыв в течение суток."),reach:T("Подключим Trip.com, доработаем карточку и фото, проверим паритет цен."),staff:T("Наймём недостающих сотрудников в хаускипинг и на ресепшн, чтобы снять переработки."),oneoff:T("Заложим резерв на аварии, увеличим бюджет техобслуживания, чтобы не тратиться на срочные ремонты."),corp:T("Отдел продаж обзвонит 10 компаний, предложим корпоративный тариф со скидкой 15%.")};
    for(let m=0;m<12;m++){
      S.events.forEach((e,i)=>{const q=EVQ[e.id]||[1];const best=Math.random()<.8?q.indexOf(Math.max(...q)):Math.floor(Math.random()*q.length);A.choose({i:String(i),j:String(best)});});
      S.offers.slice().forEach(o=>{if(S.hotel.star>=o.minStar)A.acceptOffer({id:o.id});});ui.toast='';
      for(const k in DEPTS){const n=DEPTS[k].norm(S.hotel);while(S.depts[k].count<n){ui.hireTier=1;A.hire({k});}}
      if(m===2)A.train({k:'fo'});
      autoTasks(S,.85);

      closeMonth();
      const md=ui.modal,g=md.r.diag;const ok=Math.random()<.75;g.picked=ok?g.correct:(g.correct+1)%g.opts.length;
      const fk=monthFactors.length&&Object.keys(PLANS).find(k=>g.main.toLowerCase().includes({season:T("сезон"),price:T("цена"),rating:T("рейтинг"),reach:T("канал"),staff:T("персонал"),oneoff:T("разовые"),corp:T("корпоративн")}[k]))||'reach';
      S.journalDraft=PLANS[fk];A.reportDone({next:'close'});
    }
    ui.modal={type:'final'};
  },

    return 'norender';}
};

  const TX=120,TW=180,TT=70,TB=330,NF=12,NC=8,fh=(TB-TT)/NF,cw=TW/NC;let panes='',lit='';
  for(let f=0;f<NF;f++)for(let c=0;c<NC;c++){const x=TX+c*cw,y=TT+f*fh;
    panes+=`<rect x="${(x+1.2).toFixed(1)}" y="${(y+1.2).toFixed(1)}" width="${(cw-2.4).toFixed(1)}" height="${(fh-2.4).toFixed(1)}" fill="url(#glass)"/>`;
    if(hs(f*17+c*3)<.62){const warm=hs(f+c*9)<.75;lit+=`<rect class="u-win" x="${(x+1.2).toFixed(1)}" y="${(y+1.2).toFixed(1)}" width="${(cw-2.4).toFixed(1)}" height="${(fh-2.4).toFixed(1)}" fill="${warm?'url(#warm)':'url(#cool)'}" style="--d:${(3.3+hs(f*5+c)*1.6).toFixed(2)}s"/>`;}}
  let mull='';for(let c=0;c<=NC;c++)mull+=`<rect x="${(TX+c*cw-.8).toFixed(1)}" y="${TT}" width="1.6" height="${TB-TT}" fill="#0B1A24"/>`;
  for(let f=0;f<=NF;f++)mull+=`<rect x="${TX}" y="${(TT+f*fh-1).toFixed(1)}" width="${TW}" height="2" fill="#0B1A24"/>`;
  // фон: силуэты города

    for(let k=0;k<5;k++)if(hs(i*11+k)<.5)city+=`<rect class="u-cw" x="${(x+4+hs(i+k)*(w-10)).toFixed(0)}" y="${(330-h+8+k*14).toFixed(0)}" width="3" height="4" fill="#F3C878" style="--d:${(1+hs(i*k+2)*3).toFixed(2)}s"/>`;}

    <div class="sp-text"><span class="sp-eyebrow">${T("Учебный тренажёр · III курс")}</span><h1 class="sp-title">URBAN HOTEL <span>·</span> ${T("Симулятор")}</h1>
    <span class="sp-sub">${T("Операционный менеджмент гостиницы: от концепции до отчёта инвестору")}</span>
    <div class="sp-load"><div class="sp-track"><b></b></div><div class="sp-dots">${steps.map(x=>`<i style="--d:${(x[0]+.8).toFixed(2)}s"></i>`).join('')}</div><span class="sp-status mono" id="sp-status"></span></div></div></div>
    <div class="sp-stage">${svg}${chips}</div><span class="sp-skip">${T("Нажмите, чтобы пропустить")}</span>`;
  const st=document.getElementById('sp-status');st.textContent=steps[0][1];
  const timers=steps.slice(1).map(x=>setTimeout(()=>{st.textContent=x[1];st.classList.remove('flip');void st.offsetWidth;st.classList.add('flip');},(x[0]+.8)*1000));
  let finished=false,flying=false,main;const hd=document.getElementById('hero-logo');if(hd)hd.style.visibility='hidden';
  const finish=()=>{if(finished)return;finished=true;timers.forEach(clearTimeout);clearTimeout(main);const h=document.getElementById('hero-logo');if(h)h.style.visibility='';sp.remove();};
  const fly=()=>{if(flying)return;flying=true;timers.forEach(clearTimeout);st.textContent=steps[steps.length-1][1];
    const lg=document.getElementById('sp-logo'),h=document.getElementById('hero-logo');
    const a=lg.getBoundingClientRect(),b=h?h.getBoundingClientRect():null;lg.style.animation='none';
    if(reduce||!b||!a.width||!b.width||b.top>innerHeight){finish();return;}
    sp.classList.add('out');lg.style.transition='transform .9s cubic-bezier(.65,0,.25,1)';
    lg.style.transform=`translate(${b.left-a.left}px,${b.top-a.top}px) scale(${b.width/a.width})`;
    lg.addEventListener('transitionend',finish,{once:true});setTimeout(finish,1000);};
  main=setTimeout(fly,reduce?900:7800);
  sp.addEventListener('click',()=>{clearTimeout(main);fly();});
  document.addEventListener('keydown',function k(e){if(e.key==='Escape'||e.key==='Enter'||e.key===' '){document.removeEventListener('keydown',k);clearTimeout(main);fly();}});
}
autoResume();
render();
splash();
</script>

</body></html>
